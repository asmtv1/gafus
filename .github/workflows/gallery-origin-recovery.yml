name: Gallery Origin — inspect, start or delete suspended Container App

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Inspect, start or delete the single suspended Gallery Origin'
        type: choice
        required: true
        default: inspect
        options: [inspect, start, delete]
      confirmation:
        description: 'For delete, type DELETE_SUSPENDED_GAFUS_GALLERY_ORIGIN'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: gafus-cloudru-gallery-origin-recovery
  cancel-in-progress: false

jobs:
  gallery-origin:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    env:
      CLOUDRU_PROJECT_ID: ${{ secrets.CLOUDRU_PROJECT_ID }}
      CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
      CLOUDRU_KEY_SECRET: ${{ secrets.CLOUDRU_KEY_SECRET }}
      GAFUS_GALLERY_ORIGIN_START_CONFIRM: ${{ inputs.confirmation }}
      GALLERY_CDN_SECRET: ${{ secrets.GALLERY_CDN_SECRET }}
      FEED_CDN_SECRET: ${{ secrets.FEED_CDN_SECRET }}
      FEED_CDN_PUBLIC_READ_APPROVED: ${{ vars.FEED_CDN_PUBLIC_READ_APPROVED || 'false' }}
      BEGET_GALLERY_SMOKE_FINAL_KEY: ${{ vars.BEGET_GALLERY_SMOKE_FINAL_KEY }}
      BEGET_GALLERY_SMOKE_SHA256: ${{ vars.BEGET_GALLERY_SMOKE_SHA256 }}
      BEGET_FEED_SMOKE_FINAL_KEY: ${{ vars.BEGET_FEED_SMOKE_FINAL_KEY }}
      BEGET_FEED_SMOKE_SHA256: ${{ vars.BEGET_FEED_SMOKE_SHA256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify single-resource recovery guard
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            inspect) test -z "$GAFUS_GALLERY_ORIGIN_START_CONFIRM" ;;
            start) test "$GAFUS_GALLERY_ORIGIN_START_CONFIRM" = 'START_SUSPENDED_GALLERY_ORIGIN_ONLY' ;;
            delete) test "$GAFUS_GALLERY_ORIGIN_START_CONFIRM" = 'DELETE_SUSPENDED_GAFUS_GALLERY_ORIGIN' ;;
            *) echo 'INVALID_GALLERY_ORIGIN_OPERATION'; exit 1 ;;
          esac
      - name: Read status or start ONLY an operator-suspended Gallery Origin
        env:
          OPERATION: ${{ inputs.operation }}
        run: node infra/cloudru/gallery-origin-recover.mjs "--$OPERATION"
      - name: Verify Beget CDN serves exact published Gallery and Feed fixtures (read-only)
        if: inputs.operation == 'start'
        run: node infra/cloudru/beget-production-smoke.mjs
