name: 'Internal / Publish Chat2 360p Video Image'

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PUBLISH_CHAT2_360_IMAGE; publishes image only, never modifies Jobs'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gafus-chat2-360-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH_CHAT2_360_IMAGE'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Verify Chat2 360p-only contracts before publishing
        run: |
          pnpm install --frozen-lockfile
          pnpm test:cloudru-media
          node ci-cd/scripts/media-pipeline-guard.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to isolated Chat2 Registry
        uses: docker/login-action@v3
        with:
          registry: gafus-chat2-20261028.cr.cloud.ru
          username: ${{ secrets.CHAT2_CLOUDRU_KEY_ID }}
          password: ${{ secrets.CHAT2_CLOUDRU_KEY_SECRET }}
      - name: Publish only immutable Chat2 Video 360p worker image
        run: bash ci-cd/scripts/publish-cloudru-image.sh chat video Dockerfile.chat2-job "$GITHUB_SHA"
      - name: Report immutable image digest
        run: docker buildx imagetools inspect "gafus-chat2-20261028.cr.cloud.ru/gafus-chat-video:${GITHUB_SHA}" | head -n 20
