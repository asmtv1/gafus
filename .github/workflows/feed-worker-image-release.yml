name: 'Internal / Publish Feed 360p Worker Image'

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PUBLISH_FEED_360_IMAGE to publish immutable image; no Job update'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gafus-feed-360-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH_FEED_360_IMAGE'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Verify feed-only 360p worker contracts
        run: |
          pnpm install --frozen-lockfile
          pnpm test:cloudru-media
          node ci-cd/scripts/media-pipeline-guard.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: gafus.cr.cloud.ru
          username: ${{ secrets.CLOUDRU_KEY_ID }}
          password: ${{ secrets.CLOUDRU_KEY_SECRET }}
      - name: Publish immutable 360p-only Feed Worker (does not deploy Jobs)
        run: bash ci-cd/scripts/publish-cloudru-image.sh feed worker Dockerfile "$GITHUB_SHA"
      - name: Report immutable image digest
        run: |
          docker buildx imagetools inspect "gafus.cr.cloud.ru/gafus-feed-worker:${GITHUB_SHA}" | head -n 12
