name: Daily Database Backup to Yandex Disk

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gafus-database-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Run append-only PostgreSQL backup on production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.GAFUS_SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 20m
          script_stop: true
          envs: YANDEX_DISK_TOKEN
          script: bash /root/gafus/ci-cd/scripts/backup-to-yandex.sh
        env:
          YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}

  # Activate only after provisioning a dedicated, non-root backup runner,
  # read-only database role, independent archive and approved retention.
  # The existing database-only backup is intentionally not a dependency.
  external-backup:
    if: github.ref == 'refs/heads/main' && vars.GAFUS_EXTERNAL_BACKUP_ENABLED == 'true'
    runs-on: [self-hosted, linux, gafus-backup]
    timeout-minutes: 180
    environment: external-backup
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture encrypted DB and S3 snapshot in independent storage
        env:
          GAFUS_EXTERNAL_BACKUP_CAPTURE_APPROVED: encrypted-independent-archive
          GAFUS_EXTERNAL_BACKUP_CONFIG: /var/lib/gafus-backup/config.json
          GAFUS_EXTERNAL_BACKUP_KEY_FILE: /var/lib/gafus-backup/key.bin
          GAFUS_EXTERNAL_BACKUP_SCRATCH: /var/lib/gafus-backup/scratch
          GAFUS_EXTERNAL_BACKUP_PG_BIN: /opt/gafus-backup/pg/bin
          GAFUS_EXTERNAL_BACKUP_PG_SERVICE_FILE: /var/lib/gafus-backup/pg_service.conf
          GAFUS_EXTERNAL_BACKUP_PG_PASS_FILE: /var/lib/gafus-backup/pgpass
        run: bash ci-cd/scripts/external-backup/scheduled-capture.sh
