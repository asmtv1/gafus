name: Diagnose Feed public CDN access (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feed-cdn-diagnostic:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 4
    env:
      FEED_CDN_BASE_URL: https://quepraquiecebquomiel.begetcdn.cloud
      FEED_BEGET_CDN_SERVICE_ID: cbb7fe86-a193-457e-a756-9cf3aa2aef1b
      BEGET_FEED_SMOKE_FINAL_KEY: ${{ vars.BEGET_FEED_SMOKE_FINAL_KEY }}
      BEGET_FEED_SMOKE_SHA256: ${{ vars.BEGET_FEED_SMOKE_SHA256 }}
      BEGET_CDN_API_TOKEN: ${{ secrets.BEGET_CDN_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Inspect CDN, public S3 and Beget service without mutations
        run: node infra/cloudru/beget-feed-edge-diagnostics.mjs --check
