name: GAFUS production app-only (Cloud.ru Jobs unchanged)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only server preflight; no application deployment'
        type: choice
        options: [preflight, diagnose, deploy, recover]
        required: true
      release_sha:
        description: 'Exact previously verified main commit SHA; required for deploy'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: gafus-production-deploy
  cancel-in-progress: false

jobs:
  server-preflight:
    if: github.ref == 'refs/heads/main' && (inputs.mode == 'preflight' || inputs.mode == 'diagnose')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - name: Read-only VPS and migration inventory (no secrets, no mutations)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 185.239.51.125
          username: root
          key: ${{ secrets.GAFUS_SERVER_SSH_KEY }}
          port: 22
          # The script itself uses set -euo pipefail. ssh-action script_stop
          # injects shell fragments between lines, corrupting loops/heredocs.
          script_stop: false
          command_timeout: 8m
          script: |
            set -euo pipefail
            root=/root/gafus
            test -d "$root/.git" || { echo 'MISSING_EXISTING_PRODUCTION_REPO'; exit 1; }
            echo "CURRENT_SHA=$(git -C "$root" rev-parse HEAD)"
            echo "PRODUCTION_REPOSITORY_PRESENT=YES"
            echo "DOCKER_COMPOSE_INSTALLED=$(command -v docker-compose >/dev/null && echo YES || echo NO)"
            echo 'PRODUCTION_CONTAINERS:'
            for name in gafus-postgres gafus-redis gafus-nginx gafus-web gafus-api gafus-worker gafus-trainer-panel gafus-admin-panel gafus-bull-board gafus-chat2-centrifugo; do
              echo "$name:$(docker inspect --format '{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{else}}no-health{{end}}' "$name" 2>/dev/null || echo absent)"
            done
            echo "NGINX_CONFIG_VALID=$(docker exec gafus-nginx nginx -t >/dev/null 2>&1 && echo YES || echo NO)"
            echo "MAINTENANCE_GATE=$(test -f "$root/ci-cd/nginx/conf.d/.release-maintenance" && echo ON || echo OFF)"
            echo 'POSTGRES_MIGRATIONS_BEGIN'
            docker exec gafus-postgres psql -U gafus -d gafus -Atc "select migration_name from "_prisma_migrations" where finished_at is not null and rolled_back_at is null order by migration_name;"
            echo 'POSTGRES_MIGRATIONS_END'
            echo 'PRODUCTION_ENV_FLAGS:'
            envfile="$root/ci-cd/docker/.env"
            test -f "$envfile" || { echo 'PRODUCTION_ENV_MISSING'; exit 1; }
            for name in CLOUDRU_MEDIA_JOBS_ENABLED GALLERY_PROCESSOR_SECOND_READY FEED_CLOUDRU_REFRACTOR_VERIFIED QUESTIONS_V2_MEDIA_ENABLED CHAT2_V2_MEDIA_ENABLED CHAT2_API_ENABLED CHAT2_WORKER_ENABLED CHAT2_LEGACY_RETIRE_ENABLED FEED_ENABLED; do
              value="$(sed -n "s/^${name}=//p" "$envfile" | tail -1)"
              case "$value" in
                true|false|enabled|disabled) echo "$name=$value" ;;
                *) echo "$name=UNSET_OR_NONBOOLEAN" ;;
              esac
            done
            for name in GALLERY_CDN_BASE_URL FEED_CDN_BASE_URL QUESTIONS_V2_CDN_BASE_URL CHAT2_V2_CDN_BASE_URL GALLERY_BEGET_CDN_SERVICE_ID FEED_BEGET_CDN_SERVICE_ID CHAT2_S3_ACCESS_KEY_ID CHAT2_S3_SECRET_ACCESS_KEY FEED_INTERNAL_HMAC_SECRET GALLERY_DEV_INTERNAL_HMAC_SECRET QUESTIONS_V2_INTERNAL_HMAC_SECRET; do
              if grep -q "^${name}=.." "$envfile"; then
                echo "${name}_PRESENT=YES"
              else
                echo "${name}_PRESENT=NO"
              fi
            done
            echo 'SERVER_DISK_FREE:'
            df -h / | tail -1 | awk '{print $4 " free of " $2}'
            echo 'READ_ONLY_PREFLIGHT_COMPLETE'
            if [ '${{ inputs.mode }}' = diagnose ]; then
              echo 'SAFE_API_DIAGNOSTIC_BEGIN'
              for name in gafus-postgres gafus-redis gafus-nginx gafus-web gafus-api gafus-worker gafus-trainer-panel gafus-admin-panel gafus-bull-board gafus-chat2-centrifugo; do
                docker inspect --format "${name} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restarts={{.RestartCount}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}}" "$name" 2>/dev/null || echo "$name ABSENT"
              done
              echo 'API_HEALTHCHECK_OUTPUT:'
              docker inspect --format '{{range .State.Health.Log}}{{.ExitCode}} {{.Output}}{{end}}' gafus-api 2>/dev/null | cut -c1-300 || true
              echo 'API_RECENT_ERROR_CATEGORIES:'
              docker logs --tail 180 gafus-api 2>&1 | python3 -c 'import sys,re; words=("error","fatal","missing","invalid","uncaught","fail","exception","prisma","chat2","required"); lines=[x.rstrip() for x in sys.stdin if any(w in x.lower() for w in words)]; redact=lambda x:re.sub(r"(?i)([a-z_]*(?:secret|token|password|api_key|access_key|private_key|jwt|database_url|redis_url)[a-z_]*[=:]\s*)[^\s,;]+",r"\1[REDACTED]",x); print("\n".join(redact(x)[:270] for x in lines[-45:]))'
              echo 'PROD_RELEASE_MARKERS:'
              ls -ld /root/gafus-release-backups/41150071782-1/production-pre-migrate.dump 2>/dev/null | awk '{print $5 " bytes, backup present"}' || true
              for marker in migration-started migration-complete; do test -f "/root/gafus-release-backups/41150071782-1/$marker" && echo "$marker=YES" || echo "$marker=NO"; done
              echo 'SAFE_API_DIAGNOSTIC_COMPLETE'
            fi

  validate-app-release:
    if: github.ref == 'refs/heads/main' && (inputs.mode == 'deploy' || inputs.mode == 'recover')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require a fully successful verified main CI with all seven images
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'BAD_RELEASE_SHA'; exit 1; }
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD || { echo 'RELEASE_NOT_ON_MAIN'; exit 1; }
          gh api "repos/$GH_REPO/actions/runs?head_sha=$RELEASE_SHA&event=push&per_page=30" --jq '.workflow_runs[] | select(.name == "CI/CD Pipeline" and .conclusion == "success") | .id' > "$RUNNER_TEMP/app-release-runs"
          test -s "$RUNNER_TEMP/app-release-runs" || { echo 'NO_SUCCESSFUL_RELEASE_CI'; exit 1; }
          verified=false
          while read -r run; do
            gh api --paginate "repos/$GH_REPO/actions/runs/$run/jobs?per_page=100" --jq '.jobs[] | [.name,.conclusion] | @tsv' > "$RUNNER_TEMP/app-release-jobs"
            count=$(awk -F '\t' '$1 ~ /^build-images \(/ && $2 == "success" {n++} END {print n+0}' "$RUNNER_TEMP/app-release-jobs")
            if [ "$count" = 7 ] && grep -q $'build-apps\tsuccess' "$RUNNER_TEMP/app-release-jobs" && grep -q $'security\tsuccess' "$RUNNER_TEMP/app-release-jobs" && grep -q $'cloudru-media-contracts\tsuccess' "$RUNNER_TEMP/app-release-jobs"; then
              verified=true; break
            fi
          done < "$RUNNER_TEMP/app-release-runs"
          [ "$verified" = true ] || { echo 'RELEASE_IMAGES_OR_SECURITY_NOT_VERIFIED'; exit 1; }
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo 'APP_ONLY_RELEASE_PROVENANCE_VERIFIED=7_IMAGES_AND_TESTS'

  recover-api-after-migration:
    # This mode resumes ONLY the already-migrated 41150071782 app-only rollout.
    # No DB migrations or schema rollback, no Cloud.ru Job mutations.
    needs: [validate-app-release]
    if: github.ref == 'refs/heads/main' && inputs.mode == 'recover'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Resume migrated production with seven verified images, no Cloud Jobs
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: 185.239.51.125
          username: root
          key: ${{ secrets.GAFUS_SERVER_SSH_KEY }}
          port: 22
          envs: GHCR_TOKEN
          script_stop: false
          command_timeout: 40m
          script: |
            set -euo pipefail
            root=/root/gafus
            sha='${{ needs.validate-app-release.outputs.release_sha }}'
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || { echo 'INVALID_RECOVERY_SHA'; exit 1; }
            release=/root/gafus-release-backups/41150071782-1
            compose="$root/ci-cd/docker/docker-compose.prod.yml"
            gate="$root/ci-cd/nginx/conf.d/.release-maintenance"
            envfile="$root/ci-cd/docker/.env"
            test -f "$release/migration-started" && test -f "$release/migration-complete" || { echo 'NOT_FULLY_MIGRATED_ABORT'; exit 1; }
            test -f "$gate" && test -s "$release/production-pre-migrate.dump" && test -f "$envfile" || { echo 'MISSING_MAINTENANCE_OR_BACKUP_ABORT'; exit 1; }
            docker exec -i gafus-postgres pg_restore --list < "$release/production-pre-migrate.dump" >/dev/null || { echo 'INVALID_MIGRATION_BACKUP'; exit 1; }
            # Prisma ledger must be completely settled, including no failed migration.
            n=$(docker exec gafus-postgres psql -X -U gafus -d gafus -Atc 'select count(*) from "_prisma_migrations" where finished_at is not null and rolled_back_at is null')
            pending=$(docker exec gafus-postgres psql -X -U gafus -d gafus -Atc 'select count(*) from "_prisma_migrations" where finished_at is null and rolled_back_at is null')
            [ "$n" = 162 ] && [ "$pending" = 0 ] || { echo "MIGRATIONS_NOT_COMPLETE_${n}_${pending}"; exit 1; }
            # nginx -t resolves upstream hostnames. The broken API is currently
            # crash-looping, so early nginx -t cannot resolve gafus-api.
            # Keep HTTPS maintenance in place and validate nginx only AFTER
            # replacement API is healthy (below, and in verify/open).
            echo 'MIGRATIONS_AND_SNAPSHOT_VERIFIED=162_OF_162'
            mkdir -p /root/gafus-release-backups/recovery-${{ github.run_id }}
            cp -p "$envfile" /root/gafus-release-backups/recovery-${{ github.run_id }}/previous.env
            chmod 600 /root/gafus-release-backups/recovery-${{ github.run_id }}/previous.env
            # Preserve all live secrets and existing Gallery/Questions/Chat CDN;
            # switch only the incorrectly pinned retired Feed host to the known
            # current Feed Media V2 Beget HTTPS origin (no provider writes).
            grep -q '^FEED_CDN_BASE_URL=' "$envfile" || { echo 'FEED_CDN_ENV_MISSING'; exit 1; }
            sed -i 's#^FEED_CDN_BASE_URL=.*#FEED_CDN_BASE_URL=https://quepraquiecebquomiel.begetcdn.cloud#' "$envfile"
            chmod 600 "$envfile"
            git -C "$root" fetch origin >/dev/null
            git -C "$root" merge-base --is-ancestor "$sha" origin/main || { echo 'RECOVERY_SHA_NOT_MAIN'; exit 1; }
            git -C "$root" reset --hard "$sha" >/dev/null
            echo "RELEASE_SOURCE_SHA=$sha"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u asmtv1 --password-stdin >/dev/null
            unset GHCR_TOKEN
            images=(gafus-web gafus-trainer-panel gafus-admin-panel gafus-api gafus-worker gafus-bull-board gafus-prisma)
            for image in "${images[@]}"; do
              docker pull "ghcr.io/asmtv1/$image:sha-$sha" >/dev/null
              docker tag "ghcr.io/asmtv1/$image:sha-$sha" "ghcr.io/asmtv1/$image:latest"
              echo "VERIFIED_IMAGE=$image:sha-$sha"
            done
            docker-compose -f "$compose" config --quiet
            docker-compose -f "$compose" --profile chat2 up -d --no-deps chat2-centrifugo
            docker-compose -f "$compose" up -d --no-deps --force-recreate worker api
            docker-compose -f "$compose" up -d --no-deps --force-recreate web trainer-panel admin-panel bull-board
            for service in web trainer-panel admin-panel api worker bull-board; do
              ready=false
              for i in $(seq 1 45); do
                state=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "gafus-$service" 2>/dev/null || true)
                if [ "$state" = healthy ] || [ "$state" = running ]; then ready=true; break; fi
                [ "$state" = unhealthy ] || [ "$state" = exited ] && break
                sleep 3
              done
              if [ "$ready" != true ]; then echo "RECOVERY_CONTAINER_UNHEALTHY=$service"; exit 1; fi
              echo "CONTAINER_HEALTHY=$service"
            done
            docker-compose -f "$compose" up -d --no-deps --force-recreate nginx
            docker exec gafus-nginx nginx -t >/dev/null
            export DEPLOY_ROOT="$root" COMPOSE_PROD="$compose" RELEASE_BACKUP_DIR="$release"
            bash "$root/ci-cd/scripts/production-schema-cutover.sh" verify
            bash "$root/ci-cd/scripts/production-schema-cutover.sh" open
            echo 'MAINTENANCE_GATE_OPENED'
            for endpoint in https://gafus.ru/ https://gafus.ru/api/ping https://api.gafus.ru/ready; do
              curl -fsS --max-time 15 -o /dev/null "$endpoint" || { echo "PROD_HTTP_NOT_READY=$endpoint"; exit 1; }
              echo "PROD_ENDPOINT_OK=$endpoint"
            done
            # Prisma is a one-shot migration image, not a running service.
            # Verify the six long-lived app containers against exact immutable
            # SHA images; the seventh Prisma image was checked at pull time.
            for image in gafus-web gafus-trainer-panel gafus-admin-panel gafus-api gafus-worker gafus-bull-board; do
              actual=$(docker image inspect "ghcr.io/asmtv1/$image:sha-$sha" --format '{{.Id}}')
              running=$(docker inspect "gafus-${image#gafus-}" --format '{{.Image}}')
              [ "$actual" = "$running" ] || { echo "RELEASE_IMAGE_MISMATCH=$image"; exit 1; }
            done
            for service in web api worker trainer-panel admin-panel bull-board; do
              docker inspect --format "gafus-${service} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}no-health{{end}} restarts={{.RestartCount}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}}" "gafus-$service"
              restarts=$(docker inspect --format '{{.RestartCount}}' "gafus-$service")
              oom=$(docker inspect --format '{{.State.OOMKilled}}' "gafus-$service")
              [ "$restarts" = 0 ] && [ "$oom" = false ] || { echo "RESTART_OR_OOM=$service"; exit 1; }
            done
            echo 'APPLICATION_RECOVERY_VERIFIED_NO_CLOUDRU_JOB_CHANGES'

  deploy-app-only:
    needs: [validate-app-release]
    if: github.ref == 'refs/heads/main' && inputs.mode == 'deploy'
    uses: ./.github/workflows/production-deploy-reusable.yml
    with:
      release_sha: ${{ needs.validate-app-release.outputs.release_sha }}
      app_only: true
    secrets: inherit
