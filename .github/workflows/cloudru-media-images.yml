name: Build Cloud.ru media images

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish reviewed images to Cloud.ru Registry (never deploy automatically)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify-media-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate CORS, images, protected CDN and owner media migration
        run: pnpm test:cloudru-media
      - name: Cloud.ru registry publication retry and source-pin acceptance tests
        run: |
          python3 ci-cd/scripts/upload-cloudru-oci.test.py
          node --test ci-cd/scripts/cloudru-publish-retry.test.mjs infra/cloudru/worker-image-pins.test.mjs
  build:
    needs: verify-media-contracts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { media: feed, role: worker, dockerfile: Dockerfile }
          - { media: gallery, role: worker, dockerfile: Dockerfile }
          - { media: questions, role: worker, dockerfile: Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux OCI archive for review (no deployment)
        if: ${{ !inputs.publish }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.media }}-cloud/${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: gafus-${{ matrix.media }}-${{ matrix.role }}:${{ github.sha }}
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.media }}-${{ matrix.role }}.tar
          push: false
      - name: Save review artifact
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: cloudru-${{ matrix.media }}-${{ matrix.role }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.media }}-${{ matrix.role }}.tar
          retention-days: 3
          compression-level: 0
      - name: Authenticate to private Cloud.ru registry
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: gafus.cr.cloud.ru
          username: ${{ secrets.CLOUDRU_KEY_ID }}
          password: ${{ secrets.CLOUDRU_KEY_SECRET }}
      - name: Publish immutable revision-tagged image (no deployment, retry transient registry errors)
        if: ${{ inputs.publish }}
        run: |
          bash ci-cd/scripts/publish-cloudru-image.sh "${{ matrix.media }}" "${{ matrix.role }}" "${{ matrix.dockerfile }}" "${{ github.sha }}"
      - name: Report independently pinned digest and source tree for reviewed publication
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          tag="gafus.cr.cloud.ru/gafus-${{ matrix.media }}-worker:${{ github.sha }}"
          digest=''
          for attempt in 1 2 3 4; do
            inspect="$(docker buildx imagetools inspect "$tag" 2>/dev/null)" && \
              digest="$(printf '%s\n' "$inspect" | awk '$1 == "Digest:" {print $2; exit}')" || true
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] && break
            sleep 15
          done
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'Registry image digest not available'; exit 1; }
          image="gafus.cr.cloud.ru/gafus-${{ matrix.media }}-worker@$digest"
          # Inspect the exact digest, not a mutable image tag.
          docker manifest inspect --verbose "$image" > "$RUNNER_TEMP/pinned-manifest.json"
          node - "$RUNNER_TEMP/pinned-manifest.json" <<'NODE'
          const fs=require('fs');const v=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const descriptors=Array.isArray(v)?v:[v];
          if(!descriptors.some(x=>x.Descriptor?.platform?.architecture==='amd64'))process.exit(1);
          NODE
          source="$(node infra/cloudru/worker-image-pins.mjs --source '${{ matrix.media }}')"
          echo "WORKER_PIN_MEDIA=${{ matrix.media }}"
          echo "WORKER_PIN_IMAGE=$image"
          echo "WORKER_PIN_SOURCE=$source"
          echo 'Use the authenticated operator to set BOTH matching production variables before manually applying Jobs.'
