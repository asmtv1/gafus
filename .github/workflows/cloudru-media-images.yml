name: Cloud.ru registry transport diagnosis
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Diagnose registry API and temporary upload without deployment
        env:
          CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          CLOUDRU_KEY_SECRET: ${{ secrets.CLOUDRU_KEY_SECRET }}
          CLOUDRU_PROJECT_ID: ${{ secrets.CLOUDRU_PROJECT_ID }}
        run: python3 ci-cd/scripts/diagnose-registry.py
