name: Build Cloud.ru media images

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish reviewed images to Cloud.ru Registry (never deploy automatically)"
        type: boolean
        required: true
        default: false
      target:
        description: "Isolated image target (questions never deploys or modifies Feed/Gallery)"
        type: choice
        required: true
        default: existing
        options:
          - existing
          - questions
      provision_real_questions_job:
        description: "Create ONLY production gafus-questions-photo Cloud.ru Job (no execution, no app deploy)"
        type: boolean
        required: true
        default: false
      smoke_real_questions_job:
        description: "Execute existing production Questions Job ONCE on isolated disposable PNG"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify-media-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate CORS, images, protected CDN and owner media migration
        run: pnpm test:cloudru-media
      - name: Cloud.ru registry publication retry acceptance tests
        run: node --test ci-cd/scripts/cloudru-publish-retry.test.mjs
      - name: Validate isolated Questions worker types
        if: ${{ inputs.target == 'questions' }}
        run: pnpm exec tsc -p apps/questions-cloud/tsconfig.json
  provision-questions-job:
    if: ${{ inputs.target == 'questions' && inputs.provision_real_questions_job && !inputs.publish }}
    needs: verify-media-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit existing production Questions Job (read-only)
        env:
          CLOUDRU_PROJECT_ID: ${{ secrets.CLOUDRU_PROJECT_ID }}
          CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          CLOUDRU_KEY_SECRET: ${{ secrets.CLOUDRU_KEY_SECRET }}
          CLOUDRU_S3_ACCESS_KEY_ID: ${{ secrets.CLOUDRU_S3_ACCESS_KEY_ID }}
          CLOUDRU_S3_SECRET_ACCESS_KEY: ${{ secrets.CLOUDRU_S3_SECRET_ACCESS_KEY }}
        run: node infra/cloudru/questions-production-job-create.mjs --audit

  smoke-questions-job:
    if: ${{ inputs.target == 'questions' && inputs.smoke_real_questions_job && !inputs.publish && !inputs.provision_real_questions_job }}
    needs: verify-media-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies for isolated S3 smoke
        run: pnpm install --frozen-lockfile
      - name: Execute existing production Questions Job on synthetic PNG; verify private WebP and cleanup
        env:
          CLOUDRU_PROJECT_ID: ${{ secrets.CLOUDRU_PROJECT_ID }}
          CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          CLOUDRU_KEY_SECRET: ${{ secrets.CLOUDRU_KEY_SECRET }}
          CLOUDRU_S3_ACCESS_KEY_ID: ${{ secrets.CLOUDRU_S3_ACCESS_KEY_ID }}
          CLOUDRU_S3_SECRET_ACCESS_KEY: ${{ secrets.CLOUDRU_S3_SECRET_ACCESS_KEY }}
        run: node infra/cloudru/questions-production-job-smoke.mjs

  build:
    if: ${{ !inputs.provision_real_questions_job && !inputs.smoke_real_questions_job }}
    needs: verify-media-contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'questions' && '[{"media":"questions","role":"worker","dockerfile":"Dockerfile"}]' || '[{"media":"feed","role":"worker","dockerfile":"Dockerfile"},{"media":"feed","role":"origin","dockerfile":"Dockerfile.origin"},{"media":"gallery","role":"worker","dockerfile":"Dockerfile"},{"media":"gallery","role":"origin","dockerfile":"Dockerfile.origin"}]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux OCI archive for review (no deployment)
        if: ${{ !inputs.publish }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.media }}-cloud/${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: gafus-${{ matrix.media }}-${{ matrix.role }}:${{ github.sha }}
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.media }}-${{ matrix.role }}.tar
          push: false
      - name: Save review artifact
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: cloudru-${{ matrix.media }}-${{ matrix.role }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.media }}-${{ matrix.role }}.tar
          retention-days: 3
          compression-level: 0
      - name: Authenticate to private Cloud.ru registry
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: gafus.cr.cloud.ru
          username: ${{ secrets.CLOUDRU_KEY_ID }}
          password: ${{ secrets.CLOUDRU_KEY_SECRET }}
      - name: Publish immutable revision-tagged image (no deployment, retry transient registry errors)
        if: ${{ inputs.publish }}
        run: bash ci-cd/scripts/publish-cloudru-image.sh "${{ matrix.media }}" "${{ matrix.role }}" "${{ matrix.dockerfile }}" "${{ github.sha }}"
