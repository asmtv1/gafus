name: "Internal / Media image publication (reusable)"

on:
  workflow_call:
    inputs:
      publish:
        description: "Publish reviewed images to Cloud.ru Registry (never deploy automatically)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify-media-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate CORS, images, protected CDN and owner media migration
        run: pnpm test:cloudru-media
      - name: Verify two video image roles and no retired photo Jobs (blocking)
        run: |
          node ci-cd/scripts/media-pipeline-guard.mjs
          node --test ci-cd/scripts/media-pipeline-guard.test.mjs
          node --test scripts/qa/cloud-photo-jobs-retired.test.mjs
      - name: Cloud.ru registry publication retry acceptance tests
        run: node --test ci-cd/scripts/cloudru-publish-retry.test.mjs
  build:
    needs: verify-media-contracts
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - { media: feed, role: worker, dockerfile: Dockerfile }
          - { media: chat, role: video, dockerfile: Dockerfile.chat2-job }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux OCI archive for review (no deployment)
        if: ${{ !inputs.publish }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.media == 'chat' && 'feed' || matrix.media }}-cloud/${{ matrix.dockerfile }}
          target: ${{ matrix.media == 'chat' && matrix.role || '' }}
          platforms: linux/amd64
          tags: gafus-${{ matrix.media }}-${{ matrix.role }}:${{ github.sha }}
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.media }}-${{ matrix.role }}.tar
          push: false
      - name: Save review artifact
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: cloudru-${{ matrix.media }}-${{ matrix.role }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.media }}-${{ matrix.role }}.tar
          retention-days: 3
          compression-level: 0
      - name: Authenticate to primary Cloud.ru registry
        if: ${{ inputs.publish && matrix.media != 'chat' }}
        uses: docker/login-action@v3
        with:
          registry: gafus.cr.cloud.ru
          username: ${{ secrets.CLOUDRU_KEY_ID }}
          password: ${{ secrets.CLOUDRU_KEY_SECRET }}
      - name: Authenticate to separate Chat2 registry
        if: ${{ inputs.publish && matrix.media == 'chat' }}
        uses: docker/login-action@v3
        with:
          registry: gafus-chat2-20261028.cr.cloud.ru
          username: ${{ secrets.CHAT2_CLOUDRU_KEY_ID }}
          password: ${{ secrets.CHAT2_CLOUDRU_KEY_SECRET }}
      - name: Publish immutable revision-tagged image (no deployment, retry transient registry errors)
        if: ${{ inputs.publish }}
        run: bash ci-cd/scripts/publish-cloudru-image.sh "${{ matrix.media }}" "${{ matrix.role }}" "${{ matrix.dockerfile }}" "${{ github.sha }}"
