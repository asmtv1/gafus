name: Build Cloud.ru media images

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish reviewed images to Cloud.ru Registry (never deploy automatically)"
        type: boolean
        required: true
        default: false
      media:
        description: "Build or publish one worker without repeating successful releases"
        type: choice
        required: true
        default: all
        options: [all, feed, gallery, questions]

permissions:
  contents: read
  packages: write  # Feed's private GHCR staging image; Cloud.ru Jobs never pull GHCR.

jobs:
  verify-media-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate CORS, images, protected CDN and owner media migration
        run: pnpm test:cloudru-media
      - name: Cloud.ru registry publication retry and source-pin acceptance tests
        run: |
          python3 ci-cd/scripts/upload-cloudru-oci.test.py
          node --test ci-cd/scripts/cloudru-publish-retry.test.mjs infra/cloudru/worker-image-pins.test.mjs infra/cloudru/feed-relay-workflow.test.mjs infra/cloudru/questions-production-job-smoke.test.mjs
      - name: Verify actual Questions SDK/S3 protocol with private fixtures before expensive OCI builds
        run: |
          pnpm exec vitest run apps/questions-cloud/src/worker.test.ts apps/questions-cloud/src/worker.s3.integration.test.ts packages/cdn-upload/src/questionCloudJob.test.ts
  build:
    needs: verify-media-contracts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { media: feed, role: worker, dockerfile: Dockerfile }
          - { media: gallery, role: worker, dockerfile: Dockerfile }
          - { media: questions, role: worker, dockerfile: Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux OCI archive for review (no deployment)
        if: ${{ !inputs.publish && (inputs.media == 'all' || inputs.media == matrix.media) }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.media }}-cloud/${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: gafus-${{ matrix.media }}-${{ matrix.role }}:${{ github.sha }}
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.media }}-${{ matrix.role }}.tar
          push: false
      - name: Save review artifact
        if: ${{ !inputs.publish && (inputs.media == 'all' || inputs.media == matrix.media) }}
        uses: actions/upload-artifact@v4
        with:
          name: cloudru-${{ matrix.media }}-${{ matrix.role }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.media }}-${{ matrix.role }}.tar
          retention-days: 3
          compression-level: 0
      - name: Authenticate to private Cloud.ru registry
        if: ${{ inputs.publish && (inputs.media == 'all' || inputs.media == matrix.media) }}
        uses: docker/login-action@v3
        with:
          registry: gafus.cr.cloud.ru
          username: ${{ secrets.CLOUDRU_KEY_ID }}
          password: ${{ secrets.CLOUDRU_KEY_SECRET }}
      # GHCR is a short-lived staging registry for the heavy Feed/FFmpeg image.
      # The approved production relay pulls from private GHCR and pushes a
      # SHA-pinned copy into Cloud.ru. Neither the app nor Jobs are restarted.
      - name: Authenticate to private GHCR for Feed relay
        if: ${{ inputs.publish && matrix.media == 'feed' && (inputs.media == 'all' || inputs.media == 'feed') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: asmtv1
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Publish Feed revision to private GHCR staging registry
        if: ${{ inputs.publish && matrix.media == 'feed' && (inputs.media == 'all' || inputs.media == 'feed') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/feed-cloud/Dockerfile
          platforms: linux/amd64
          tags: ghcr.io/asmtv1/gafus-feed-relay:${{ github.sha }}
          push: true
          provenance: false
      - name: Transfer Feed GHCR image through production relay into Cloud.ru Registry
        if: ${{ inputs.publish && matrix.media == 'feed' && (inputs.media == 'all' || inputs.media == 'feed') }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          CLOUDRU_KEY_SECRET: ${{ secrets.CLOUDRU_KEY_SECRET }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.GAFUS_SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: GHCR_TOKEN,CLOUDRU_KEY_ID,CLOUDRU_KEY_SECRET
          command_timeout: 30m
          script: |
            set -eu
            test -n "$GHCR_TOKEN" && test -n "$CLOUDRU_KEY_ID" && test -n "$CLOUDRU_KEY_SECRET"
            ghcr='ghcr.io/asmtv1/gafus-feed-relay:${{ github.sha }}'
            cloud='gafus.cr.cloud.ru/gafus-feed-worker:${{ github.sha }}'
            # Only a disposable Docker auth directory is modified. Never
            # prune images or touch the app's compose services / Job settings.
            umask 077
            authdir="$(mktemp -d /tmp/gafus-feed-registry-relay.XXXXXXXX)"
            trap 'rm -rf -- "$authdir"' EXIT
            export DOCKER_CONFIG="$authdir"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u asmtv1 --password-stdin >/dev/null
            docker pull "$ghcr"
            test "$(docker image inspect "$ghcr" --format '{{.Architecture}}')" = amd64
            test "$(docker image inspect "$ghcr" --format '{{.Os}}')" = linux
            docker tag "$ghcr" "$cloud"
            test "$(docker image inspect "$cloud" --format '{{.Id}}')" = "$(docker image inspect "$ghcr" --format '{{.Id}}')"
            printf '%s' "$CLOUDRU_KEY_SECRET" | docker login gafus.cr.cloud.ru -u "$CLOUDRU_KEY_ID" --password-stdin >/dev/null
            docker push "$cloud"
            echo 'FEED_CLOUDRU_PRODUCTION_RELAY_PUSH_COMPLETED'
      - name: Publish Gallery or Questions directly with Buildx (no deployment)
        if: ${{ inputs.publish && matrix.media != 'feed' && (inputs.media == 'all' || inputs.media == matrix.media) }}
        run: |
          bash ci-cd/scripts/publish-cloudru-image.sh "${{ matrix.media }}" "${{ matrix.role }}" "${{ matrix.dockerfile }}" "${{ github.sha }}"
      - name: Report independently pinned digest and source tree for reviewed publication
        if: ${{ inputs.publish && (inputs.media == 'all' || inputs.media == matrix.media) }}
        shell: bash
        run: |
          set -euo pipefail
          tag="gafus.cr.cloud.ru/gafus-${{ matrix.media }}-worker:${{ github.sha }}"
          digest=''
          for attempt in 1 2 3 4; do
            inspect="$(docker buildx imagetools inspect "$tag" 2>/dev/null)" && \
              digest="$(printf '%s\n' "$inspect" | awk '$1 == "Digest:" {print $2; exit}')" || true
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] && break
            sleep 15
          done
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'Registry image digest not available'; exit 1; }
          image="gafus.cr.cloud.ru/gafus-${{ matrix.media }}-worker@$digest"
          # Inspect the exact digest, not a mutable image tag.
          docker manifest inspect --verbose "$image" > "$RUNNER_TEMP/pinned-manifest.json"
          node - "$RUNNER_TEMP/pinned-manifest.json" <<'NODE'
          const fs=require('fs');const v=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const descriptors=Array.isArray(v)?v:[v];
          if(!descriptors.some(x=>x.Descriptor?.platform?.architecture==='amd64'))process.exit(1);
          NODE
          source="$(node infra/cloudru/worker-image-pins.mjs --source '${{ matrix.media }}')"
          echo "WORKER_PIN_MEDIA=${{ matrix.media }}"
          echo "WORKER_PIN_IMAGE=$image"
          echo "WORKER_PIN_SOURCE=$source"
          echo 'Use the authenticated operator to set BOTH matching production variables before manually applying Jobs.'
