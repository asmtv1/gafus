name: Cloud.ru existing production Jobs (first release V2 cutover)
on:
  workflow_call:
    inputs:
      release_sha:
        type: string
        required: true
      mode:
        type: string
        required: true
        description: preflight, cutover, or verify
permissions:
  contents: read
jobs:
  jobs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      CLOUDRU_PROD_DEPLOY_CONFIRM: preapproved-main-only-media-release
      CLOUDRU_NEW_BACKEND_DEPLOYED: ${{ inputs.mode == 'cutover' && 'true' || 'false' }}
      GALLERY_INTERNAL_HMAC_SECRET: ${{ secrets.GALLERY_INTERNAL_HMAC_SECRET }}
      FEED_INTERNAL_HMAC_SECRET: ${{ secrets.FEED_INTERNAL_HMAC_SECRET }}
      QUESTIONS_V2_INTERNAL_HMAC_SECRET: ${{ secrets.QUESTIONS_V2_INTERNAL_HMAC_SECRET }}
      CHAT2_INTERNAL_HMAC_SECRET: ${{ secrets.CHAT2_INTERNAL_HMAC_SECRET }}
      QUESTIONS_V2_S3_ACCESS_KEY_ID: ${{ secrets.QUESTIONS_V2_S3_ACCESS_KEY_ID }}
      QUESTIONS_V2_S3_SECRET_ACCESS_KEY: ${{ secrets.QUESTIONS_V2_S3_SECRET_ACCESS_KEY }}
      CHAT2_S3_ACCESS_KEY_ID: ${{ secrets.CHAT2_S3_ACCESS_KEY_ID }}
      CHAT2_S3_SECRET_ACCESS_KEY: ${{ secrets.CHAT2_S3_SECRET_ACCESS_KEY }}
      CLOUDRU_PROJECT_ID: ${{ secrets.CLOUDRU_PROJECT_ID }}
      CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
      CLOUDRU_KEY_SECRET: ${{ secrets.CLOUDRU_KEY_SECRET }}
      CHAT2_CLOUDRU_PROJECT_ID: ${{ vars.CHAT2_CLOUDRU_PROJECT_ID }}
      CHAT2_CLOUDRU_KEY_ID: ${{ secrets.CHAT2_CLOUDRU_KEY_ID }}
      CHAT2_CLOUDRU_KEY_SECRET: ${{ secrets.CHAT2_CLOUDRU_KEY_SECRET }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Confirm explicitly permitted V2 release phase
        shell: bash
        env:
          PHASE: ${{ inputs.mode }}
        run: |
          case "$PHASE" in preflight|cutover|verify) ;; *) echo 'INVALID_CLOUDRU_RELEASE_PHASE'; exit 1;; esac
      # OCI manifest lookup only: no docker build or push at any phase.
      - uses: docker/setup-buildx-action@v3
        if: inputs.mode != 'verify'
      - name: Authenticate existing Cloud.ru Container Registry for read-only OCI manifests
        if: inputs.mode != 'verify'
        uses: docker/login-action@v3
        with:
          registry: gafus.cr.cloud.ru
          username: ${{ secrets.CLOUDRU_KEY_ID }}
          password: ${{ secrets.CLOUDRU_KEY_SECRET }}
      - name: Ensure published V2 images exist for linux/amd64, no builds
        if: inputs.mode != 'verify'
        shell: bash
        run: |
          set -euo pipefail
          node infra/cloudru/production-job-release.mjs --plan |
            jq -r '.targets[].targetImage | select(startswith("gafus.cr.cloud.ru/"))' | sort -u |
            while IFS= read -r image; do
              docker buildx imagetools inspect "$image" >/dev/null
            done
      - name: Preflight existing 11 Jobs, switch their V2 config or verify final state
        env:
          PHASE: ${{ inputs.mode }}
        run: node infra/cloudru/production-job-release.mjs "--$PHASE"
