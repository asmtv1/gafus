name: "Internal / Cloud.ru existing Jobs (reusable)"
on:
  workflow_call:
    inputs:
      release_sha:
        type: string
        required: true
      mode:
        type: string
        required: true
        description: preflight, sync, cutover (compatibility), or verify
permissions:
  contents: read
jobs:
  jobs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      CLOUDRU_PROD_DEPLOY_CONFIRM: preapproved-main-only-media-release
      CLOUDRU_NEW_BACKEND_DEPLOYED: ${{ (inputs.mode == 'cutover' || inputs.mode == 'sync') && 'true' || 'false' }}
      FEED_INTERNAL_HMAC_SECRET: ${{ secrets.FEED_INTERNAL_HMAC_SECRET }}
      CHAT2_INTERNAL_HMAC_SECRET: ${{ secrets.CHAT2_INTERNAL_HMAC_SECRET }}
      CHAT2_S3_ACCESS_KEY_ID: ${{ secrets.CHAT2_S3_ACCESS_KEY_ID }}
      CHAT2_S3_SECRET_ACCESS_KEY: ${{ secrets.CHAT2_S3_SECRET_ACCESS_KEY }}
      CLOUDRU_PROJECT_ID: ${{ secrets.CLOUDRU_PROJECT_ID }}
      CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
      CLOUDRU_KEY_SECRET: ${{ secrets.CLOUDRU_KEY_SECRET }}
      CHAT2_CLOUDRU_PROJECT_ID: ${{ vars.CHAT2_CLOUDRU_PROJECT_ID }}
      CHAT2_CLOUDRU_KEY_ID: ${{ secrets.CHAT2_CLOUDRU_KEY_ID }}
      CHAT2_CLOUDRU_KEY_SECRET: ${{ secrets.CHAT2_CLOUDRU_KEY_SECRET }}
      # Full repo@sha256 URL or sha256 digest. Secrets have precedence over Variables.
      CLOUDRU_WORKER_PINS_REQUIRED: ${{ vars.CLOUDRU_WORKER_PINS_REQUIRED || 'false' }}
      CLOUDRU_FEED_WORKER_IMAGE: ${{ secrets.CLOUDRU_FEED_WORKER_IMAGE || vars.CLOUDRU_FEED_WORKER_IMAGE || '' }}
      CLOUDRU_CHAT_VIDEO_IMAGE: ${{ secrets.CLOUDRU_CHAT_VIDEO_IMAGE || vars.CLOUDRU_CHAT_VIDEO_IMAGE || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Confirm explicitly permitted V2 release phase
        shell: bash
        env:
          PHASE: ${{ inputs.mode }}
        run: |
          case "$PHASE" in preflight|sync|cutover|verify) ;; *) echo 'INVALID_CLOUDRU_RELEASE_PHASE'; exit 1;; esac
      # OCI manifest lookup only: no docker build or push at any phase.
      - uses: docker/setup-buildx-action@v3
        if: inputs.mode != 'verify'
      - name: Authenticate existing Cloud.ru Container Registry for read-only OCI manifests
        if: inputs.mode != 'verify'
        uses: docker/login-action@v3
        with:
          registry: gafus.cr.cloud.ru
          username: ${{ secrets.CLOUDRU_KEY_ID }}
          password: ${{ secrets.CLOUDRU_KEY_SECRET }}
      - name: Authenticate Chat2 registry if image overrides are supplied
        if: inputs.mode != 'verify' && env.CLOUDRU_CHAT_VIDEO_IMAGE != ''
        uses: docker/login-action@v3
        with:
          registry: gafus-chat2-20261028.cr.cloud.ru
          username: ${{ secrets.CHAT2_CLOUDRU_KEY_ID }}
          password: ${{ secrets.CHAT2_CLOUDRU_KEY_SECRET }}
      - name: Ensure all requested immutable images exist, no builds
        if: inputs.mode != 'verify'
        shell: bash
        run: |
          set -euo pipefail
          node infra/cloudru/production-job-release.mjs --plan |
            jq -r '.targets[].targetImage | select(contains("@sha256:"))' | sort -u |
            while IFS= read -r image; do
              # Cloud.ru registry OAuth can temporarily return 502 before an
              # OCI manifest is even requested. Retry only transport/5xx/429;
              # a missing digest, invalid auth or malformed manifest fails shut.
              verified=false
              for attempt in 1 2 3 4 5 6 7 8; do
                if output="$(docker buildx imagetools inspect "$image" 2>&1)"; then
                  verified=true
                  break
                fi
                if ! grep -Eqi '502 Bad Gateway|503 Service Unavailable|504 Gateway Timeout|429 Too Many Requests|TLS handshake timeout|connection reset by peer|unexpected EOF|i/o timeout' <<< "$output"; then
                  printf '%s\n' "$output" >&2
                  echo 'CLOUDRU_IMMUTABLE_MANIFEST_INVALID' >&2
                  exit 1
                fi
                if [ "$attempt" -eq 8 ]; then
                  echo 'CLOUDRU_REGISTRY_TRANSIENT_RETRIES_EXHAUSTED' >&2
                  exit 1
                fi
                echo "Cloud.ru transient registry OAuth error, retry $attempt/8" >&2
                sleep "$((attempt * 5))"
              done
              [ "$verified" = true ] || exit 1
            done
      - name: Reconcile only 4 active video Jobs; verify after rollout
        env:
          PHASE: ${{ inputs.mode }}
        run: node infra/cloudru/production-job-release.mjs "--$PHASE"
