name: Build Single Container

on:
  workflow_dispatch:
    inputs:
      container:
        description: 'Choose one of the seven independent production app images'
        required: true
        type: choice
        options: [web, trainer-panel, admin-panel, api, worker, bull-board, prisma]
      deploy:
        description: 'Also update ONLY this service on the current production release (prisma: build only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: asmtv1

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image: ${{ steps.config.outputs.image }}
      digest: ${{ steps.package.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate target and deploy safety
        id: config
        env:
          TARGET: ${{ inputs.container }}
          DEPLOY: ${{ inputs.deploy }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET" in
            web|trainer-panel|admin-panel|api|worker|bull-board|prisma) ;;
            *) echo 'Unknown service'; exit 1 ;;
          esac
          if [[ "$TARGET" == prisma && "$DEPLOY" == true ]]; then
            echo 'Prisma is a migration container; use the coordinated CI/CD release for schema changes'
            exit 1
          fi
          echo "dockerfile=ci-cd/docker/Dockerfile-$TARGET-optimized" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/asmtv1/gafus-$TARGET" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Enforce Core and browser/server boundaries (blocking)
        run: pnpm check:core-boundaries
      - name: Build Types and execute public API regression tests (blocking)
        run: |
          set -euo pipefail
          pnpm --filter @gafus/logger build
          pnpm --filter @gafus/types build
          pnpm --filter @gafus/types test
      - name: Compile selected static Vite app before Docker packaging
        if: contains(fromJSON('["web","admin-panel","trainer-panel"]'), inputs.container)
        env:
          TARGET: ${{ inputs.container }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @gafus/prisma db:generate
          case "$TARGET" in
            web)
              pnpm --filter '@gafus/web-vite^...' --if-present run build
              pnpm --filter @gafus/web-vite build
              ;;
            admin-panel)
              pnpm --filter '@gafus/admin-panel^...' --if-present run build
              pnpm --filter @gafus/admin-panel build
              ;;
            trainer-panel)
              pnpm --filter '@gafus/trainer-panel^...' --if-present run build
              pnpm --filter @gafus/trainer-panel build
              ;;
          esac
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and publish only selected image with unique run tag
        id: package
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.config.outputs.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.config.outputs.image }}:manual-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
      - name: Publish digest as build summary
        env:
          IMAGE: ${{ steps.config.outputs.image }}
          DIGEST: ${{ steps.package.outputs.digest }}
        run: |
          test -n "$DIGEST"
          echo "Published $IMAGE@$DIGEST (only one image, no production deploy yet)" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && inputs.deploy
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: gafus-production-deploy
      cancel-in-progress: false
    timeout-minutes: 25
    steps:
      - name: Deploy selected digest ONLY if server is already at this commit
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.GAFUS_SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -euo pipefail
            service='${{ inputs.container }}'
            image='${{ needs.build.outputs.image }}'
            digest='${{ needs.build.outputs.digest }}'
            sha='${{ github.sha }}'
            case "$service" in web|trainer-panel|admin-panel|api|worker|bull-board) ;; *) exit 1;; esac
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'BAD_IMAGE_DIGEST'; exit 1; }
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || { echo 'BAD_SOURCE_SHA'; exit 1; }
            root=/root/gafus
            compose="$root/ci-cd/docker/docker-compose.prod.yml"
            test -f "$compose" || { echo 'MISSING_COMPOSE'; exit 1; }
            production_sha="$(git -C "$root" rev-parse HEAD)"
            if [[ "$production_sha" != "$sha" ]]; then
              # A standalone API image can be newer than the checkout when
              # the intervening commit changes only API source/tests and this
              # release workflow. Never advance the production worktree here.
              [[ "$service" == api ]] || {
                echo 'PRODUCTION_SHA_DIFFERS: full coordinated release required'; exit 1;
              }
              git -C "$root" fetch --quiet --no-tags origin "$sha" || {
                echo 'HOTFIX_COMMIT_UNAVAILABLE'; exit 1;
              }
              git -C "$root" merge-base --is-ancestor "$production_sha" "$sha" || {
                echo 'HOTFIX_NOT_FAST_FORWARD'; exit 1;
              }
              changed="$(git -C "$root" diff --name-only "$production_sha" "$sha")"
              [[ -n "$changed" ]] || { echo 'HOTFIX_EMPTY_DIFF'; exit 1; }
              while IFS= read -r file; do
                case "$file" in
                  apps/api/*|.github/workflows/build-single-container.yml|ci-cd/scripts/workflow-consolidation-contract.test.mjs) ;;
                  *) echo "HOTFIX_UNSAFE_DIFF=$file"; exit 1 ;;
                esac
              done <<< "$changed"
              echo 'HOTFIX_API_ONLY_DIFF_VERIFIED'
            fi
            current="$image:latest"
            previous="$(docker image inspect "$current" --format '{{.Id}}' 2>/dev/null)" || {
              echo 'MISSING_PREVIOUS_IMAGE: refusing unsafe standalone deploy'; exit 1;
            }
            echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u asmtv1 --password-stdin >/dev/null
            docker pull "$image@$digest"
            backup="$image:manual-rollback-${{ github.run_id }}-${{ github.run_attempt }}"
            docker tag "$previous" "$backup"
            restore() {
              echo 'SERVICE_DEPLOY_FAILED: restoring previous image'
              docker tag "$backup" "$current" || true
              docker-compose -f "$compose" up -d --no-deps --force-recreate "$service" || true
            }
            trap restore ERR
            docker tag "$image@$digest" "$current"
            docker-compose -f "$compose" up -d --no-deps --force-recreate "$service"
            container="gafus-$service"
            healthy=false
            for i in $(seq 1 24); do
              state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)"
              if [ "$state" = healthy ] || [ "$state" = running -a "$service" = admin-panel ]; then
                healthy=true
                break
              fi
              sleep 5
            done
            if [ "$healthy" != true ]; then
              echo "SERVICE_NOT_HEALTHY=$service"; false
            fi
            case "$service" in
              web) endpoint=https://gafus.ru/;;
              api) endpoint=https://api.gafus.ru/ready;;
              admin-panel) endpoint=https://adminka.gafus.ru/;;
              trainer-panel) endpoint=https://trainer-panel.gafus.ru/;;
              *) endpoint='';;
            esac
            if [ -n "$endpoint" ]; then curl -fsSL --retry 3 --max-time 15 -o /dev/null "$endpoint"; fi
            trap - ERR
            echo "DEPLOY_SINGLE_IMAGE_OK=$service@$digest"
