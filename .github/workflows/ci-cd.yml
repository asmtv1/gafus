name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# CI for different refs may run independently; all main deployments serialize.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'gafus-production-deploy' || format('gafus-workflow-{0}', github.ref) }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: asmtv1

jobs:
  # Prepare dependencies - shared job for all other jobs
  prepare-deps:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
      pnpm-cache-key: ${{ steps.pnpm-cache-key.outputs.key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Generate cache keys
        id: cache-key
        run: |
          echo "key=${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('packages/**/src/**', 'apps/**/src/**') }}" >> $GITHUB_OUTPUT

      - name: Generate pnpm cache key
        id: pnpm-cache-key
        run: echo "key=${{ hashFiles('**/pnpm-lock.yaml') }}-pnpm-store" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: |
          npm install --global pnpm@10.12.4
          test "$(pnpm --version)" = "10.12.4"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ steps.pnpm-cache-key.outputs.key }}
          restore-keys: |
            ${{ hashFiles('**/pnpm-lock.yaml') }}-pnpm-store

      - name: Install dependencies with optimizations
        run: |
          # Устанавливаем зависимости с оптимизациями
          pnpm config set store-dir ~/.pnpm-store
          pnpm config set verify-store-integrity false
          pnpm config set auto-install-peers true
          pnpm config set dedupe-peer-dependents false

          # Устанавливаем только production зависимости для CI
          pnpm install --frozen-lockfile --prefer-offline

      - name: Validate dependencies
        run: |
          echo "🔍 Validating dependencies..."
          pnpm list --depth=0 --json > /dev/null || echo "⚠️ Dependency validation failed, but continuing"
          echo "✅ Dependencies validated"

      - name: Generate Prisma Client
        run: |
          cd packages/prisma
          # Temporarily disable prisma-erd-generator in CI to avoid Chromium sandbox issues
          cp schema.prisma schema.prisma.bak
          awk 'BEGIN{skip=0} /^generator erd \{/{skip=1} skip && /^\}/{skip=0; next} !skip {print}' schema.prisma > schema.tmp && mv schema.tmp schema.prisma
          pnpm db:generate
          mv schema.prisma.bak schema.prisma

      - name: Build packages
        run: |
          # logger первым (зависимости: types, queues, cdn-upload, prisma)
          cd packages/logger && pnpm build && cd ../..
          # types, queues, cdn-upload, video-access параллельно (зависят только от logger / без workspace deps)
          (cd packages/types && pnpm build) &
          (cd packages/queues && pnpm build) &
          (cd packages/cdn-upload && pnpm build) &
          (cd packages/video-access && pnpm build) &
          wait
          # prisma (зависит от logger), затем auth, core
          cd packages/prisma && pnpm build && cd ../..
          cd packages/auth && pnpm build && cd ../..
          # mailer до core (TypeScript резолвит dist/index.d.ts у @gafus/mailer)
          cd packages/mailer && pnpm build && cd ../..
          cd packages/core && pnpm build && cd ../..
          # остальные пакеты через turbo
          pnpm build --filter=@gafus/* --filter=!@gafus/prisma --filter=!@gafus/logger --filter=!@gafus/core --filter=!@gafus/types --filter=!@gafus/queues --filter=!@gafus/cdn-upload --filter=!@gafus/auth --filter=!@gafus/video-access --filter=!@gafus/mailer

      - name: Cache build artifacts
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/dist
            packages/*/.prisma
            ~/.pnpm-store
          key: ${{ steps.cache-key.outputs.key }}-deps
          restore-keys: |
            ${{ hashFiles('**/pnpm-lock.yaml') }}-deps

  # Security and code quality checks - runs in parallel with build-apps
  security:
    runs-on: ubuntu-latest
    needs: prepare-deps
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gafus_ci
          POSTGRES_PASSWORD: gafus_ci_disposable
          POSTGRES_DB: gafus_fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gafus_ci -d gafus_fresh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Restore dependencies cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/dist
            packages/*/.prisma
            ~/.pnpm-store
          key: ${{ needs.prepare-deps.outputs.cache-key }}-deps

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: |
          npm install --global pnpm@10.12.4
          test "$(pnpm --version)" = "10.12.4"

      - name: Restore pnpm store cache
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ needs.prepare-deps.outputs.pnpm-cache-key }}
          restore-keys: |
            ${{ hashFiles('**/pnpm-lock.yaml') }}-pnpm-store

      - name: Install dependencies (optimized)
        run: |
          pnpm config set store-dir ~/.pnpm-store
          pnpm config set verify-store-integrity false
          pnpm config set auto-install-peers true
          pnpm config set dedupe-peer-dependents false

          # Установка с предпочтением кэша, но с возможностью загрузки из сети
          pnpm install --frozen-lockfile --prefer-offline

      - name: Run security audit
        run: pnpm audit --audit-level high || echo "Security audit found issues, but continuing build"

      - name: Run Web ESLint (blocking)
        run: pnpm --filter @gafus/web lint

      - name: Enforce core ownership of Prisma access
        run: node scripts/check-app-prisma-boundary.mjs

      - name: Guard Worker Prisma boundary
        run: node scripts/check-worker-prisma-boundary.mjs

      - name: Guard empty PostgreSQL bootstrap SQL against migration drift
        run: python3 packages/prisma/scripts/generate-fresh-db-extras.py --check

      - name: Bootstrap clean PostgreSQL with historical constraints
        env:
          DATABASE_URL: postgresql://gafus_ci:gafus_ci_disposable@localhost:5432/gafus_fresh
        run: |
          bash packages/prisma/scripts/bootstrap-fresh-postgres.sh
          checks=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM pg_constraint WHERE contype='c' AND connamespace='public'::regnamespace")
          triggers=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM pg_trigger WHERE NOT tgisinternal")
          partial_indexes=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND indexdef ILIKE '% WHERE %'")
          test "$checks" -ge 54
          test "$triggers" -ge 5
          test "$partial_indexes" -ge 2
          pnpm --filter @gafus/prisma exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel schema.prisma --exit-code

      - name: Guard legacy domain adapters against direct Prisma
        run: node scripts/check-domain-package-prisma-boundary.mjs

      - name: Check workspace dependency cycles
        run: node scripts/check-workspace-graph.mjs

      - name: Guard Mobile against core server imports
        run: node scripts/check-mobile-core-boundary.mjs

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: HEAD~1

  # Build and test all apps - runs in parallel with security
  # Turborepo remote cache (30-50% быстрее при повторных сборках):
  # 1. npx turbo login && npx turbo link
  # 2. GitHub: Secrets → TURBO_TOKEN, Variables → TURBO_TEAM
  build-apps:
    runs-on: ubuntu-latest
    needs: prepare-deps
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # Совпадает с образом web: счётчик Метрики в клиентской сборке
      NEXT_PUBLIC_YM_COUNTER_ID: ${{ secrets.NEXT_PUBLIC_YM_COUNTER_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # нужен для --filter='...[origin/main]'

      - name: Restore dependencies cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/dist
            packages/*/.prisma
            ~/.pnpm-store
          key: ${{ needs.prepare-deps.outputs.cache-key }}-deps

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: |
          npm install --global pnpm@10.12.4
          test "$(pnpm --version)" = "10.12.4"

      - name: Restore pnpm store cache
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ needs.prepare-deps.outputs.pnpm-cache-key }}
          restore-keys: |
            ${{ hashFiles('**/pnpm-lock.yaml') }}-pnpm-store

      - name: Install dependencies (optimized)
        run: |
          pnpm config set store-dir ~/.pnpm-store
          pnpm config set verify-store-integrity false
          pnpm config set auto-install-peers true
          pnpm config set dedupe-peer-dependents false

          # Установка с предпочтением кэша, но с возможностью загрузки из сети
          pnpm install --frozen-lockfile --prefer-offline

      - name: Build, test, typecheck apps
        run: |
          # main+push: полная сборка (для деплоя). PR/develop: только изменённые приложения.
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            pnpm turbo run build test typecheck --filter='./apps/web' --filter='./apps/trainer-panel'  --filter='./apps/admin-panel' --filter='./apps/api'
          else
            pnpm turbo run build test typecheck --filter='./apps/*...[origin/main]'
          fi

      - name: Mobile typecheck and unit tests (blocking)
        run: |
          pnpm --filter @gafus/mobile typecheck
          pnpm --filter @gafus/mobile test

      - name: Mobile Android/iOS Metro export (blocking, no publishing)
        env:
          NODE_ENV: production
          EXPO_OFFLINE: "1"
        run: |
          pnpm --filter @gafus/mobile exec expo export --platform android --output-dir "$RUNNER_TEMP/gafus-metro-android"
          pnpm --filter @gafus/mobile exec expo export --platform ios --output-dir "$RUNNER_TEMP/gafus-metro-ios"

      - name: Cache app build
        uses: actions/cache@v5
        with:
          path: |
            apps/web/.next
            apps/trainer-panel/.next
            apps/admin-panel/.next
            apps/api/dist
          key: ${{ needs.prepare-deps.outputs.cache-key }}-all-apps-build
          restore-keys: |
            ${{ needs.prepare-deps.outputs.cache-key }}-all-apps-build

  # Build worker packages for Docker - REMOVED (using multi-stage build)
  # Mobile: typecheck и unit-тесты проходят в build-apps; native Expo-сборки выполняются отдельно.

  # Prepare Docker build context
  prepare-docker:
    needs: [security, build-apps]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      docker-cache-key: ${{ steps.docker-cache-key.outputs.key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Generate Docker cache key
        id: docker-cache-key
        run: echo "key=${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/Dockerfile*') }}-docker" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Create Docker build cache
        run: |
          # Создаем базовый образ с зависимостями для кэширования
          docker buildx build \
            --platform linux/amd64 \
            --target base \
            --build-arg "NEXT_PUBLIC_YM_COUNTER_ID=${{ secrets.NEXT_PUBLIC_YM_COUNTER_ID }}" \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/gafus-base:latest \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            -f ci-cd/docker/Dockerfile-web-optimized \
            . || echo "Base image creation failed, continuing with build"

  # Build all Docker images in parallel
  build-images:
    needs: [prepare-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - { name: "web", file: "Dockerfile-web-optimized", tag: "gafus-web" }
          - {
              name: "trainer-panel",
              file: "Dockerfile-trainer-panel-optimized",
              tag: "gafus-trainer-panel",
            }
          - {
              name: "admin-panel",
              file: "Dockerfile-admin-panel-optimized",
              tag: "gafus-admin-panel",
            }
          - { name: "api", file: "Dockerfile-api-optimized", tag: "gafus-api" }
          - { name: "worker", file: "Dockerfile-worker-optimized", tag: "gafus-worker" }
          - { name: "bull-board", file: "Dockerfile-bull-board-optimized", tag: "gafus-bull-board" }
          - { name: "prisma", file: "Dockerfile-prisma-optimized", tag: "gafus-prisma" }
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push ${{ matrix.image.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci-cd/docker/${{ matrix.image.file }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image.tag }}:latest
          # web: только GHA cache (без registry) — актуальный код, локальный кэш слоёв
          cache-from: |
            type=gha
            ${{ matrix.image.name != 'web' && format('type=registry,ref={0}/{1}/gafus-base:latest', env.REGISTRY, env.IMAGE_NAME) || '' }}
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            NEXT_PUBLIC_YM_COUNTER_ID=${{ matrix.image.name == 'web' && secrets.NEXT_PUBLIC_YM_COUNTER_ID || '' }}

  cloudru-media-contracts:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Offline Cloud.ru media acceptance and production release safety tests
        run: pnpm test:cloudru-media
      - name: Cloud.ru scheduled processing contract
        run: pnpm --filter @gafus/worker exec vitest run src/cloudru-media-dispatcher.test.ts

  # Four immutable, revision-tagged images are required before any production changes.
  cloudru-build-media-images:
    needs: [security, build-apps, cloudru-media-contracts]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - { media: gallery, role: origin, dockerfile: Dockerfile.origin }
          - { media: feed, role: origin, dockerfile: Dockerfile.origin }
          - { media: gallery, role: worker, dockerfile: Dockerfile }
          - { media: feed, role: worker, dockerfile: Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Authorize private Cloud.ru Registry
        uses: docker/login-action@v3
        with:
          registry: gafus.cr.cloud.ru
          username: ${{ secrets.CLOUDRU_KEY_ID }}
          password: ${{ secrets.CLOUDRU_KEY_SECRET }}
      - name: Publish Cloud.ru production revision
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.media }}-cloud/${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: gafus.cr.cloud.ru/gafus-${{ matrix.media }}-${{ matrix.role }}:${{ github.sha }}
          push: true
          provenance: true

  # Fail BEFORE touching production if S3 credentials, OCI images, Yandex CDN signer,
  # protected origin and 3 job definitions cannot be verified.
  cloudru-prepare-media:
    needs: [cloudru-build-media-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 22
    env:
      GITHUB_EVENT_NAME: push
      CLOUDRU_PROD_DEPLOY_CONFIRM: preapproved-main-only-media-release
      CLOUDRU_S3_PROBE_CONFIRM: synthetic-private-s3-only
      CLOUDRU_CDN_RELEASE_CONFIRM: reviewed-main-cloudru-cdn-cutover
      CLOUDRU_PROJECT_ID: ${{ secrets.CLOUDRU_PROJECT_ID }}
      CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
      CLOUDRU_KEY_SECRET: ${{ secrets.CLOUDRU_KEY_SECRET }}
      CLOUDRU_S3_ENDPOINT: https://s3.cloud.ru
      CLOUDRU_S3_ACCESS_KEY_ID: ${{ secrets.CLOUDRU_S3_ACCESS_KEY_ID }}
      CLOUDRU_S3_SECRET_ACCESS_KEY: ${{ secrets.CLOUDRU_S3_SECRET_ACCESS_KEY }}
      GALLERY_CDN_SECRET: ${{ secrets.GALLERY_CDN_SECRET }}
      FEED_CDN_SECRET: ${{ secrets.FEED_CDN_SECRET }}
      GALLERY_ORIGIN_SECRET: ${{ secrets.GALLERY_ORIGIN_SECRET }}
      FEED_ORIGIN_SECRET: ${{ secrets.FEED_ORIGIN_SECRET }}
      GALLERY_INTERNAL_HMAC_SECRET: ${{ secrets.GALLERY_INTERNAL_HMAC_SECRET }}
      FEED_INTERNAL_HMAC_SECRET: ${{ secrets.FEED_INTERNAL_HMAC_SECRET }}
      YC_CDN_FOLDER_ID: b1gjbsvfnd1fl68k43g6
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - name: Install cloud storage tooling from lockfile
        run: pnpm install --frozen-lockfile
      - uses: docker/login-action@v3
        with:
          registry: gafus.cr.cloud.ru
          username: ${{ secrets.CLOUDRU_KEY_ID }}
          password: ${{ secrets.CLOUDRU_KEY_SECRET }}
      - name: Confirm guarded OCI release plan
        run: node infra/cloudru/production-media-release.mjs --plan
      - name: Install Yandex Cloud CLI for CDN read-only preflight
        run: |
          curl --fail --location --silent --show-error https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc-bin" -n
          echo "$RUNNER_TEMP/yc-bin/bin" >> "$GITHUB_PATH"
      - name: Authorize CDN read-only preflight
        env:
          YC_CDN_SA_KEY: ${{ secrets.FEED_YC_SERVICE_ACCOUNT_KEY }}
        run: |
          set -euo pipefail
          test -n "$YC_CDN_SA_KEY"
          (umask 077; printf '%s' "$YC_CDN_SA_KEY" > "$RUNNER_TEMP/yc-cdn-sa.json")
          yc config set service-account-key "$RUNNER_TEMP/yc-cdn-sa.json"
      - name: Block production deploy if CDN signature/header/TLS is unverified
        run: node infra/cloudru/production-cdn-release.mjs --preflight
      - name: Confirm all three private Cloud.ru S3 buckets can read, write and delete
        run: node infra/cloudru/production-s3-preflight.mjs --verify
      - name: Provision and warm Cloud.ru protected Origins and bounded processing Jobs
        run: node infra/cloudru/production-media-release.mjs --prepare
      - name: Precreate safe Yandex CDN origin groups without switching any user traffic
        run: node infra/cloudru/production-cdn-release.mjs --prepare

  # Deploy to staging (develop branch)
  # Заглушка: staging не реализован — один prod-сервер. Реальный деплой добавить при появлении staging-инфраструктуры.
  deploy-staging:
    needs: [security, build-apps]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging
        run: echo "Deploy to staging environment"

  # Deploy to production (main branch)
  deploy-production:
    needs: [security, build-apps, build-images, cloudru-prepare-media]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SCRIPT_1: |2+
            set -eo pipefail
            echo "🚀 Starting production deployment..."

            DEPLOY_ROOT="/root/gafus"
            COMPOSE_PROD="$DEPLOY_ROOT/ci-cd/docker/docker-compose.prod.yml"
            RELEASE_BACKUP_DIR="/root/gafus-release-backups/${{ github.run_id }}-${{ github.run_attempt }}"
            APP_MUTATED=false
            CUTOVER_SCRIPT="$DEPLOY_ROOT/ci-cd/scripts/production-schema-cutover.sh"
            MAINTENANCE_GATE="$DEPLOY_ROOT/ci-cd/nginx/conf.d/.release-maintenance"
            restore_previous_runtime() {
              rc="$1"
              if [ "$rc" -eq 0 ]; then return 0; fi
              trap - EXIT INT TERM
              echo "Deployment failed ($rc). Checking whether schema mutation has begun."
              if [ -f "$RELEASE_BACKUP_DIR/migration-started" ]; then
                # Some Prisma migrations may already be committed. Restoring an
                # older image against a newer DB is unsafe (Telemost columns gone).
                # Keep Nginx serving 503 for a controlled, manual recovery.
                touch "$MAINTENANCE_GATE"
                echo "SCHEMA_MIGRATION_STARTED: retaining maintenance mode."
                echo "DO NOT automatically restore old Docker images or old Prisma schema."
                echo "Database backup: $RELEASE_BACKUP_DIR/database-backup-path"
                echo "Investigate migration status and repair forward or perform a verified DB restore."
                return 0
              fi
              if [ "$APP_MUTATED" != "true" ]; then
                echo "Existing application containers have not been replaced."
                return 0
              fi
              set +e
              if [ -s "$RELEASE_BACKUP_DIR/previous.sha" ]; then
                git -C "$DEPLOY_ROOT" reset --hard "$(cat "$RELEASE_BACKUP_DIR/previous.sha")" > /dev/null ||
                  echo "ROLLBACK_GIT_RESTORE_FAILED"
              fi
              if [ -s "$RELEASE_BACKUP_DIR/previous.env" ]; then
                cp "$RELEASE_BACKUP_DIR/previous.env" "$DEPLOY_ROOT/ci-cd/docker/.env"
                chmod 600 "$DEPLOY_ROOT/ci-cd/docker/.env"
              fi
              if [ -s "$RELEASE_BACKUP_DIR/images.tsv" ]; then
                while IFS=' ' read -r reference rollback; do
                  docker tag "$rollback" "$reference" || echo "ROLLBACK_IMAGE_TAG_FAILED"
                done < "$RELEASE_BACKUP_DIR/images.tsv"
              fi
              # Keep the already-running nginx maintenance gate active until
              # all OLD app containers are actually healthy again.
              if docker-compose -f "$COMPOSE_PROD" up -d --no-deps --force-recreate worker api web trainer-panel admin-panel bull-board; then
                old_healthy=true
                for app in worker api web trainer-panel admin-panel bull-board; do
                  app_ready=false
                  for attempt in $(seq 1 30); do
                    health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{if .State.Running}}running{{else}}stopped{{end}}{{end}}' "gafus-$app" 2>/dev/null || true)"
                    if [ "$health" = healthy ] || [ "$health" = running ]; then app_ready=true; break; fi
                    sleep 3
                  done
                  if [ "$app_ready" != true ]; then old_healthy=false; break; fi
                done
                if [ "$old_healthy" = true ]; then
                  # Restored nginx may no longer contain the maintenance guard.
                  # Recreate it only AFTER all restored upstreams are healthy.
                  rm -f "$MAINTENANCE_GATE"
                  docker-compose -f "$COMPOSE_PROD" up -d --no-deps --force-recreate nginx ||
                    echo "ROLLBACK_NGINX_RESTART_FAILED: manually restore HTTPS."
                  echo "Old runtime restored BEFORE any migration."
                else
                  echo "OLD_RUNTIME_UNHEALTHY: maintenance retained for manual recovery."
                fi
              else
                echo "ROLLBACK_RUNTIME_RESTART_FAILED: maintenance retained for manual recovery."
              fi
              return 0
            }
            trap 'restore_previous_runtime $?' EXIT
            trap 'exit 130' INT TERM

            # Log deployment start
            echo "📅 Deployment started at: $(date)"
            echo "🔧 Server: ${{ secrets.SERVER_HOST }}"
            echo "📦 Docker version: $(docker --version)"
            echo "🐳 Docker Compose version: $(docker-compose --version)"

            # Install basic tools first
            echo "🔧 Installing basic tools..."
            apt-get update
            apt-get install -y curl wget

            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              echo "🐳 Installing Docker..."
              # Use apt for Ubuntu 20.04 (focal)
              apt-get install -y apt-transport-https ca-certificates gnupg lsb-release
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
              echo "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu focal stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
              apt-get update
              apt-get install -y docker-ce docker-ce-cli containerd.io
              systemctl start docker
              systemctl enable docker
            fi

            # Install Docker Compose if not present
            if ! command -v docker-compose &> /dev/null; then
              echo "🐳 Installing Docker Compose..."
              curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              chmod +x /usr/local/bin/docker-compose
            fi

            mkdir -p "$DEPLOY_ROOT"
            cd "$DEPLOY_ROOT"

            # Initialize git repository if it doesn't exist
            if [ ! -d .git ]; then
              echo "Git repository not found, initializing..."
              git init
              git remote add origin https://${{ secrets.GH_PAT }}@github.com/asmtv1/gafus.git
            fi

            # Ensure we have the correct remote
            git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/asmtv1/gafus.git

            mkdir -p "$RELEASE_BACKUP_DIR"
            chmod 700 "$RELEASE_BACKUP_DIR"
            if [ -d "$DEPLOY_ROOT/.git" ]; then
              git -C "$DEPLOY_ROOT" rev-parse HEAD > "$RELEASE_BACKUP_DIR/previous.sha"
            fi
            if [ -f "$DEPLOY_ROOT/ci-cd/docker/.env" ]; then
              cp "$DEPLOY_ROOT/ci-cd/docker/.env" "$RELEASE_BACKUP_DIR/previous.env"
              chmod 600 "$RELEASE_BACKUP_DIR/previous.env"
            fi

            # Pull latest changes (force update to avoid conflicts) — до GHCR login, чтобы trap видел compose
            echo "🔄 Updating repository..."
            if ! git fetch origin; then
              echo "❌ Failed to fetch from origin"
              exit 1
            fi

            if ! git reset --hard origin/main; then
              echo "❌ Failed to reset to origin/main"
              exit 1
            fi

            if ! git clean -fd; then
              echo "❌ Failed to clean working directory"
              exit 1
            fi

            echo "✅ Repository updated successfully"
            echo "📁 Current directory: $(pwd)"
            echo "📋 Git status:"
            git status --porcelain || echo "Git status check failed"
            echo "🔗 Git remote:"
            git remote -v || echo "Git remote check failed"

            # GHCR: после git pull cwd = репозиторий; повторы при таймауте до ghcr.io с VPS
            echo "🔐 Logging in to GitHub Container Registry..."
            login_ok=0
            for attempt in 1 2 3 4 5; do
              if echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u asmtv1 --password-stdin; then
                login_ok=1
                break
              fi
              echo "⚠️ Попытка $attempt/5: docker login не удался, пауза 20 с..."
