            } > ci-cd/docker/.env
          DEPLOY_SCRIPT_3: |2+

            # Set secure permissions for .env file
            chmod 600 ci-cd/docker/.env
            echo "✅ .env file created with secure permissions"

            # Uploads directories are handled by CDN - no local directories needed

            # Download every image before touching running containers. A registry or network
            # outage must fail the deployment without taking production offline.
            echo "📥 Pulling latest Docker images..."
            images=(
              "gafus-web"
              "gafus-trainer-panel"
              "gafus-admin-panel"
              "gafus-api"
              "gafus-worker"
              "gafus-bull-board"
              "gafus-prisma"
            )

            : > "$RELEASE_BACKUP_DIR/images.tsv"
            for image in "${images[@]}"; do
              reference="ghcr.io/asmtv1/$image:latest"
              previous_id="$(docker image inspect "$reference" --format '{{.Id}}' 2>/dev/null || true)"
              if [ -z "$previous_id" ]; then
                echo "Cannot guarantee automatic image rollback: $image is missing."
                exit 1
              fi
              rollback="ghcr.io/asmtv1/$image:rollback-${{ github.run_id }}-${{ github.run_attempt }}"
              docker tag "$previous_id" "$rollback"
              echo "$reference $rollback" >> "$RELEASE_BACKUP_DIR/images.tsv"
            done

            pull_image() {
              local image="$1"
              local reference="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/$image:latest"
              for attempt in 1 2 3; do
                echo "📥 Pulling $image (attempt $attempt/3)..."
                if timeout 15m docker pull "$reference"; then
                  echo "✅ Successfully pulled $image"
                  return 0
                fi
                echo "⚠️ Pull of $image failed or timed out; retrying in 20 seconds..."
                sleep 20
              done
              return 1
            }

            pull_failed=0
            for image in "${images[@]}"; do
              if ! pull_image "$image"; then
                echo "❌ Failed to pull $image"
                pull_failed=1
              fi
            done

            if [ "$pull_failed" -ne 0 ]; then
              echo "❌ One or more docker pulls failed"
              echo "🔍 Checking registry authentication..."
              docker login ghcr.io -u asmtv1 --password-stdin <<< "${{ secrets.GHCR_TOKEN }}" || echo "⚠️ Login check failed"
              exit 1
            fi

            # Images are now used directly from registry, no need to retag

            # Remove only stopped, unused resources after all required images are present.
            docker container prune -f || true
            docker image prune -f || true

            # Infrastructure deployment - best practice: start services in dependency order
            echo "🚀 Starting infrastructure services..."

            # 1. Start core infrastructure (database, redis)
            docker-compose -f "$COMPOSE_PROD" up -d postgres redis
            echo "⏳ Waiting for core services to be ready..."
            sleep 15

            # Coordinated schema cutover. HTTPS returns 503 before we stop app
            # writers. Snapshot is taken with writers stopped; Prisma runs
            # with NO old web/api/trainer/worker process remaining.
            # Failure AFTER any Prisma invocation leaves maintenance enabled:
            # automatically restoring old images against a new schema is unsafe.
            APP_MUTATED=true
            bash "$CUTOVER_SCRIPT" prepare
            bash "$CUTOVER_SCRIPT" migrate
            bash "$CUTOVER_SCRIPT" start

            # Recreate reverse proxy only after new backend containers are
            # healthy; its bound maintenance lock continues to serve HTTP 503.
            docker-compose -f "$COMPOSE_PROD" up -d --no-deps --force-recreate nginx

            # Monitoring has no consultation schema dependency.
            docker-compose -f "$COMPOSE_PROD" up -d --no-deps --force-recreate \
              grafana-alloy yandex-metrics-sync node-exporter postgres-exporter redis-exporter blackbox-exporter

            # Keep the HTTPS configuration and the maintenance gate active.
            # Do not temporarily replace HTTPS with an HTTP-only config while
            # migrating user data. Standard webroot renewal is non-disruptive.
            docker-compose -f "$COMPOSE_PROD" run --rm --no-deps certbot renew \
              --webroot --webroot-path=/var/www/certbot --non-interactive ||
              echo "Certificate renewal deferred; existing HTTPS remains active."
            docker exec gafus-nginx nginx -t
            docker exec gafus-nginx nginx -s reload

            # Environment Validation - best practice: verify critical environment variables
            echo "🔍 Validating environment variables..."

            # Check bull-board environment variables
            if docker exec gafus-bull-board env | grep -q "REDIS_URL=redis://redis:6379"; then
                echo "✅ REDIS_URL is correctly set in bull-board"
            else
                echo "❌ REDIS_URL is missing or incorrect in bull-board"
                docker exec gafus-bull-board env | grep REDIS_URL || echo "REDIS_URL not found"
                exit 1
            fi

            # Verify bull-board can start without critical errors
            if docker logs gafus-bull-board 2>&1 | grep -q "Error: REDIS_URL is not set"; then
                echo "⚠️ Bull-board has REDIS_URL issues, but continuing..."
                # Don't exit - let the service try to start
            fi

            # Database seeds are run manually when needed
            # docker-compose -f ci-cd/docker/docker-compose.prod.yml exec -T prisma pnpm run db:seed || echo "Seeds failed or not available, continuing..."

            # Verify all replacement containers while traffic remains gated.
            bash "$CUTOVER_SCRIPT" verify
            # The gate opens only now: no old process can observe the
            # incompatible Prisma schema after the swap.
            bash "$CUTOVER_SCRIPT" open

            # A responding homepage/ping alone does not prove auth or worker readiness.
            echo "🏥 Checking production readiness..."
            for endpoint in https://gafus.ru/api/ping https://gafus.ru/api/csrf-token https://gafus.ru/api/auth/session https://api.gafus.ru/ready; do
              ready=false
              for attempt in $(seq 1 20); do
                if curl --fail --silent --show-error --max-time 10 "$endpoint" > /dev/null; then
                  ready=true
                  break
                fi
                sleep 5
              done
              if [ "$ready" != true ]; then
                echo "❌ Production endpoint failed: $endpoint"
                exit 1
              fi
            done
            worker_ready=false
            for attempt in $(seq 1 20); do
              if [ "$(docker inspect --format '{{.State.Health.Status}}' gafus-worker)" = healthy ] &&
                 [ "$(docker inspect --format '{{.RestartCount}}' gafus-worker)" = 0 ]; then
                worker_ready=true
                break
              fi
              sleep 5
            done
            if [ "$worker_ready" != true ]; then
              echo "❌ Worker is unhealthy or restarting"
              exit 1
            fi
            echo "🎉 Deployment completed and readiness checks passed!"

            # Keep previous image tags for forensic recovery only: after a
            # destructive Prisma migration, an image-only rollback is unsafe.
            echo "Previous image tags preserved; schema-aware rollback guard active."
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.GAFUS_SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 60m
          # Keep each interpolated scalar below GitHub's 21,000-character expression limit.
          script: ${{ format('{0}{1}{2}', env.DEPLOY_SCRIPT_1, env.DEPLOY_SCRIPT_2, env.DEPLOY_SCRIPT_3) }}

  # Last step of the SAME main workflow: users see Cloud.ru media only after
  # Docker+Prisma+Web/API health and fully signed CDN end-to-end checks.
  cloudru-activate-cdn:
    needs: [cloudru-prepare-media, deploy-production]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 38
    env:
      GITHUB_EVENT_NAME: push
      CLOUDRU_CDN_RELEASE_CONFIRM: reviewed-main-cloudru-cdn-cutover
      CLOUDRU_S3_ENDPOINT: https://s3.cloud.ru
      CLOUDRU_S3_ACCESS_KEY_ID: ${{ secrets.CLOUDRU_S3_ACCESS_KEY_ID }}
      CLOUDRU_S3_SECRET_ACCESS_KEY: ${{ secrets.CLOUDRU_S3_SECRET_ACCESS_KEY }}
      GALLERY_CDN_SECRET: ${{ secrets.GALLERY_CDN_SECRET }}
      FEED_CDN_SECRET: ${{ secrets.FEED_CDN_SECRET }}
      GALLERY_ORIGIN_SECRET: ${{ secrets.GALLERY_ORIGIN_SECRET }}
      FEED_ORIGIN_SECRET: ${{ secrets.FEED_ORIGIN_SECRET }}
      YC_CDN_FOLDER_ID: b1gjbsvfnd1fl68k43g6
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - name: Install locked S3 SDK dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Yandex Cloud CLI
        run: |
          curl --fail --silent --show-error --location https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$RUNNER_TEMP/yc-bin" -n
          echo "$RUNNER_TEMP/yc-bin/bin" >> "$GITHUB_PATH"
      - name: Authenticate CDN writer without putting keys into logs
        env:
          YC_CDN_SA_KEY: ${{ secrets.FEED_YC_SERVICE_ACCOUNT_KEY }}
        run: |
          set -euo pipefail
          test -n "$YC_CDN_SA_KEY"
          (umask 077; printf '%s' "$YC_CDN_SA_KEY" > "$RUNNER_TEMP/yc-cdn-sa.json")
          yc config set service-account-key "$RUNNER_TEMP/yc-cdn-sa.json"
      - name: Revalidate both CDN signatures, TLS and origin secrets
        run: node infra/cloudru/production-cdn-release.mjs --preflight
      - name: Switch Yandex CDN to warm Cloud.ru origins and verify real signed hits
        run: node infra/cloudru/production-cdn-release.mjs --activate
      - name: Restore previous application if CDN cutover fails
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.GAFUS_SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            DIR="/root/gafus-release-backups/${{ github.run_id }}-${{ github.run_attempt }}"
            test -s "$DIR/previous.sha"
            test -s "$DIR/previous.env"
            test -s "$DIR/images.tsv"
            # Prisma schema migration is already committed and may have removed
            # Telemost columns. An OLD app cannot safely be redeployed merely
            # because a CDN cutover failed; keep new compatible containers.
            if [ -f "$DIR/migration-started" ]; then
              echo "CDN rollback of old application SKIPPED: schema already migrated."
              echo "Keep compatible app images; repair CDN/origin independently."
              exit 0
            fi
            cd /root/gafus
            git reset --hard "$(cat "$DIR/previous.sha")"
            cp "$DIR/previous.env" ci-cd/docker/.env
            chmod 600 ci-cd/docker/.env
            while IFS=' ' read -r reference rollback; do
              docker tag "$rollback" "$reference"
            done < "$DIR/images.tsv"
            docker-compose -f ci-cd/docker/docker-compose.prod.yml up -d --force-recreate worker api web trainer-panel admin-panel bull-board nginx
            for endpoint in https://gafus.ru/api/ping https://api.gafus.ru/ready; do
              curl --fail --silent --show-error --retry 6 --retry-delay 5 --max-time 10 "$endpoint" > /dev/null
            done
            echo "PREVIOUS_GAFUS_APP_RUNTIME_RESTORED=true"
  # Health check removed - will be handled by separate monitoring workflow
