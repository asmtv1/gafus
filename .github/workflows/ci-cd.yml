name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# CI for different refs may run independently; all main deployments serialize.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'gafus-production-deploy' || format('gafus-workflow-{0}', github.ref) }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: asmtv1

jobs:
  # Prepare dependencies - shared job for all other jobs
  prepare-deps:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
      pnpm-cache-key: ${{ steps.pnpm-cache-key.outputs.key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Generate cache keys
        id: cache-key
        run: |
          echo "key=${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('packages/**/src/**', 'apps/**/src/**') }}" >> $GITHUB_OUTPUT

      - name: Generate pnpm cache key
        id: pnpm-cache-key
        run: echo "key=${{ hashFiles('**/pnpm-lock.yaml') }}-pnpm-store" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: |
          npm install --global pnpm@10.12.4
          test "$(pnpm --version)" = "10.12.4"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ steps.pnpm-cache-key.outputs.key }}
          restore-keys: |
            ${{ hashFiles('**/pnpm-lock.yaml') }}-pnpm-store

      - name: Install dependencies with optimizations
        run: |
          # Устанавливаем зависимости с оптимизациями
          pnpm config set store-dir ~/.pnpm-store
          pnpm config set verify-store-integrity false
          pnpm config set auto-install-peers true
          pnpm config set dedupe-peer-dependents false

          # Устанавливаем только production зависимости для CI
          pnpm install --frozen-lockfile --prefer-offline

      - name: Validate dependencies
        run: |
          echo "🔍 Validating dependencies..."
          pnpm list --depth=0 --json > /dev/null || echo "⚠️ Dependency validation failed, but continuing"
          echo "✅ Dependencies validated"

      - name: Generate Prisma Client
        run: |
          cd packages/prisma
          # Temporarily disable prisma-erd-generator in CI to avoid Chromium sandbox issues
          cp schema.prisma schema.prisma.bak
          awk 'BEGIN{skip=0} /^generator erd \{/{skip=1} skip && /^\}/{skip=0; next} !skip {print}' schema.prisma > schema.tmp && mv schema.tmp schema.prisma
          pnpm db:generate
          mv schema.prisma.bak schema.prisma

      - name: Build packages
        run: |
          # logger первым (зависимости: types, queues, cdn-upload, prisma)
          cd packages/logger && pnpm build && cd ../..
          # types, queues, cdn-upload, video-access параллельно (зависят только от logger / без workspace deps)
          (cd packages/types && pnpm build) &
          (cd packages/queues && pnpm build) &
          (cd packages/cdn-upload && pnpm build) &
          (cd packages/video-access && pnpm build) &
          wait
          # prisma (зависит от logger), затем auth, core
          cd packages/prisma && pnpm build && cd ../..
          cd packages/auth && pnpm build && cd ../..
          # mailer до core (TypeScript резолвит dist/index.d.ts у @gafus/mailer)
          cd packages/mailer && pnpm build && cd ../..
          cd packages/core && pnpm build && cd ../..
          # остальные пакеты через turbo
          pnpm build --filter=@gafus/* --filter=!@gafus/prisma --filter=!@gafus/logger --filter=!@gafus/core --filter=!@gafus/types --filter=!@gafus/queues --filter=!@gafus/cdn-upload --filter=!@gafus/auth --filter=!@gafus/video-access --filter=!@gafus/mailer

      - name: Cache build artifacts
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/dist
            packages/*/.prisma
            ~/.pnpm-store
          key: ${{ steps.cache-key.outputs.key }}-deps
          restore-keys: |
            ${{ hashFiles('**/pnpm-lock.yaml') }}-deps

  # Security and code quality checks - runs in parallel with build-apps
  security:
    runs-on: ubuntu-latest
    needs: prepare-deps
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gafus_ci
          POSTGRES_PASSWORD: gafus_ci_disposable
          POSTGRES_DB: gafus_fresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gafus_ci -d gafus_fresh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Restore dependencies cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/dist
            packages/*/.prisma
            ~/.pnpm-store
          key: ${{ needs.prepare-deps.outputs.cache-key }}-deps

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: |
          npm install --global pnpm@10.12.4
          test "$(pnpm --version)" = "10.12.4"

      - name: Restore pnpm store cache
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ needs.prepare-deps.outputs.pnpm-cache-key }}
          restore-keys: |
            ${{ hashFiles('**/pnpm-lock.yaml') }}-pnpm-store

      - name: Install dependencies (optimized)
        run: |
          pnpm config set store-dir ~/.pnpm-store
          pnpm config set verify-store-integrity false
          pnpm config set auto-install-peers true
          pnpm config set dedupe-peer-dependents false

          # Установка с предпочтением кэша, но с возможностью загрузки из сети
          pnpm install --frozen-lockfile --prefer-offline

      - name: Run security audit
        run: pnpm audit --audit-level high || echo "Security audit found issues, but continuing build"

      - name: Run Web ESLint (blocking)
        run: pnpm --filter @gafus/web lint

      - name: Enforce core ownership of Prisma access
        run: node scripts/check-app-prisma-boundary.mjs

      - name: Guard Worker Prisma boundary
        run: node scripts/check-worker-prisma-boundary.mjs

      - name: Guard empty PostgreSQL bootstrap SQL against migration drift
        run: python3 packages/prisma/scripts/generate-fresh-db-extras.py --check

      - name: Verify production course caching is automatic and migration-safe
        run: node --test ci-cd/scripts/course-cache-production-contract.test.mjs

      - name: Bootstrap clean PostgreSQL with historical constraints
        env:
          DATABASE_URL: postgresql://gafus_ci:gafus_ci_disposable@localhost:5432/gafus_fresh
        run: |
          bash packages/prisma/scripts/bootstrap-fresh-postgres.sh
          checks=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM pg_constraint WHERE contype='c' AND connamespace='public'::regnamespace")
          triggers=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM pg_trigger WHERE NOT tgisinternal")
          partial_indexes=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND indexdef ILIKE '% WHERE %'")
          test "$checks" -ge 54
          test "$triggers" -ge 5
          test "$partial_indexes" -ge 2
          pnpm --filter @gafus/prisma exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel schema.prisma --exit-code

      - name: Guard safe Feed poll rollout before production deploy
        run: node --test ci-cd/scripts/feed-poll-release-contract.test.mjs

      - name: Verify poll migration against populated isolated PostgreSQL
        # No staging server exists. Fail CI before any production deployment.
        # Runner PostgreSQL service is ephemeral; never use application DATABASE_URL.
        env:
          POLL_TEST_DATABASE_URL: postgresql://gafus_ci:gafus_ci_disposable@127.0.0.1:5432/gafus_poll_ci_migration
        run: python3 packages/prisma/scripts/test-feed-polls-ci.py

      - name: Verify Web and Mobile poll composer and voting UX
        run: |
          pnpm --filter @gafus/web exec vitest run --config vitest.config.ts src/features/feed/FeedPollComposer.test.tsx src/features/feed/FeedPollCard.test.tsx
          pnpm --filter @gafus/mobile exec vitest run --config vitest.config.ts src/features/feed/FeedPollComposer.test.tsx src/features/feed/FeedPollCard.test.tsx
          pnpm --filter @gafus/core exec vitest run --config vitest.config.ts src/services/feed/publication-client.test.ts
          pnpm exec vitest run packages/feed-server/src/index.test.ts

      - name: Guard legacy domain adapters against direct Prisma
        run: node scripts/check-domain-package-prisma-boundary.mjs

      - name: Check workspace dependency cycles
        run: node scripts/check-workspace-graph.mjs

      - name: Guard Mobile against core server imports
        run: node scripts/check-mobile-core-boundary.mjs

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: HEAD~1

  # Build and test all apps - runs in parallel with security
  # Turborepo remote cache (30-50% быстрее при повторных сборках):
  # 1. npx turbo login && npx turbo link
  # 2. GitHub: Secrets → TURBO_TOKEN, Variables → TURBO_TEAM
  build-apps:
    runs-on: ubuntu-latest
    needs: prepare-deps
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # Совпадает с образом web: счётчик Метрики в клиентской сборке
      NEXT_PUBLIC_YM_COUNTER_ID: ${{ secrets.NEXT_PUBLIC_YM_COUNTER_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # нужен для --filter='...[origin/main]'

      - name: Restore dependencies cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/dist
            packages/*/.prisma
            ~/.pnpm-store
          key: ${{ needs.prepare-deps.outputs.cache-key }}-deps

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: |
          npm install --global pnpm@10.12.4
          test "$(pnpm --version)" = "10.12.4"

      - name: Restore pnpm store cache
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ needs.prepare-deps.outputs.pnpm-cache-key }}
          restore-keys: |
            ${{ hashFiles('**/pnpm-lock.yaml') }}-pnpm-store

      - name: Install dependencies (optimized)
        run: |
          pnpm config set store-dir ~/.pnpm-store
          pnpm config set verify-store-integrity false
          pnpm config set auto-install-peers true
          pnpm config set dedupe-peer-dependents false

          # Установка с предпочтением кэша, но с возможностью загрузки из сети
          pnpm install --frozen-lockfile --prefer-offline

      - name: Build, test, typecheck apps
        run: |
          # main+push: полная сборка (для деплоя). PR/develop: только изменённые приложения.
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            pnpm turbo run build test typecheck --filter='./apps/web' --filter='./apps/trainer-panel'  --filter='./apps/admin-panel' --filter='./apps/api'
          else
            pnpm turbo run build test typecheck --filter='./apps/*...[origin/main]'
          fi

      - name: Mobile typecheck and unit tests (blocking)
        run: |
          pnpm --filter @gafus/mobile typecheck
          pnpm --filter @gafus/mobile test

      - name: Mobile Android/iOS Metro export (blocking, no publishing)
        env:
          NODE_ENV: production
          EXPO_OFFLINE: "1"
        run: |
          pnpm --filter @gafus/mobile exec expo export --platform android --output-dir "$RUNNER_TEMP/gafus-metro-android"
          pnpm --filter @gafus/mobile exec expo export --platform ios --output-dir "$RUNNER_TEMP/gafus-metro-ios"

      - name: Cache app build
        uses: actions/cache@v5
        with:
          path: |
            apps/web/.next
            apps/trainer-panel/.next
            apps/admin-panel/.next
            apps/api/dist
          key: ${{ needs.prepare-deps.outputs.cache-key }}-all-apps-build
          restore-keys: |
            ${{ needs.prepare-deps.outputs.cache-key }}-all-apps-build

  # Build worker packages for Docker - REMOVED (using multi-stage build)
  # Mobile: typecheck и unit-тесты проходят в build-apps; native Expo-сборки выполняются отдельно.

  # Prepare Docker build context
  prepare-docker:
    needs: [security, build-apps]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      docker-cache-key: ${{ steps.docker-cache-key.outputs.key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Generate Docker cache key
        id: docker-cache-key
        run: echo "key=${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/Dockerfile*') }}-docker" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Create Docker build cache
        run: |
          # Создаем базовый образ с зависимостями для кэширования
          docker buildx build \
            --platform linux/amd64 \
            --target base \
            --build-arg "NEXT_PUBLIC_YM_COUNTER_ID=${{ secrets.NEXT_PUBLIC_YM_COUNTER_ID }}" \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/gafus-base:latest \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            -f ci-cd/docker/Dockerfile-web-optimized \
            . || echo "Base image creation failed, continuing with build"

  # Build all Docker images in parallel
  build-images:
    needs: [prepare-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - { name: "web", file: "Dockerfile-web-optimized", tag: "gafus-web" }
          - {
              name: "trainer-panel",
              file: "Dockerfile-trainer-panel-optimized",
              tag: "gafus-trainer-panel",
            }
          - {
              name: "admin-panel",
              file: "Dockerfile-admin-panel-optimized",
              tag: "gafus-admin-panel",
            }
          - { name: "api", file: "Dockerfile-api-optimized", tag: "gafus-api" }
          - { name: "worker", file: "Dockerfile-worker-optimized", tag: "gafus-worker" }
          - { name: "bull-board", file: "Dockerfile-bull-board-optimized", tag: "gafus-bull-board" }
          - { name: "prisma", file: "Dockerfile-prisma-optimized", tag: "gafus-prisma" }
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push ${{ matrix.image.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci-cd/docker/${{ matrix.image.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image.tag }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image.tag }}:sha-${{ github.sha }}
          # web: только GHA cache (без registry) — актуальный код, локальный кэш слоёв
          cache-from: |
            type=gha
            ${{ matrix.image.name != 'web' && format('type=registry,ref={0}/{1}/gafus-base:latest', env.REGISTRY, env.IMAGE_NAME) || '' }}
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            NEXT_PUBLIC_YM_COUNTER_ID=${{ matrix.image.name == 'web' && secrets.NEXT_PUBLIC_YM_COUNTER_ID || '' }}

  cloudru-media-contracts:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production deploy workflow contract
        run: node --test ci-cd/scripts/deploy-only-contract.test.mjs
      - name: Offline Cloud.ru media acceptance and production release safety tests
        run: pnpm test:cloudru-media
      - name: Reject Yandex CDN release routes and verify fail-closed Beget gating
        run: node --test infra/cloudru/beget-config.test.mjs infra/cloudru/beget-release-readiness.test.mjs
      - name: Cloud.ru registry publication retry acceptance tests
        run: node --test ci-cd/scripts/cloudru-publish-retry.test.mjs
      - name: Cloud.ru scheduled processing contract
        run: pnpm --filter @gafus/worker exec vitest run src/cloudru-media-dispatcher.test.ts

  # Fail closed BEFORE publishing production images or changing Cloud.ru/VPS.
  # The synthetic final objects must be provisioned separately with approval;
  # this step only reads signed URLs. Never substitute a Yandex CDN preflight.
  beget-readonly-preflight:
    needs: [security, build-apps, cloudru-media-contracts]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      GAFUS_MEDIA_CDN_TARGET: ${{ vars.GAFUS_MEDIA_CDN_TARGET }}
      BEGET_CDN_RELEASE_CONFIRM: ${{ vars.BEGET_CDN_RELEASE_CONFIRM }}
      BEGET_CDN_PURGE_API_VERIFIED: ${{ vars.BEGET_CDN_PURGE_API_VERIFIED }}
      BEGET_CDN_CACHE_KEY_VERIFIED: ${{ vars.BEGET_CDN_CACHE_KEY_VERIFIED }}
      BEGET_CDN_PURGE_PROPAGATION_VERIFIED: ${{ vars.BEGET_CDN_PURGE_PROPAGATION_VERIFIED }}
      BEGET_CDN_LIVE_SMOKE_VERIFIED: ${{ vars.BEGET_CDN_LIVE_SMOKE_VERIFIED }}
      GALLERY_BEGET_CDN_SERVICE_ID: ${{ vars.GALLERY_BEGET_CDN_SERVICE_ID }}
      FEED_BEGET_CDN_SERVICE_ID: ${{ vars.FEED_BEGET_CDN_SERVICE_ID }}
      GALLERY_CDN_SECRET: ${{ secrets.GALLERY_CDN_SECRET }}
      FEED_CDN_SECRET: ${{ secrets.FEED_CDN_SECRET }}
      GALLERY_ORIGIN_SECRET: ${{ secrets.GALLERY_ORIGIN_SECRET }}
      FEED_ORIGIN_SECRET: ${{ secrets.FEED_ORIGIN_SECRET }}
      BEGET_CDN_API_TOKEN: ${{ secrets.BEGET_CDN_API_TOKEN }}
      BEGET_GALLERY_SMOKE_FINAL_KEY: ${{ vars.BEGET_GALLERY_SMOKE_FINAL_KEY }}
      BEGET_GALLERY_SMOKE_SHA256: ${{ vars.BEGET_GALLERY_SMOKE_SHA256 }}
      BEGET_FEED_SMOKE_FINAL_KEY: ${{ vars.BEGET_FEED_SMOKE_FINAL_KEY }}
      BEGET_FEED_SMOKE_SHA256: ${{ vars.BEGET_FEED_SMOKE_SHA256 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate Beget-only production approvals and existing secret bindings
        run: node infra/cloudru/beget-release-readiness.mjs --check
      - name: Verify both protected Beget edges with real signed final objects (read-only)
        run: node infra/cloudru/beget-production-smoke.mjs

  # Four immutable, revision-tagged images are required before any production changes.
  cloudru-build-media-images:
    needs: [security, build-apps, cloudru-media-contracts, beget-readonly-preflight]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - { media: gallery, role: origin, dockerfile: Dockerfile.origin }
          - { media: feed, role: origin, dockerfile: Dockerfile.origin }
          - { media: gallery, role: worker, dockerfile: Dockerfile }
          - { media: feed, role: worker, dockerfile: Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Authorize private Cloud.ru Registry
        uses: docker/login-action@v3
        with:
          registry: gafus.cr.cloud.ru
          username: ${{ secrets.CLOUDRU_KEY_ID }}
          password: ${{ secrets.CLOUDRU_KEY_SECRET }}
      - name: Publish Cloud.ru production revision (retry temporary registry 429/5xx)
        run: bash ci-cd/scripts/publish-cloudru-image.sh "${{ matrix.media }}" "${{ matrix.role }}" "${{ matrix.dockerfile }}" "${{ github.sha }}"

  # Only private Cloud.ru S3, protected Origins and bounded processing Jobs.
  # Beget live signing/edge readiness was verified BEFORE image publication.
  cloudru-prepare-media:
    needs: [cloudru-build-media-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 22
    env:
      GITHUB_EVENT_NAME: push
      CLOUDRU_PROD_DEPLOY_CONFIRM: preapproved-main-only-media-release
      CLOUDRU_S3_PROBE_CONFIRM: synthetic-private-s3-only
      CLOUDRU_PROJECT_ID: ${{ secrets.CLOUDRU_PROJECT_ID }}
      CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
      CLOUDRU_KEY_SECRET: ${{ secrets.CLOUDRU_KEY_SECRET }}
      CLOUDRU_S3_ENDPOINT: https://s3.cloud.ru
      CLOUDRU_S3_ACCESS_KEY_ID: ${{ secrets.CLOUDRU_S3_ACCESS_KEY_ID }}
      CLOUDRU_S3_SECRET_ACCESS_KEY: ${{ secrets.CLOUDRU_S3_SECRET_ACCESS_KEY }}
      GALLERY_CDN_SECRET: ${{ secrets.GALLERY_CDN_SECRET }}
      FEED_CDN_SECRET: ${{ secrets.FEED_CDN_SECRET }}
      GALLERY_ORIGIN_SECRET: ${{ secrets.GALLERY_ORIGIN_SECRET }}
      FEED_ORIGIN_SECRET: ${{ secrets.FEED_ORIGIN_SECRET }}
      GALLERY_INTERNAL_HMAC_SECRET: ${{ secrets.GALLERY_INTERNAL_HMAC_SECRET }}
      FEED_INTERNAL_HMAC_SECRET: ${{ secrets.FEED_INTERNAL_HMAC_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - name: Install cloud storage tooling from lockfile
        run: pnpm install --frozen-lockfile
      - uses: docker/login-action@v3
        with:
          registry: gafus.cr.cloud.ru
          username: ${{ secrets.CLOUDRU_KEY_ID }}
          password: ${{ secrets.CLOUDRU_KEY_SECRET }}
      - name: Confirm guarded OCI release plan
        run: node infra/cloudru/production-media-release.mjs --plan
      - name: Confirm all three private Cloud.ru S3 buckets can read, write and delete
        run: node infra/cloudru/production-s3-preflight.mjs --verify
      - name: Provision and warm Cloud.ru protected Origins and bounded processing Jobs
        run: node infra/cloudru/production-media-release.mjs --prepare

  # Deploy to staging (develop branch)
  # Заглушка: staging не реализован — один prod-сервер. Реальный деплой добавить при появлении staging-инфраструктуры.
  deploy-staging:
    needs: [security, build-apps]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging
        run: echo "Deploy to staging environment"

  # Production deploy is shared with manual Deploy Only. No second script.
  deploy-production:
    needs: [security, build-apps, build-images, cloudru-prepare-media]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/production-deploy-reusable.yml
    with:
      release_sha: ${{ github.sha }}
    secrets: inherit

  # Post-deploy read-only verification. Never switch, mutate, prepare,
  # or roll back Gallery/Feed to Yandex CDN (including on Beget 5xx).
  beget-verify-after-deploy:
    needs: [beget-readonly-preflight, cloudru-prepare-media, deploy-production]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      GALLERY_CDN_SECRET: ${{ secrets.GALLERY_CDN_SECRET }}
      FEED_CDN_SECRET: ${{ secrets.FEED_CDN_SECRET }}
      BEGET_GALLERY_SMOKE_FINAL_KEY: ${{ vars.BEGET_GALLERY_SMOKE_FINAL_KEY }}
      BEGET_GALLERY_SMOKE_SHA256: ${{ vars.BEGET_GALLERY_SMOKE_SHA256 }}
      BEGET_FEED_SMOKE_FINAL_KEY: ${{ vars.BEGET_FEED_SMOKE_FINAL_KEY }}
      BEGET_FEED_SMOKE_SHA256: ${{ vars.BEGET_FEED_SMOKE_SHA256 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify Beget Gallery and Feed signed delivery after application health
        run: node infra/cloudru/beget-production-smoke.mjs
