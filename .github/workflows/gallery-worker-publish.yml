name: Gallery Cloud.ru worker image (manual publish only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PUBLISH_GALLERY_WORKER; no Cloud Job updates are performed'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: gafus-gallery-worker-publish
  cancel-in-progress: false

jobs:
  gallery-worker:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH_GALLERY_WORKER'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Verify lockfile and Gallery key/processor contracts
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir packages/gallery-storage exec vitest run src/galleryV2Keys.test.ts src/security.test.ts --maxWorkers=1
          pnpm --dir apps/gallery-cloud exec vitest run src/worker.test.ts src/processor.test.ts --maxWorkers=1
          node --test ci-cd/scripts/cloudru-publish-retry.test.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: gafus.cr.cloud.ru
          username: ${{ secrets.CLOUDRU_KEY_ID }}
          password: ${{ secrets.CLOUDRU_KEY_SECRET }}
      - name: Publish ONLY immutable Gallery Worker image
        env:
          REVISION: ${{ github.sha }}
        run: bash ci-cd/scripts/publish-cloudru-image.sh gallery worker Dockerfile "$REVISION"
      - name: Require readable immutable OCI manifest before reporting success
        env:
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          image="gafus.cr.cloud.ru/gafus-gallery-worker:$REVISION"
          for attempt in 1 2 3 4 5 6; do
            if output="$(docker buildx imagetools inspect "$image" 2>&1)"; then break; fi
            if (( attempt == 6 )); then echo 'Gallery OCI digest readback failed' >&2; exit 1; fi
            sleep $((attempt*5))
          done
          digest="$(printf '%s\n' "$output" | awk '$1 == "Digest:" {print $2; exit}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'Invalid Gallery immutable digest' >&2; exit 1; }
          grep -q 'linux/amd64' <<< "$output" || { echo 'Missing Gallery linux/amd64 platform' >&2; exit 1; }
          echo "Gallery OCI digest: gafus.cr.cloud.ru/gafus-gallery-worker@$digest"
          echo 'This workflow has NOT modified any Cloud.ru Job or production app.'
