name: GAFUS production deploy (reusable)

on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact commit SHA of a fully built release
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      # Also guard manual Deploy Only; do not even open SSH if Beget is not
      # demonstrably ready. No registry, Cloud.ru or CDN writes in this step.
      - name: Validate Beget-only production readiness before SSH
        env:
          GAFUS_MEDIA_CDN_TARGET: ${{ vars.GAFUS_MEDIA_CDN_TARGET }}
          BEGET_CDN_RELEASE_CONFIRM: ${{ vars.BEGET_CDN_RELEASE_CONFIRM }}
          BEGET_CDN_PURGE_API_VERIFIED: ${{ vars.BEGET_CDN_PURGE_API_VERIFIED }}
          BEGET_CDN_CACHE_KEY_VERIFIED: ${{ vars.BEGET_CDN_CACHE_KEY_VERIFIED }}
          BEGET_CDN_PURGE_PROPAGATION_VERIFIED: ${{ vars.BEGET_CDN_PURGE_PROPAGATION_VERIFIED }}
          BEGET_CDN_LIVE_SMOKE_VERIFIED: ${{ vars.BEGET_CDN_LIVE_SMOKE_VERIFIED }}
          GALLERY_BEGET_CDN_SERVICE_ID: ${{ vars.GALLERY_BEGET_CDN_SERVICE_ID }}
          FEED_BEGET_CDN_SERVICE_ID: ${{ vars.FEED_BEGET_CDN_SERVICE_ID }}
          GALLERY_CDN_SECRET: ${{ secrets.GALLERY_CDN_SECRET }}
          FEED_CDN_SECRET: ${{ secrets.FEED_CDN_SECRET }}
          GALLERY_ORIGIN_SECRET: ${{ secrets.GALLERY_ORIGIN_SECRET }}
          FEED_ORIGIN_SECRET: ${{ secrets.FEED_ORIGIN_SECRET }}
          BEGET_CDN_API_TOKEN: ${{ secrets.BEGET_CDN_API_TOKEN }}
          BEGET_GALLERY_SMOKE_FINAL_KEY: ${{ vars.BEGET_GALLERY_SMOKE_FINAL_KEY }}
          BEGET_GALLERY_SMOKE_SHA256: ${{ vars.BEGET_GALLERY_SMOKE_SHA256 }}
          BEGET_FEED_SMOKE_FINAL_KEY: ${{ vars.BEGET_FEED_SMOKE_FINAL_KEY }}
          BEGET_FEED_SMOKE_SHA256: ${{ vars.BEGET_FEED_SMOKE_SHA256 }}
        run: |
          node infra/cloudru/beget-release-readiness.mjs --check
          node infra/cloudru/beget-production-smoke.mjs

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SCRIPT_1: |2+
            set -eo pipefail
            echo "🚀 Starting production deployment..."

            DEPLOY_ROOT="/root/gafus"
            COMPOSE_PROD="$DEPLOY_ROOT/ci-cd/docker/docker-compose.prod.yml"
            RELEASE_BACKUP_DIR="/root/gafus-release-backups/${{ github.run_id }}-${{ github.run_attempt }}"
            # Child cutover commands must share this release backup and compose paths.
            export DEPLOY_ROOT COMPOSE_PROD RELEASE_BACKUP_DIR
            APP_MUTATED=false
            CUTOVER_SCRIPT="$DEPLOY_ROOT/ci-cd/scripts/production-schema-cutover.sh"
            MAINTENANCE_GATE="$DEPLOY_ROOT/ci-cd/nginx/conf.d/.release-maintenance"

            # Retain rollback tags only while a deploy is in progress. Never
            # remove :latest, Docker volumes, or images used by containers.
            cleanup_obsolete_gafus_images() {
              echo "Cleaning up obsolete GAFUS rollback/SHA image tags..."
              local image_reference
              while IFS= read -r image_reference; do
                case "$image_reference" in
                  ghcr.io/asmtv1/gafus-*:rollback-*|ghcr.io/asmtv1/gafus-*:sha-*)
                    docker image rm "$image_reference" ||
                      echo "IMAGE_CLEANUP_DEFERRED: $image_reference"
                    ;;
                esac
              done < <(docker image ls --format '{{.Repository}}:{{.Tag}}')
              docker image prune -f || echo "DANGLING_IMAGE_PRUNE_DEFERRED"
            }

            restore_previous_runtime() {
              rc="$1"
              if [ "$rc" -eq 0 ]; then return 0; fi
              trap - EXIT INT TERM
              echo "Deployment failed ($rc). Checking whether schema mutation has begun."
              if [ -f "$RELEASE_BACKUP_DIR/migration-started" ]; then
                # Some Prisma migrations may already be committed. Restoring an
                # older image against a newer DB is unsafe (Telemost columns gone).
                # Keep Nginx serving 503 for a controlled, manual recovery.
                touch "$MAINTENANCE_GATE"
                echo "SCHEMA_MIGRATION_STARTED: retaining maintenance mode."
                echo "DO NOT automatically restore old Docker images or old Prisma schema."
                echo "Database backup: $RELEASE_BACKUP_DIR/database-backup-path"
                echo "Investigate migration status and repair forward or perform a verified DB restore."
                return 0
              fi
              if [ "$APP_MUTATED" != "true" ]; then
                if [ -s "$RELEASE_BACKUP_DIR/previous.sha" ]; then
                  git -C "$DEPLOY_ROOT" reset --hard "$(cat "$RELEASE_BACKUP_DIR/previous.sha")" >/dev/null ||
                    echo "PREFLIGHT_GIT_RESTORE_FAILED"
                fi
                if [ -s "$RELEASE_BACKUP_DIR/previous.env" ]; then
                  cp "$RELEASE_BACKUP_DIR/previous.env" "$DEPLOY_ROOT/ci-cd/docker/.env"
                  chmod 600 "$DEPLOY_ROOT/ci-cd/docker/.env"
                fi
                restore_ok=true
                if [ -s "$RELEASE_BACKUP_DIR/images.tsv" ]; then
                  while IFS=' ' read -r reference rollback; do
                    if ! docker tag "$rollback" "$reference"; then
                      echo "PREFLIGHT_IMAGE_RESTORE_FAILED"
                      restore_ok=false
                    fi
                  done < "$RELEASE_BACKUP_DIR/images.tsv"
                fi
                if [ "$restore_ok" = true ]; then
                  cleanup_obsolete_gafus_images
                else
                  echo "Keeping rollback tags for manual recovery."
                fi
                echo "Existing application containers have not been replaced."
                return 0
              fi
              set +e
              if [ -s "$RELEASE_BACKUP_DIR/previous.sha" ]; then
                git -C "$DEPLOY_ROOT" reset --hard "$(cat "$RELEASE_BACKUP_DIR/previous.sha")" > /dev/null ||
                  echo "ROLLBACK_GIT_RESTORE_FAILED"
              fi
              if [ -s "$RELEASE_BACKUP_DIR/previous.env" ]; then
                cp "$RELEASE_BACKUP_DIR/previous.env" "$DEPLOY_ROOT/ci-cd/docker/.env"
                chmod 600 "$DEPLOY_ROOT/ci-cd/docker/.env"
              fi
              if [ -s "$RELEASE_BACKUP_DIR/images.tsv" ]; then
                while IFS=' ' read -r reference rollback; do
                  docker tag "$rollback" "$reference" || echo "ROLLBACK_IMAGE_TAG_FAILED"
                done < "$RELEASE_BACKUP_DIR/images.tsv"
              fi
              # Keep the already-running nginx maintenance gate active until
              # all OLD app containers are actually healthy again.
              if docker-compose -f "$COMPOSE_PROD" up -d --no-deps --force-recreate worker api web trainer-panel admin-panel bull-board; then
                old_healthy=true
                for app in worker api web trainer-panel admin-panel bull-board; do
                  app_ready=false
                  for attempt in $(seq 1 30); do
                    health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{if .State.Running}}running{{else}}stopped{{end}}{{end}}' "gafus-$app" 2>/dev/null || true)"
                    if [ "$health" = healthy ] || [ "$health" = running ]; then app_ready=true; break; fi
                    sleep 3
                  done
                  if [ "$app_ready" != true ]; then old_healthy=false; break; fi
                done
                if [ "$old_healthy" = true ]; then
                  # Restored nginx may no longer contain the maintenance guard.
                  # Recreate it only AFTER all restored upstreams are healthy.
                  rm -f "$MAINTENANCE_GATE"
                  docker-compose -f "$COMPOSE_PROD" up -d --no-deps --force-recreate nginx ||
                    echo "ROLLBACK_NGINX_RESTART_FAILED: manually restore HTTPS."
                  echo "Old runtime restored BEFORE any migration."
                else
                  echo "OLD_RUNTIME_UNHEALTHY: maintenance retained for manual recovery."
                fi
              else
                echo "ROLLBACK_RUNTIME_RESTART_FAILED: maintenance retained for manual recovery."
              fi
              return 0
            }
            trap 'restore_previous_runtime $?' EXIT
            trap 'exit 130' INT TERM

            # Log deployment start
            echo "📅 Deployment started at: $(date)"
            echo "🔧 Server: ${{ secrets.SERVER_HOST }}"
            echo "📦 Docker version: $(docker --version)"
            echo "🐳 Docker Compose version: $(docker-compose --version)"

            # Install basic tools first
            echo "🔧 Installing basic tools..."
            apt-get update
            apt-get install -y curl wget

            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              echo "🐳 Installing Docker..."
              # Use apt for Ubuntu 20.04 (focal)
              apt-get install -y apt-transport-https ca-certificates gnupg lsb-release
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
              echo "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu focal stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
              apt-get update
              apt-get install -y docker-ce docker-ce-cli containerd.io
              systemctl start docker
              systemctl enable docker
            fi

            # Install Docker Compose if not present
            if ! command -v docker-compose &> /dev/null; then
              echo "🐳 Installing Docker Compose..."
              curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              chmod +x /usr/local/bin/docker-compose
            fi

            mkdir -p "$DEPLOY_ROOT"
            cd "$DEPLOY_ROOT"

            # Initialize git repository if it doesn't exist
            if [ ! -d .git ]; then
              echo "Git repository not found, initializing..."
              git init
              git remote add origin https://${{ secrets.GH_PAT }}@github.com/asmtv1/gafus.git
            fi

            # Ensure we have the correct remote
            git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/asmtv1/gafus.git

            mkdir -p "$RELEASE_BACKUP_DIR"
            chmod 700 "$RELEASE_BACKUP_DIR"
            if [ -d "$DEPLOY_ROOT/.git" ]; then
              git -C "$DEPLOY_ROOT" rev-parse HEAD > "$RELEASE_BACKUP_DIR/previous.sha"
            fi
            if [ -f "$DEPLOY_ROOT/ci-cd/docker/.env" ]; then
              cp "$DEPLOY_ROOT/ci-cd/docker/.env" "$RELEASE_BACKUP_DIR/previous.env"
              chmod 600 "$RELEASE_BACKUP_DIR/previous.env"
            fi

            # Preflight: only a commit on main is valid. Refuse accidental mixed-image
            # deployments before mutating any running container or its bind mounts.
            [[ "${{ inputs.release_sha }}" =~ ^[0-9a-f]{40}$ ]] || { echo 'BAD_RELEASE_SHA'; exit 1; }
            # Checkout exact verified release SHA (never a mutable branch tip) — до GHCR login, чтобы trap видел compose
            echo "🔄 Updating repository..."
            if ! git fetch origin; then
              echo "❌ Failed to fetch from origin"
              exit 1
            fi

            if [ "$(git rev-parse origin/main)" != "${{ inputs.release_sha }}" ]; then
              echo "RELEASE_SUPERSEDED: main moved to a newer commit."
              exit 1
            fi

            if ! git reset --hard "${{ inputs.release_sha }}"; then
              echo "❌ Failed to reset to exact release SHA"
              exit 1
            fi

            if ! git clean -fd; then
              echo "❌ Failed to clean working directory"
              exit 1
            fi

            if ! docker exec gafus-nginx nginx -t; then
              echo "BLOCKED: prospective nginx config fails preflight; reverting mounted config."
              git reset --hard "$(cat "$RELEASE_BACKUP_DIR/previous.sha")"
              exit 1
            fi
            echo "✅ Repository updated successfully"
            echo "📁 Current directory: $(pwd)"
            echo "📋 Git status:"
            git status --porcelain || echo "Git status check failed"
            echo "Git remote configured; credentials are not printed."

            # GHCR: после git pull cwd = репозиторий; повторы при таймауте до ghcr.io с VPS
            echo "🔐 Logging in to GitHub Container Registry..."
            login_ok=0
            for attempt in 1 2 3 4 5; do
              if echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u asmtv1 --password-stdin; then
                login_ok=1
                break
              fi
              echo "⚠️ Попытка $attempt/5: docker login не удался, пауза 20 с..."
              sleep 20
            done
            if [ "$login_ok" -ne 1 ]; then
              echo "❌ docker login ghcr.io не удался после 5 попыток (сеть/файрвол/DNS до ghcr.io)"
              exit 1
            fi

            # All 8 Vox values must exist before changing the running deployment.
            if [ -z "${{ secrets.VOXIMPLANT_ACCOUNT_ID }}" ]; then echo "Missing GitHub Actions Secret: VOXIMPLANT_ACCOUNT_ID"; exit 1; fi
            if [ -z "${{ secrets.VOXIMPLANT_APPLICATION_ID }}" ]; then echo "Missing GitHub Actions Secret: VOXIMPLANT_APPLICATION_ID"; exit 1; fi
            if [ -z "${{ secrets.VOXIMPLANT_ACCOUNT_NAME }}" ]; then echo "Missing GitHub Actions Secret: VOXIMPLANT_ACCOUNT_NAME"; exit 1; fi
            if [ -z "${{ secrets.VOXIMPLANT_APPLICATION_NAME }}" ]; then echo "Missing GitHub Actions Secret: VOXIMPLANT_APPLICATION_NAME"; exit 1; fi
            if [ -z "${{ secrets.VOXIMPLANT_KEY_ID }}" ]; then echo "Missing GitHub Actions Secret: VOXIMPLANT_KEY_ID"; exit 1; fi
            if [ -z "${{ secrets.VOXIMPLANT_PRIVATE_KEY_BASE64 }}" ]; then echo "Missing GitHub Actions Secret: VOXIMPLANT_PRIVATE_KEY_BASE64"; exit 1; fi
            if [ -z "${{ secrets.VOXIMPLANT_CREDENTIAL_SECRET }}" ]; then echo "Missing GitHub Actions Secret: VOXIMPLANT_CREDENTIAL_SECRET"; exit 1; fi
            if [ -z "${{ secrets.VOXIMPLANT_ADMISSION_SECRET }}" ]; then echo "Missing GitHub Actions Secret: VOXIMPLANT_ADMISSION_SECRET"; exit 1; fi

            # Beget/CDNvideo is the ONLY supported Gallery/Feed delivery CDN.
            # Fail closed until explicit release approval and live purge/smoke gates.
            # Never deploy a Yandex CDN fallback or rollback configuration.
            if [ "${{ vars.GAFUS_MEDIA_CDN_TARGET }}" != "beget" ]; then
              echo "Beget-only release not authorized: GAFUS_MEDIA_CDN_TARGET must be beget"
              exit 1
            fi
                if [ "${{ vars.BEGET_CDN_RELEASE_CONFIRM }}" != "reviewed-gallery-feed-beget-cutover" ]; then
                  echo "Beget production CDN release has not been explicitly confirmed"
                  exit 1
                fi
                # Beget CDNvideo uses the EXISTING per-scope secret values.
                # Only the signing algorithm and host change; do not rotate keys.
                if [ -z "${{ secrets.GALLERY_CDN_SECRET }}" ] || [ -z "${{ secrets.FEED_CDN_SECRET }}" ]; then
                  echo "Missing Gallery or Feed production CDN signing secret"
                  exit 1
                fi
                # Account deletion must not be silently broken by switching
                # delivery before the exact-path purge and edge checks work.
                if [ -z "${{ secrets.BEGET_CDN_API_TOKEN }}" ] || \
                   [ -z "${{ vars.GALLERY_BEGET_CDN_SERVICE_ID }}" ] || \
                   [ -z "${{ vars.FEED_BEGET_CDN_SERVICE_ID }}" ]; then
                  echo "Beget purge token/service IDs are not configured"
                  exit 1
                fi
                if [ "${{ vars.BEGET_CDN_PURGE_API_VERIFIED }}" != "true" ] || \
                   [ "${{ vars.BEGET_CDN_CACHE_KEY_VERIFIED }}" != "true" ] || \
                   [ "${{ vars.BEGET_CDN_PURGE_PROPAGATION_VERIFIED }}" != "true" ] || \
                   [ "${{ vars.BEGET_CDN_LIVE_SMOKE_VERIFIED }}" != "true" ]; then
                  echo "Beget CDN live delivery or purge validation is still pending"
                  exit 1
                fi

            # Create .env file from GitHub Secrets
            echo "🔐 Creating .env file from GitHub Secrets..."
            {
              echo "# Database"
              echo "POSTGRES_DB=gafus"
              echo "POSTGRES_USER=gafus"
              echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}"
              echo "DATABASE_URL=postgresql://gafus:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/gafus"
              echo ""
              echo "# Redis"
              echo "REDIS_URL=redis://redis:6379"
              echo ""
              echo "# NextAuth секреты"
              echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}"
              echo ""
              echo "# JWT секреты для API"
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
              echo "JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}"
              echo ""
              echo "# URLs приложений"
              echo "NEXTAUTH_URL=https://gafus.ru"
              echo "TRAINER_PANEL_URL=https://trainer-panel.gafus.ru"
              echo "NEXT_PUBLIC_TRACER_APP_TOKEN=${{ secrets.NEXT_PUBLIC_TRACER_APP_TOKEN }}"
              echo "NEXT_PUBLIC_APP_VERSION=1.7.1"
              echo "NEXT_PUBLIC_ENABLE_TRACER=true"
              echo "WEB_APP_URL=${{ vars.WEB_APP_URL || 'https://gafus.ru' }}"
              echo ""
              echo "# Cookie домен"
              echo "AUTH_COOKIE_DOMAIN=.gafus.ru"
              echo ""
              echo "# VAPID ключи для Push уведомлений"
              echo "VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}"
              echo "VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}"
              echo "VAPID_SUBJECT=mailto:admin@gafus.ru"
              echo ""
              echo "# Existing Yandex credentials for unrelated services; NOT a Gallery/Feed CDN route"
              echo "YC_ACCESS_KEY_ID=${{ secrets.YC_ACCESS_KEY_ID }}"
              echo "YC_SECRET_ACCESS_KEY=${{ secrets.YC_SECRET_ACCESS_KEY }}"
              echo "# Gallery DEV settings (compose flag true staged, deployment gated)"
              echo "GALLERY_DEV_WEB_S3_ACCESS_KEY_ID=${{ secrets.CLOUDRU_S3_ACCESS_KEY_ID }}"
              echo "GALLERY_DEV_WEB_S3_SECRET_ACCESS_KEY=${{ secrets.CLOUDRU_S3_SECRET_ACCESS_KEY }}"
              # Beget uses the existing production signing secret value.
              echo "GALLERY_CDN_SECRET=${{ secrets.GALLERY_CDN_SECRET }}"
              echo "GALLERY_DEV_INTERNAL_HMAC_SECRET=${{ secrets.GALLERY_INTERNAL_HMAC_SECRET }}"
              echo "GALLERY_S3_ACCESS_KEY_ID=${{ secrets.CLOUDRU_S3_ACCESS_KEY_ID }}"
              echo "GALLERY_S3_SECRET_ACCESS_KEY=${{ secrets.CLOUDRU_S3_SECRET_ACCESS_KEY }}"
              echo "GALLERY_BUCKET=gafus-gallery-private"
              echo "GALLERY_S3_ENDPOINT=https://s3.cloud.ru"
              echo "GALLERY_CDN_PROVIDER=beget"
              echo "GALLERY_CDN_BASE_URL=https://mepsuduyokabib.begetcdn.cloud"
              echo "GALLERY_CDN_EDGE_TOKEN_VERIFIED=true"
              echo "GALLERY_PROCESSOR_READY=true"
              echo "GALLERY_MEDIA_FALLBACK_ENABLED=true"
              # Old Yandex resource IDs are not active delivery or purge targets.
              # Any historical erasure is separately gated by legacy verification.
              echo "FEED_BUCKET=gafus-feed-private"
              echo "FEED_S3_ENDPOINT=https://s3.cloud.ru"
              echo "FEED_CDN_PROVIDER=beget"
              echo "FEED_CDN_BASE_URL=https://garaquachegasourn.begetcdn.cloud"
              echo "FEED_CDN_EDGE_TOKEN_VERIFIED=true"
              echo "FEED_MEDIA_FALLBACK_ENABLED=true"
              echo "CDN_HEALTH_MONITOR_ENABLED=true"

              echo "CLOUDRU_S3_ENDPOINT=https://s3.cloud.ru"
              echo "CLOUDRU_S3_ACCESS_KEY_ID=${{ secrets.CLOUDRU_S3_ACCESS_KEY_ID }}"
              echo "CLOUDRU_S3_SECRET_ACCESS_KEY=${{ secrets.CLOUDRU_S3_SECRET_ACCESS_KEY }}"
              echo "CLOUDRU_USER_MEDIA_ENABLED=true"
              echo "CLOUDRU_DOCUMENTS_BUCKET=gafus-documents-private"
              echo "CLOUDRU_QUESTIONS_BUCKET=gafus-documents-private"
              echo "CLOUDRU_DOCUMENTS_BUCKET_VERSIONING=disabled"
              echo "CLOUDRU_QUESTIONS_BUCKET_VERSIONING=disabled"
              echo "CLOUDRU_MEDIA_JOBS_ENABLED=true"
              echo "CLOUDRU_PROJECT_ID=${{ secrets.CLOUDRU_PROJECT_ID }}"
              echo "CLOUDRU_KEY_ID=${{ secrets.CLOUDRU_KEY_ID }}"
              echo "CLOUDRU_KEY_SECRET=${{ secrets.CLOUDRU_KEY_SECRET }}"
              echo "CDN_CLEANUP_SERVICE_ACCOUNT_KEY=${{ secrets.FEED_YC_SERVICE_ACCOUNT_KEY }}"
              # API credential scoped to Worker only; live per-path purge must
              # be tested before enabling any of these fail-closed flags.
              echo "BEGET_CDN_API_TOKEN=${{ secrets.BEGET_CDN_API_TOKEN }}"
              echo "GALLERY_BEGET_CDN_SERVICE_ID=${{ vars.GALLERY_BEGET_CDN_SERVICE_ID }}"
              echo "FEED_BEGET_CDN_SERVICE_ID=${{ vars.FEED_BEGET_CDN_SERVICE_ID }}"
              echo "BEGET_CDN_PURGE_API_VERIFIED=${{ vars.BEGET_CDN_PURGE_API_VERIFIED || 'false' }}"
              echo "BEGET_CDN_CACHE_KEY_VERIFIED=${{ vars.BEGET_CDN_CACHE_KEY_VERIFIED || 'false' }}"
              echo "BEGET_CDN_PURGE_PROPAGATION_VERIFIED=${{ vars.BEGET_CDN_PURGE_PROPAGATION_VERIFIED || 'false' }}"
              echo "MEDIA_CDN_PURGE_WORKER_ENABLED=true"
          DEPLOY_SCRIPT_2: |2+
              echo "# Feed production settings; activation is an explicit environment variable"
              echo "FEED_S3_ACCESS_KEY_ID=${{ secrets.CLOUDRU_S3_ACCESS_KEY_ID }}"
              echo "FEED_S3_SECRET_ACCESS_KEY=${{ secrets.CLOUDRU_S3_SECRET_ACCESS_KEY }}"
              echo "FEED_CDN_SECRET=${{ secrets.FEED_CDN_SECRET }}"
              echo "FEED_INTERNAL_HMAC_SECRET=${{ secrets.FEED_INTERNAL_HMAC_SECRET }}"
              echo "FEED_ENABLED=true"
              echo "FEED_PROCESSOR_READY=true"
              echo "FEED_SMART_ENABLED=${{ vars.FEED_SMART_ENABLED || 'true' }}"
              echo "FEED_SMART_STATS_ENABLED=${{ vars.FEED_SMART_STATS_ENABLED || 'true' }}"
              echo "FEED_SMART_DIAGNOSTICS=${{ vars.FEED_SMART_DIAGNOSTICS || 'true' }}"
              echo "FEED_SMART_MULTI_SOURCE_ENABLED=${{ vars.FEED_SMART_MULTI_SOURCE_ENABLED || 'true' }}"
              echo "FEED_SMART_AFFINITY_ENABLED=${{ vars.FEED_SMART_AFFINITY_ENABLED || 'true' }}"
              echo "FEED_SMART_EVENTS_ENABLED=${{ vars.FEED_SMART_EVENTS_ENABLED || 'true' }}"
              echo "FEED_SMART_EXPOSURE_TOKENS_REQUIRED=${{ vars.FEED_SMART_EXPOSURE_TOKENS_REQUIRED || 'true' }}"
              echo "FEED_SMART_MONITOR_ENABLED=${{ vars.FEED_SMART_MONITOR_ENABLED || 'true' }}"
              echo "FEED_SMART_ML_TRAIN_ENABLED=${{ vars.FEED_SMART_ML_TRAIN_ENABLED || 'true' }}"
              echo "FEED_SMART_ML_ENABLED=${{ vars.FEED_SMART_ML_ENABLED || 'true' }}"
              echo "FEED_SMART_AB_ENABLED=${{ vars.FEED_SMART_AB_ENABLED || 'true' }}"
              echo "FEED_SMART_AB_PERCENT=${{ vars.FEED_SMART_AB_PERCENT || '100' }}"
              echo "FEED_SMART_AB_TREATMENT_PERCENT=${{ vars.FEED_SMART_AB_TREATMENT_PERCENT || '100' }}"
              echo "FEED_SMART_SHADOW_ENABLED=${{ vars.FEED_SMART_SHADOW_ENABLED || 'true' }}"
              echo "FEED_SMART_SHADOW_PERCENT=${{ vars.FEED_SMART_SHADOW_PERCENT || '1' }}"
              echo "FEED_MAINTENANCE_ENABLED=${{ vars.FEED_MAINTENANCE_ENABLED || 'false' }}"
              echo "FEED_PUSH_ENABLED=${{ vars.FEED_PUSH_ENABLED || 'false' }}"
              echo ""
              echo "# Voximplant (server-only consultation credentials from GitHub Environment Secrets)"
              echo "VOXIMPLANT_ACCOUNT_ID=${{ secrets.VOXIMPLANT_ACCOUNT_ID }}"
              echo "VOXIMPLANT_APPLICATION_ID=${{ secrets.VOXIMPLANT_APPLICATION_ID }}"
              echo "VOXIMPLANT_ACCOUNT_NAME=${{ secrets.VOXIMPLANT_ACCOUNT_NAME }}"
              echo "VOXIMPLANT_APPLICATION_NAME=${{ secrets.VOXIMPLANT_APPLICATION_NAME }}"
              echo "VOXIMPLANT_KEY_ID=${{ secrets.VOXIMPLANT_KEY_ID }}"
              echo "VOXIMPLANT_PRIVATE_KEY_BASE64=${{ secrets.VOXIMPLANT_PRIVATE_KEY_BASE64 }}"
              echo "VOXIMPLANT_CREDENTIAL_SECRET=${{ secrets.VOXIMPLANT_CREDENTIAL_SECRET }}"
              echo "VOXIMPLANT_ADMISSION_SECRET=${{ secrets.VOXIMPLANT_ADMISSION_SECRET }}"
              echo ""
              echo "# Защита видео (HLS)"
              echo "VIDEO_ACCESS_SECRET=${{ secrets.VIDEO_ACCESS_SECRET }}"
              echo "NEXT_PUBLIC_ENABLE_HLS_PROTECTION=${{ secrets.NEXT_PUBLIC_ENABLE_HLS_PROTECTION || 'true' }}"
              echo ""
              echo "# Логирование"
              echo "DISABLE_CONSOLE_LOGGING=true"
              echo ""
              echo "# Next.js публичные переменные"
              echo "NEXT_PUBLIC_SITE_URL=https://gafus.ru"
              echo "NEXT_PUBLIC_TRAINER_PANEL_URL=https://trainer.gafus.ru"
              echo "NEXT_PUBLIC_APP_URL=https://trainer.gafus.ru"
              echo "NEXT_PUBLIC_YM_COUNTER_ID=${{ secrets.NEXT_PUBLIC_YM_COUNTER_ID }}"
              echo ""
              echo "# Инвалидация кэша web при изменении курсов (trainer-panel → web)"
              echo "REVALIDATE_SECRET_TOKEN=${{ secrets.REVALIDATE_SECRET_TOKEN }}"
              echo ""
              echo "# Анализ бандла (только для разработки)"
              echo "ANALYZE=false"
              echo ""
              echo "# CSRF защита"
              echo "CSRF_STRICT=false"
              echo ""
              echo "# Yandex Cloud Monitoring"
              echo "YC_MONITORING_WORKSPACE_ID=${{ secrets.YC_MONITORING_WORKSPACE_ID }}"
              echo "YC_MONITORING_API_KEY=${{ secrets.YC_MONITORING_API_KEY }}"
              echo ""
              echo "# OpenRouter AI API"
              echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}"
              echo ""
              echo "# ЮKassa (платные курсы)"
              echo "YOOKASSA_SHOP_ID=${{ secrets.YOOKASSA_SHOP_ID }}"
              echo "YOOKASSA_SECRET_KEY=${{ secrets.YOOKASSA_SECRET_KEY }}"
              echo "# NPD secrets are consumed only by worker; keep processing disabled until live verification"
              echo "NPD_TOKEN_ENCRYPTION_KEY=${{ secrets.NPD_TOKEN_ENCRYPTION_KEY }}"
              echo "NPD_PROCESSING_ENABLED=${{ vars.NPD_PROCESSING_ENABLED || 'false' }}"
              echo "NPD_API_BASE_URL=${{ vars.NPD_API_BASE_URL || 'https://lknpd.nalog.ru/api/v1' }}"
              echo "NPD_BATCH_SIZE=${{ vars.NPD_BATCH_SIZE || '20' }}"
              echo "NPD_REQUEST_TIMEOUT_MS=${{ vars.NPD_REQUEST_TIMEOUT_MS || '10000' }}"
              echo "NPD_RECEIPT_EMAIL_BATCH_SIZE=${{ vars.NPD_RECEIPT_EMAIL_BATCH_SIZE || '20' }}"
              echo "NPD_RECEIPT_EMAIL_ENABLED=${{ vars.NPD_RECEIPT_EMAIL_ENABLED || 'true' }}"
              echo ""
              echo "# Apple IAP (верификация покупки курса на iOS; vars → Repository / Environment)"
              echo "APPLE_BUNDLE_ID=${{ vars.APPLE_BUNDLE_ID }}"
              echo "APPLE_APP_ID=${{ vars.APPLE_APP_ID }}"
              echo "APPLE_USE_SANDBOX=${{ vars.APPLE_USE_SANDBOX || 'false' }}"
              echo "APPLE_ISSUER_ID=${{ secrets.APPLE_ISSUER_ID }}"
              echo "APPLE_KEY_ID=${{ secrets.APPLE_KEY_ID }}"
              echo "APPLE_PRIVATE_KEY_HOST_PATH=${{ secrets.APPLE_PRIVATE_KEY_HOST_PATH }}"
              echo "APPLE_PRIVATE_KEY_PATH=${{ secrets.APPLE_PRIVATE_KEY_PATH }}"
              echo ""
              echo "# Реквизиты для ЮKassa (контакты на сайте)"
              echo "NEXT_PUBLIC_CONTACT_EMAIL=${{ secrets.NEXT_PUBLIC_CONTACT_EMAIL }}"
              echo "NEXT_PUBLIC_CONTACT_PHONE=${{ secrets.NEXT_PUBLIC_CONTACT_PHONE }}"
              echo "NEXT_PUBLIC_CONTACT_FIO=${{ secrets.NEXT_PUBLIC_CONTACT_FIO }}"
              echo "NEXT_PUBLIC_CONTACT_INN=${{ secrets.NEXT_PUBLIC_CONTACT_INN }}"
              echo ""
              echo "# VK ID авторизация"
              echo "VK_CLIENT_ID=${{ secrets.VK_CLIENT_ID }}"
              echo "VK_CLIENT_ID_IOS=${{ secrets.VK_CLIENT_ID_IOS }}"
              echo "VK_CLIENT_ID_ANDROID=${{ secrets.VK_CLIENT_ID_ANDROID }}"
              echo "VK_WEB_REDIRECT_URI=${{ vars.VK_WEB_REDIRECT_URI || 'https://gafus.ru/api/auth/callback/vk-id' }}"
              echo "VK_MOBILE_REDIRECT_URI=${{ vars.VK_MOBILE_REDIRECT_URI || 'gafus://auth/vk' }}"
              echo ""
              echo "# Transactional email"
              echo "MAIL_PROVIDER=${{ vars.MAIL_PROVIDER || 'resend' }}"
              echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}"
              echo "RESEND_WEBHOOK_SECRET=${{ secrets.RESEND_WEBHOOK_SECRET }}"
              # Course content cache is enabled on all three readers/writers at first deploy.
              # Transactional PostgreSQL revision migration is applied before containers start.
              echo "COURSE_CACHE_SYNC_ENABLED=true"
              echo "ENABLE_COURSE_CACHE=true"
              echo "MAIL_OUTBOX_ENABLED=${{ vars.MAIL_OUTBOX_ENABLED || 'false' }}"
              echo "MAIL_OUTBOX_ENCRYPTION_KEY=${{ secrets.MAIL_OUTBOX_ENCRYPTION_KEY }}"
              echo "MAIL_REPLY_TO=${{ vars.MAIL_REPLY_TO || 'api@gafus.ru' }}"
              echo "RESEND_FROM=${{ vars.RESEND_FROM || 'notifications@notify.gafus.ru' }}"
              echo "# SMTP / Yandex 360"
              echo "SMTP_HOST=${{ vars.SMTP_HOST || 'smtp.yandex.ru' }}"
              echo "SMTP_PORT=${{ vars.SMTP_PORT || '465' }}"
              echo "SMTP_SECURE=${{ vars.SMTP_SECURE || 'true' }}"
              echo "SMTP_USER=${{ secrets.SMTP_USER }}"
              echo "SMTP_PASS=${{ secrets.SMTP_PASS }}"
              echo "MAIL_FROM=${{ vars.MAIL_FROM || 'api@gafus.ru' }}"
              echo "MAIL_FROM_NAME=${{ vars.MAIL_FROM_NAME || 'Гафус' }}"
              echo "STREAM_API_KEY=${{ secrets.STREAM_API_KEY }}"
              echo "STREAM_API_SECRET=${{ secrets.STREAM_API_SECRET }}"
              echo "CYNOLOGIST_CHAT_ENABLED=${{ vars.CYNOLOGIST_CHAT_ENABLED || 'false' }}"
              echo "COMMUNITY_CHAT_ENABLED=${{ vars.COMMUNITY_CHAT_ENABLED || 'false' }}"
            } > ci-cd/docker/.env
          DEPLOY_SCRIPT_3: |2+

            # Set secure permissions for .env file
            chmod 600 ci-cd/docker/.env
            echo "✅ .env file created with secure permissions"

            # Uploads directories are handled by CDN - no local directories needed

            # Download every image before touching running containers. A registry or network
            # outage must fail the deployment without taking production offline.
            echo "📥 Pulling seven immutable Docker images for release ${{ inputs.release_sha }}..."
            images=(
              "gafus-web"
              "gafus-trainer-panel"
              "gafus-admin-panel"
              "gafus-api"
              "gafus-worker"
              "gafus-bull-board"
              "gafus-prisma"
            )

            # Clear left-over tags from earlier attempts before downloading
            # the next release; images used by running containers stay intact.
            cleanup_obsolete_gafus_images

            : > "$RELEASE_BACKUP_DIR/images.tsv"
            for image in "${images[@]}"; do
              reference="ghcr.io/asmtv1/$image:latest"
              previous_id="$(docker image inspect "$reference" --format '{{.Id}}' 2>/dev/null || true)"
              if [ -z "$previous_id" ]; then
                echo "Cannot guarantee automatic image rollback: $image is missing."
                exit 1
              fi
              rollback="ghcr.io/asmtv1/$image:rollback-${{ github.run_id }}-${{ github.run_attempt }}"
              docker tag "$previous_id" "$rollback"
              echo "$reference $rollback" >> "$RELEASE_BACKUP_DIR/images.tsv"
            done

            pull_image() {
              local image="$1"
              local reference="ghcr.io/asmtv1/$image:sha-${{ inputs.release_sha }}"
              for attempt in 1 2 3; do
                echo "📥 Pulling $image (attempt $attempt/3)..."
                if timeout 15m docker pull "$reference"; then
                  echo "✅ Successfully pulled $image"
                  return 0
                fi
                echo "⚠️ Pull of $image failed or timed out; retrying in 20 seconds..."
                sleep 20
              done
              return 1
            }

            pull_failed=0
            for image in "${images[@]}"; do
              if ! pull_image "$image"; then
                echo "❌ Failed to pull $image"
                pull_failed=1
              fi
            done

            if [ "$pull_failed" -ne 0 ]; then
              echo "❌ One or more docker pulls failed"
              echo "🔍 Checking registry authentication..."
              docker login ghcr.io -u asmtv1 --password-stdin <<< "${{ secrets.GHCR_TOKEN }}" || echo "⚠️ Login check failed"
              exit 1
            fi

            # Compose uses :latest locally. Pin EVERY release to the same SHA:
            # only after all immutable images are fetched, retag them for Compose.
            for image in "${images[@]}"; do
              docker tag "ghcr.io/asmtv1/$image:sha-${{ inputs.release_sha }}" "ghcr.io/asmtv1/$image:latest"
            done

            # Remove only stopped, unused resources after all required images are present.
            docker container prune -f || true
            docker image prune -f || true

            # Infrastructure deployment - best practice: start services in dependency order
            echo "🚀 Starting infrastructure services..."

            # 1. Start core infrastructure (database, redis)
            docker-compose -f "$COMPOSE_PROD" up -d postgres redis
            echo "⏳ Waiting for core services to be ready..."
            sleep 15

            # Coordinated schema cutover. HTTPS returns 503 before we stop app
            # writers. Snapshot is taken with writers stopped; Prisma runs
            # with NO old web/api/trainer/worker process remaining.
            # Failure AFTER any Prisma invocation leaves maintenance enabled:
            # automatically restoring old images against a new schema is unsafe.
            APP_MUTATED=true
            bash "$CUTOVER_SCRIPT" prepare
            bash "$CUTOVER_SCRIPT" migrate
            bash "$CUTOVER_SCRIPT" start

            # Recreate reverse proxy only after new backend containers are
            # healthy; its bound maintenance lock continues to serve HTTP 503.
            docker-compose -f "$COMPOSE_PROD" up -d --no-deps --force-recreate nginx

            # Monitoring has no consultation schema dependency.
            docker-compose -f "$COMPOSE_PROD" up -d --no-deps --force-recreate \
              grafana-alloy yandex-metrics-sync node-exporter postgres-exporter redis-exporter blackbox-exporter

            # Keep the HTTPS configuration and the maintenance gate active.
            # Do not temporarily replace HTTPS with an HTTP-only config while
            # migrating user data. Standard webroot renewal is non-disruptive.
            docker-compose -f "$COMPOSE_PROD" run --rm --no-deps certbot renew \
              --webroot --webroot-path=/var/www/certbot --non-interactive ||
              echo "Certificate renewal deferred; existing HTTPS remains active."
            docker exec gafus-nginx nginx -t
            docker exec gafus-nginx nginx -s reload

            # Environment Validation - best practice: verify critical environment variables
            echo "🔍 Validating environment variables..."

            # Check bull-board environment variables
            if docker exec gafus-bull-board env | grep -q "REDIS_URL=redis://redis:6379"; then
                echo "✅ REDIS_URL is correctly set in bull-board"
            else
                echo "❌ REDIS_URL is missing or incorrect in bull-board"
                docker exec gafus-bull-board env | grep REDIS_URL || echo "REDIS_URL not found"
                exit 1
            fi

            # Verify bull-board can start without critical errors
            if docker logs gafus-bull-board 2>&1 | grep -q "Error: REDIS_URL is not set"; then
                echo "⚠️ Bull-board has REDIS_URL issues, but continuing..."
                # Don't exit - let the service try to start
            fi

            # Database seeds are run manually when needed
            # docker-compose -f ci-cd/docker/docker-compose.prod.yml exec -T prisma pnpm run db:seed || echo "Seeds failed or not available, continuing..."

            # Verify all replacement containers while traffic remains gated.
            bash "$CUTOVER_SCRIPT" verify
            # The gate opens only now: no old process can observe the
            # incompatible Prisma schema after the swap.
            bash "$CUTOVER_SCRIPT" open

            # A responding homepage/ping alone does not prove auth or worker readiness.
            echo "🏥 Checking production readiness..."
            for endpoint in https://gafus.ru/api/ping https://gafus.ru/api/csrf-token https://gafus.ru/api/auth/session https://api.gafus.ru/ready; do
              ready=false
              for attempt in $(seq 1 20); do
                if curl --fail --silent --show-error --max-time 10 "$endpoint" > /dev/null; then
                  ready=true
                  break
                fi
                sleep 5
              done
              if [ "$ready" != true ]; then
                echo "❌ Production endpoint failed: $endpoint"
                exit 1
              fi
            done
            worker_ready=false
            for attempt in $(seq 1 20); do
              if [ "$(docker inspect --format '{{.State.Health.Status}}' gafus-worker)" = healthy ] &&
                 [ "$(docker inspect --format '{{.RestartCount}}' gafus-worker)" = 0 ]; then
                worker_ready=true
                break
              fi
              sleep 5
            done
            if [ "$worker_ready" != true ]; then
              echo "❌ Worker is unhealthy or restarting"
              exit 1
            fi
            echo "🎉 Deployment completed and readiness checks passed!"

            # The new runtime is healthy. Old application rollback images
            # are no longer safe after the committed Prisma schema migration.
            # Keep only :latest and images actually used by containers.
            cleanup_obsolete_gafus_images
            echo "Obsolete release images removed; schema-aware rollback guard active."
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.GAFUS_SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 60m
          # Keep each interpolated scalar below GitHub's 21,000-character expression limit.
          script: ${{ format('{0}{1}{2}', env.DEPLOY_SCRIPT_1, env.DEPLOY_SCRIPT_2, env.DEPLOY_SCRIPT_3) }}
