name: Deploy Only
on:
  workflow_dispatch:
jobs:
  feed-smoke-setup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Create isolated Feed production acceptance fixtures
        uses: appleboy/ssh-action@v1.0.3
        env:
          FEED_SMOKE_PASSWORD: ${{ secrets.FEED_SMOKE_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_feed_smoke_1791563355740 }}
          key: ${{ secrets.GAFUS_SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: FEED_SMOKE_PASSWORD
          command_timeout: 5m
          script: |
            set -eu
            docker exec -e FEED_SMOKE_PASSWORD -i gafus-api node --input-type=module <<'NODE'
            import {prisma} from '@gafus/prisma';
            import {createRequire} from 'node:module';
            const bcrypt=createRequire(import.meta.resolve('@gafus/core'))('bcryptjs');
            try {
              if (!process.env.FEED_SMOKE_PASSWORD || process.env.FEED_SMOKE_PASSWORD.length < 32) throw Error('SMOKE_PASSWORD_MISSING');
              for (const username of ['feed_smoke_1791563355740','feed_smoke_1791563355740_reader']) {
                const found=await prisma.user.findUnique({where:{username},select:{id:true}});
                if (found) { console.log('FEED_SMOKE_FIXTURE=EXISTS'); continue; }
                await prisma.user.create({data:{username,password:await bcrypt.hash(process.env.FEED_SMOKE_PASSWORD,12),profile:{create:{fullName:'Feed acceptance fixture'}}}});
                console.log('FEED_SMOKE_FIXTURE=CREATED');
              }
            } catch { console.log('FEED_SMOKE_SETUP=FAILED'); process.exitCode=1; }
            finally {await prisma.$disconnect();}
            NODE
