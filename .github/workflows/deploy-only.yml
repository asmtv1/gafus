name: Deploy Only

# Redeploy a verified seven-image main release without building or touching Cloud.ru Jobs.
# A rollback never rolls back PostgreSQL: operator must first assess schema compatibility.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: '40-character commit SHA from a verified main CI run; blank = current main HEAD'
        required: false
        type: string
      mode:
        description: 'Repeat deployment, or intentionally roll back to an older compatible release'
        required: true
        type: choice
        default: redeploy
        options: [redeploy, rollback]
      rollback_confirmation:
        description: 'Rollback only: type SCHEMA_COMPATIBLE after independently checking database compatibility'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: gafus-production-deploy
  cancel-in-progress: false

jobs:
  validate-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify existing images and release QA without rebuilding
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_SHA: ${{ inputs.release_sha }}
          MODE: ${{ inputs.mode }}
          ROLLBACK_CONFIRMATION: ${{ inputs.rollback_confirmation }}
        run: |
          set -euo pipefail
          sha="${REQUESTED_SHA:-$GITHUB_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'BAD_RELEASE_SHA'; exit 1; }
          git merge-base --is-ancestor "$sha" HEAD || { echo 'RELEASE_NOT_ON_MAIN'; exit 1; }
          if [[ "$MODE" == rollback ]]; then
            [[ "$sha" != "$GITHUB_SHA" ]] || { echo 'ROLLBACK_REQUIRES_OLDER_SHA'; exit 1; }
            [[ "$ROLLBACK_CONFIRMATION" == SCHEMA_COMPATIBLE ]] || {
              echo 'Rollback blocked: database schema compatibility not confirmed'; exit 1;
            }
          else
            [[ "$sha" == "$GITHUB_SHA" ]] || {
              echo 'Deploying an older SHA requires explicit rollback mode'; exit 1;
            }
          fi
          gh api --paginate "repos/$GH_REPO/actions/workflows/ci-cd.yml/runs?head_sha=$sha&event=push&per_page=100" \
            --jq '.workflow_runs[] | select(.head_sha == "'"$sha"'") | .id' > "$RUNNER_TEMP/release-runs"
          test -s "$RUNNER_TEMP/release-runs" || { echo 'NO_MAIN_CI_RUN'; exit 1; }
          verified=false
          while IFS= read -r run; do
            gh api --paginate "repos/$GH_REPO/actions/runs/$run/jobs?per_page=100" \
              --jq '.jobs[] | [.name,.conclusion] | @tsv' > "$RUNNER_TEMP/release-jobs"
            count="$(awk -F '\t' '$1 ~ /^build-images \(/ && $2 == "success" {n++} END {print n+0}' "$RUNNER_TEMP/release-jobs")"
            if [[ "$count" -eq 7 ]] &&
              grep -q $'security\tsuccess' "$RUNNER_TEMP/release-jobs" &&
              grep -q $'build-apps\tsuccess' "$RUNNER_TEMP/release-jobs" &&
              grep -q $'cloudru-media-contracts\tsuccess' "$RUNNER_TEMP/release-jobs"; then
              verified=true
              break
            fi
          done < "$RUNNER_TEMP/release-runs"
          [[ "$verified" == true ]] || { echo 'RELEASE_IMAGES_OR_QA_NOT_VERIFIED'; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Verified seven previously built images for $sha; no builds or Cloud.ru mutations"

  preflight-cdn:
    needs: validate-release
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      FEED_CDN_SECRET: ${{ secrets.FEED_CDN_SECRET }}
      GALLERY_CDN_REDIRECT_RELEASE_APPROVED: ${{ vars.GALLERY_CDN_REDIRECT_RELEASE_APPROVED || 'false' }}
      GALLERY_BEGET_CDN_REDIRECT_SERVICE_ID: ${{ vars.GALLERY_BEGET_CDN_REDIRECT_SERVICE_ID }}
      GALLERY_CDN_REDIRECT_SIGNING_SECRET: ${{ secrets.GALLERY_CDN_REDIRECT_SIGNING_SECRET }}
      GALLERY_CDN_REDIRECT_ORIGIN_SECRET: ${{ secrets.GALLERY_CDN_REDIRECT_ORIGIN_SECRET }}
      GALLERY_CDN_ORIGIN_ROUTE_ENABLED: ${{ vars.GALLERY_CDN_ORIGIN_ROUTE_ENABLED || 'false' }}
      GALLERY_CDN_REDIRECT_ENABLED: ${{ vars.GALLERY_CDN_VIEWER_CUTOVER_APPROVED == 'true' && vars.GALLERY_CDN_REDIRECT_ENABLED || 'false' }}
      GALLERY_CDN_CACHEABLE_FINAL_ENABLED: ${{ vars.GALLERY_CDN_VIEWER_CUTOVER_APPROVED == 'true' && vars.GALLERY_CDN_CACHEABLE_FINAL_ENABLED || 'false' }}
      GALLERY_CDN_BASE_URL: ${{ vars.GALLERY_CDN_VIEWER_CUTOVER_APPROVED == 'true' && 'https://fupiquafifeswu.begetcdn.cloud' || 'https://mepsuduyokabib.begetcdn.cloud' }}
      GALLERY_CDN_REDIRECT_S3_SMOKE_VERIFIED: ${{ vars.GALLERY_CDN_REDIRECT_S3_SMOKE_VERIFIED || 'false' }}
      GALLERY_CDN_BROWSER_CACHE_VERIFIED: ${{ vars.GALLERY_CDN_BROWSER_CACHE_VERIFIED || 'false' }}
      GALLERY_CDN_METADATA_MIGRATED: ${{ vars.GALLERY_CDN_METADATA_MIGRATED || 'false' }}
      GALLERY_CDN_EDGE_TOKEN_VERIFIED: ${{ vars.GALLERY_CDN_EDGE_TOKEN_VERIFIED || 'false' }}
      GALLERY_CDN_PURGE_DUAL_ENABLED: ${{ vars.GALLERY_CDN_PURGE_DUAL_ENABLED || 'false' }}
      BEGET_CDN_PURGE_API_VERIFIED: ${{ vars.BEGET_CDN_PURGE_API_VERIFIED || 'false' }}
      BEGET_CDN_CACHE_KEY_VERIFIED: ${{ vars.BEGET_CDN_CACHE_KEY_VERIFIED || 'false' }}
      BEGET_CDN_PURGE_PROPAGATION_VERIFIED: ${{ vars.BEGET_CDN_PURGE_PROPAGATION_VERIFIED || 'false' }}
      BEGET_CDN_API_TOKEN: ${{ secrets.BEGET_CDN_API_TOKEN }}
      BEGET_GALLERY_SMOKE_FINAL_KEY: ${{ vars.BEGET_GALLERY_SMOKE_FINAL_KEY }}
      BEGET_GALLERY_SMOKE_SHA256: ${{ vars.BEGET_GALLERY_SMOKE_SHA256 }}
      BEGET_FEED_SMOKE_FINAL_KEY: ${{ vars.BEGET_FEED_SMOKE_FINAL_KEY }}
      BEGET_FEED_SMOKE_SHA256: ${{ vars.BEGET_FEED_SMOKE_SHA256 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require protected Gallery cutover before changing production
        run: |
          test "$GALLERY_CDN_REDIRECT_RELEASE_APPROVED" = "true"
          node --input-type=module -e "import {checkGalleryRedirectConfig} from './infra/cloudru/gallery-redirect-release-gate.mjs'; if (!checkGalleryRedirectConfig(process.env).redirect) process.exit(1); console.log('GALLERY_REDIRECT_CONFIG_LOCAL_PASS');"

  deploy:
    needs: [validate-release, preflight-cdn]
    uses: ./.github/workflows/production-deploy-reusable.yml
    with:
      release_sha: ${{ needs.validate-release.outputs.release_sha }}
      app_only: true
    secrets: inherit
