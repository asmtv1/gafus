name: Deploy Only

# Reuses the SAME coordinated production cutover as the main CI/CD pipeline.
# Never rebuilds an image, never writes a reduced .env, never stops Postgres.
on:
  workflow_dispatch:


concurrency:
  group: gafus-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  validate-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate release provenance
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid main release SHA'; exit 1; }

          # All seven images must originate from ONE completed build-images
          # matrix, not a mixture of mutable latest tags or unfinished builds.
          GH_REPO="${GITHUB_REPOSITORY}"
          gh api --paginate "repos/$GH_REPO/actions/workflows/ci-cd.yml/runs?head_sha=$sha&event=push&per_page=50"             --jq '.workflow_runs[].id' > "$RUNNER_TEMP/release-runs"
          test -s "$RUNNER_TEMP/release-runs" || { echo 'No main CI run for this commit'; exit 1; }
          approved=false
          while IFS= read -r run; do
            gh api --paginate "repos/$GH_REPO/actions/runs/$run/jobs?per_page=100"               --jq '.jobs[] | [.name,.conclusion] | @tsv' > "$RUNNER_TEMP/release-jobs"
            if [ "$(awk -F '	' '$1 ~ /^build-images \(/ && $2 == "success" {n++} END {print n+0}' "$RUNNER_TEMP/release-jobs")" -eq 7 ] &&
               grep -q $'cloudru-prepare-media	success' "$RUNNER_TEMP/release-jobs" &&
               grep -q $'build-apps	success' "$RUNNER_TEMP/release-jobs" &&
               grep -q $'security	success' "$RUNNER_TEMP/release-jobs"; then
              approved=true
              break
            fi
          done < "$RUNNER_TEMP/release-runs"
          test "$approved" = true || { echo 'No fully built and verified release for SHA'; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  deploy:
    needs: validate-release
    uses: ./.github/workflows/production-deploy-reusable.yml
    with:
      release_sha: ${{ needs.validate-release.outputs.release_sha }}
    secrets: inherit
