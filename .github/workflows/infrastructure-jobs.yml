name: Infrastructure & Jobs

# Separate production changes from ordinary app deployment. Nothing here creates
# or deletes buckets/Jobs; new S3/CDN resources require reviewed IaC and credentials.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Plan, check, explicitly update existing Cloud.ru Jobs, or publish media images'
        type: choice
        required: true
        default: plan
        options: [plan, preflight, apply-existing-jobs, verify, publish-media-images, beget-readonly-diagnostic, cloudru-origin-diagnostic, create-feed-v2-smoke]
      confirmation:
        description: 'For apply: UPDATE_11_EXISTING_JOBS; for image publish: PUBLISH_MEDIA_IMAGES'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.operation == 'beget-readonly-diagnostic' && 'gafus-beget-readonly-diagnostic' || inputs.operation == 'cloudru-origin-diagnostic' && 'gafus-cloudru-readonly-origin' || inputs.operation == 'create-feed-v2-smoke' && 'gafus-feed-v2-synthetic-provision' || 'gafus-production-deploy' }}
  cancel-in-progress: false

jobs:
  create-feed-v2-smoke:
    if: github.ref == 'refs/heads/diagnostic/beget-cdn-readonly-20261101' && inputs.operation == 'create-feed-v2-smoke'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      CLOUDRU_S3_ENDPOINT: https://s3.cloud.ru
      CLOUDRU_S3_ACCESS_KEY_ID: ${{ secrets.CLOUDRU_S3_ACCESS_KEY_ID }}
      CLOUDRU_S3_SECRET_ACCESS_KEY: ${{ secrets.CLOUDRU_S3_SECRET_ACCESS_KEY }}
      BEGET_PERMANENT_SMOKE_CONFIRM: approved-feed-v2-permanent-production-webp
      APPROVAL: ${{ inputs.confirmation }}
    steps:
      - name: Require exact synthetic-only approval
        run: |
          test "$APPROVAL" = 'CREATE_FEED_V2_SYNTHETIC_ONLY' || {
            echo 'NO_SYNTHETIC_SEED_APPROVAL'
            exit 1
          }
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install checked-in lockfile dependencies
        run: pnpm install --frozen-lockfile
      - name: Create single immutable synthetic V2 WebP and print its expected digest
        run: node infra/cloudru/beget-provision-readonly-smoke.mjs --feed-v2

  beget-readonly-diagnostic:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/diagnostic/beget-cdn-readonly-20261101') && inputs.operation == 'beget-readonly-diagnostic'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      BEGET_CDN_API_TOKEN: ${{ secrets.BEGET_CDN_API_TOKEN }}
      GALLERY_BEGET_CDN_SERVICE_ID: ${{ vars.GALLERY_BEGET_CDN_SERVICE_ID }}
      BEGET_GALLERY_SMOKE_FINAL_KEY: ${{ vars.BEGET_GALLERY_SMOKE_FINAL_KEY }}
      BEGET_GALLERY_SMOKE_SHA256: ${{ vars.BEGET_GALLERY_SMOKE_SHA256 }}
      FEED_BEGET_CDN_SERVICE_ID: ${{ vars.FEED_BEGET_CDN_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Read service details without changes or credential disclosure
        run: node infra/cloudru/beget-cdn-readonly-diagnostic.mjs --list

  cloudru-origin-diagnostic:
    if: github.ref == 'refs/heads/diagnostic/beget-cdn-readonly-20261101' && inputs.operation == 'cloudru-origin-diagnostic'
    uses: ./.github/workflows/production-job-release-reusable.yml
    with:
      release_sha: ${{ github.sha }}
      mode: origin-check
    secrets: inherit

  plan:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'plan'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDRU_WORKER_PINS_REQUIRED: ${{ vars.CLOUDRU_WORKER_PINS_REQUIRED || 'false' }}
      CLOUDRU_GALLERY_WORKER_IMAGE: ${{ secrets.CLOUDRU_GALLERY_WORKER_IMAGE || vars.CLOUDRU_GALLERY_WORKER_IMAGE || '' }}
      CLOUDRU_FEED_WORKER_IMAGE: ${{ secrets.CLOUDRU_FEED_WORKER_IMAGE || vars.CLOUDRU_FEED_WORKER_IMAGE || '' }}
      CLOUDRU_QUESTIONS_WORKER_IMAGE: ${{ secrets.CLOUDRU_QUESTIONS_WORKER_IMAGE || vars.CLOUDRU_QUESTIONS_WORKER_IMAGE || '' }}
      CLOUDRU_CHAT_PHOTO_IMAGE: ${{ secrets.CLOUDRU_CHAT_PHOTO_IMAGE || vars.CLOUDRU_CHAT_PHOTO_IMAGE || '' }}
      CLOUDRU_CHAT_VIDEO_IMAGE: ${{ secrets.CLOUDRU_CHAT_VIDEO_IMAGE || vars.CLOUDRU_CHAT_VIDEO_IMAGE || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Print pinned image plan for existing 11 Jobs (no API writes)
        run: node infra/cloudru/production-job-release.mjs --plan
      - name: Show current declared S3/CDN configuration without changing resources
        shell: bash
        run: |
          set -euo pipefail
          echo 'S3/CDN changes are NOT automatic. Review the application manifests and IaC separately.'
          grep -nE 'S3_BUCKET|CDN_BASE_URL' ci-cd/docker/docker-compose.prod.yml | sed -E 's/$[{][{].*[}][}]/[expression]/g' || true
          echo 'No production resources or user objects have been modified.'

  guard:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'apply-existing-jobs'
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation of the exact existing-job operation
        env:
          APPROVAL: ${{ inputs.confirmation }}
        run: |
          test "$APPROVAL" = 'UPDATE_11_EXISTING_JOBS' || {
            echo 'Blocked: type UPDATE_11_EXISTING_JOBS, then review production environment approval'
            exit 1
          }

  preflight:
    needs: guard
    if: github.ref == 'refs/heads/main' && inputs.operation == 'apply-existing-jobs'
    uses: ./.github/workflows/production-job-release-reusable.yml
    with:
      release_sha: ${{ github.sha }}
      mode: preflight
    secrets: inherit

  apply-existing-jobs:
    needs: preflight
    if: github.ref == 'refs/heads/main' && inputs.operation == 'apply-existing-jobs'
    uses: ./.github/workflows/production-job-release-reusable.yml
    with:
      release_sha: ${{ github.sha }}
      mode: sync
    secrets: inherit

  verify-after-apply:
    needs: apply-existing-jobs
    if: github.ref == 'refs/heads/main' && inputs.operation == 'apply-existing-jobs'
    uses: ./.github/workflows/production-job-release-reusable.yml
    with:
      release_sha: ${{ github.sha }}
      mode: verify
    secrets: inherit

  read-only-preflight:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'preflight'
    uses: ./.github/workflows/production-job-release-reusable.yml
    with:
      release_sha: ${{ github.sha }}
      mode: preflight
    secrets: inherit

  read-only-verify:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'verify'
    uses: ./.github/workflows/production-job-release-reusable.yml
    with:
      release_sha: ${{ github.sha }}
      mode: verify
    secrets: inherit

  publish-guard:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'publish-media-images'
    runs-on: ubuntu-latest
    steps:
      - name: Require deliberate image publication confirmation
        env:
          APPROVAL: ${{ inputs.confirmation }}
        run: |
          test "$APPROVAL" = 'PUBLISH_MEDIA_IMAGES' || {
            echo 'Blocked: type PUBLISH_MEDIA_IMAGES to publish media images without updating Jobs'
            exit 1
          }

  publish-media-images:
    needs: publish-guard
    if: github.ref == 'refs/heads/main' && inputs.operation == 'publish-media-images'
    uses: ./.github/workflows/cloudru-media-images.yml
    with:
      publish: true
    secrets: inherit
