user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Не записываем query string: ссылки сброса содержат одноразовые токены.
    # Referer тоже может содержать такую ссылку при загрузке ресурсов страницы.
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "-" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Ограничиваем только явно вредные scanner-paths из scanner-block.inc.
    limit_req_zone $binary_remote_addr zone=suspicious_scan:10m rate=10r/m;
    limit_req_status 429;
    limit_req_log_level notice;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Базовые лимиты. Для загрузки видео из панели кинолога действует отдельный лимит 3 ГБ.
    client_max_body_size 600M;
    client_body_timeout 300s;
    client_header_timeout 60s;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Дисковый кэш для проксирования CDN и статики
    # Account-owned media is never retained in the public proxy cache.
    map $uri $account_media_no_cache {
        default 0;
        ~^/uploads/(users|questions|exams)/ 1;
    }
    map $account_media_no_cache $uploads_cache_control {
        default "public, max-age=31536000, immutable";
        1 "private, no-store, max-age=0";
    }
    proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn_cache:50m max_size=5g inactive=30d use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;

    include /etc/nginx/conf.d/*.conf;
}
