global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "gafus"
    environment: "production"

# Prometheus-compatible alert definitions (not evaluated by Alloy alone).
rule_files:
  - /etc/prometheus/gafus-alerts.yml

scrape_configs:
  - job_name: "node-exporter"
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          instance: "gafus-server"
          job: "node-exporter"

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          instance: "gafus-postgres"
          job: "postgres-exporter"

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          instance: "gafus-redis"
          job: "redis-exporter"

  # Health checks для сервисов через blackbox_exporter
  - job_name: "services-health"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://web:3000/healthz # Web App
          - http://trainer-panel:3001/healthz # Trainer Panel
          - http://admin-panel:3006/healthz # Admin Panel
          - http://api:3001/health # Hono liveness (readiness is /ready)
          - http://worker:3003/health # Worker liveness
          - http://bull-board:3002/health # Bull Board
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
      # Добавляем метку service на основе URL
      - source_labels: [instance]
        regex: "http://web:3000.*"
        target_label: service
        replacement: "web-app"
      - source_labels: [instance]
        regex: "http://trainer-panel:3001.*"
        target_label: service
        replacement: "trainer-panel"
      - source_labels: [instance]
        regex: "http://admin-panel:3006.*"
        target_label: service
        replacement: "admin-panel"
      - source_labels: [instance]
        regex: "http://api:3001.*"
        target_label: service
        replacement: "api"
      - source_labels: [instance]
        regex: "http://worker:3003.*"
        target_label: service
        replacement: "worker"
      - source_labels: [instance]
        regex: "http://bull-board:3002.*"
        target_label: service
        replacement: "bull-board"

  # Метрики очередей BullMQ из bull-board
  - job_name: "bullmq-queues"
    metrics_path: /metrics
    static_configs:
      - targets: ["bull-board:3002"]
        labels:
          instance: "production-bull-board"
          job: "bullmq-queues"

  - job_name: "worker-media"
    metrics_path: /metrics/media
    static_configs:
      - targets: ["worker:3003"]
        labels:
          instance: "gafus-worker-media"

  - job_name: "worker-mail"
    metrics_path: /metrics/mail
    static_configs:
      - targets: ["worker:3003"]
        labels:
          instance: "gafus-worker-mail"
