# Execute with verified upstream Prometheus 3.x promtool:
# promtool test rules ci-cd/docker/prometheus/gafus-alerts.promtool.test.yml
# Real PromQL rule evaluator and alert FOR timing, synthetic offline series.
# This does not assert any remote scrape, notification routing or production state.
rule_files:
  - gafus-alerts.yml
evaluation_interval: 1m
tests:
  - name: terminal_failed_media_job_observed_after_for
    interval: 1m
    input_series:
      - series: 'gafus_media_failed_tasks{pipeline="chat2"}'
        values: '0+0x15'
      - series: 'gafus_media_failed_tasks{pipeline="questions"}'
        values: '3+0x15'
      - series: 'gafus_media_failed_tasks{pipeline="feed"}'
        values: '0+0x15'
      - series: 'gafus_media_failed_tasks{pipeline="gallery"}'
        values: '0+0x15'
      - series: 'gafus_media_stalled_processing{pipeline="chat2"}'
        values: '0+0x15'
      - series: 'gafus_media_stalled_processing{pipeline="questions"}'
        values: '0+0x15'
      - series: 'gafus_media_stalled_processing{pipeline="feed"}'
        values: '0+0x15'
      - series: 'gafus_media_stalled_processing{pipeline="gallery"}'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 9m
        alertname: GafusMediaProcessingFailed
        exp_alerts: []
      - eval_time: 11m
        alertname: GafusMediaProcessingFailed
        exp_alerts:
          - exp_labels:
              pipeline: questions
              severity: warning
            exp_annotations:
              summary: 'GAFUS questions has media tasks in terminal FAILED state'
      - eval_time: 11m
        alertname: GafusMediaMetricsMissing
        exp_alerts: []

  - name: exactly_one_pipeline_gauge_missing_triggers_alarm
    interval: 1m
    input_series:
      - series: 'gafus_media_failed_tasks{pipeline="chat2"}'
        values: '0+0x15'
      - series: 'gafus_media_failed_tasks{pipeline="questions"}'
        values: '0+0x15'
      - series: 'gafus_media_failed_tasks{pipeline="feed"}'
        values: '0+0x15'
      - series: 'gafus_media_failed_tasks{pipeline="gallery"}'
        values: '0+0x15'
      - series: 'gafus_media_stalled_processing{pipeline="chat2"}'
        values: '0+0x15'
      - series: 'gafus_media_stalled_processing{pipeline="questions"}'
        values: '0+0x15'
      # No feed stalled series; presence of seven other series must not mask it
      - series: 'gafus_media_stalled_processing{pipeline="gallery"}'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 9m
        alertname: GafusMediaMetricsMissing
        exp_alerts: []
      - eval_time: 11m
        alertname: GafusMediaMetricsMissing
        exp_alerts:
          - exp_labels:
              pipeline: feed
              severity: warning
            exp_annotations:
              summary: 'GAFUS media worker is missing one or both mandatory task gauges'
      - eval_time: 11m
        alertname: GafusMediaProcessingFailed
        exp_alerts: []

  - name: stale_backup_alert_evaluates_actual_promql_time
    interval: 1m
    input_series:
      - series: 'gafus_database_backup_last_success_timestamp_seconds{instance="synthetic"}'
        values: '0+0x2400'
    alert_rule_test:
      - eval_time: 36h20m
        alertname: GafusBackupStale
        exp_alerts: []
      - eval_time: 39h
        alertname: GafusBackupStale
        exp_alerts:
          - exp_labels:
              instance: synthetic
              severity: critical
            exp_annotations:
              summary: 'Last remotely verified PostgreSQL backup is older than 36 hours'
      - eval_time: 39h
        alertname: GafusBackupMissing
        exp_alerts: []

  - name: backup_absent_alert_after_two_hours
    interval: 1m
    alert_rule_test:
      - eval_time: 1h59m
        alertname: GafusBackupMissing
        exp_alerts: []
      - eval_time: 2h1m
        alertname: GafusBackupMissing
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: 'No successfully verified backup timestamp has been exported'

  - name: chat2_outbox_pending_age_alarms_only_after_full_for
    interval: 1m
    input_series:
      - series: 'gafus_chat2_outbox_oldest_age_seconds{instance="synthetic"}'
        values: '0+0x3 360+0x16'
      - series: 'gafus_chat2_outbox_pending{instance="synthetic"}'
        values: '1+0x19'
      - series: 'gafus_chat2_outbox_dead_letters{instance="synthetic"}'
        values: '0+0x19'
    alert_rule_test:
      - eval_time: 7m
        alertname: GafusChat2OutboxOldestPending
        exp_alerts: []
      - eval_time: 10m
        alertname: GafusChat2OutboxOldestPending
        exp_alerts:
          - exp_labels:
              instance: synthetic
              severity: warning
            exp_annotations:
              summary: 'Oldest Chat2 outbox event is older than five minutes'

  - name: chat2_dead_letters_held_for_two_minutes
    interval: 1m
    input_series:
      - series: 'gafus_chat2_outbox_pending{instance="synthetic"}'
        values: '0+0x15'
      - series: 'gafus_chat2_outbox_dead_letters{instance="synthetic"}'
        values: '0+0x2 2+0x12'
    alert_rule_test:
      - eval_time: 4m
        alertname: GafusChat2OutboxDeadLetters
        exp_alerts: []
      - eval_time: 6m
        alertname: GafusChat2OutboxDeadLetters
        exp_alerts:
          - exp_labels:
              instance: synthetic
              severity: warning
            exp_annotations:
              summary: 'Chat2 outbox dead letters need an admin review'

  - name: outbox_missing_metric_is_alarm_after_ten_minutes
    interval: 1m
    input_series:
      - series: 'gafus_chat2_outbox_dead_letters{instance="synthetic"}'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 9m
        alertname: GafusChat2OutboxMetricsMissing
        exp_alerts: []
      - eval_time: 11m
        alertname: GafusChat2OutboxMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 'Chat2 outbox metrics are not exported by the worker'

  - name: questions_legacy_failed_cleanup_held_for_five_minutes
    interval: 1m
    input_series:
      - series: 'gafus_questions_legacy_delete_enabled{instance="synthetic"}'
        values: '1+0x14'
      - series: 'gafus_questions_legacy_delete_failed{instance="synthetic"}'
        values: '0+0x2 2+0x12'
    alert_rule_test:
      - eval_time: 4m
        alertname: GafusQuestionsLegacyDeletionDeadLetters
        exp_alerts: []
      - eval_time: 8m
        alertname: GafusQuestionsLegacyDeletionDeadLetters
        exp_alerts:
          - exp_labels:
              instance: synthetic
              severity: warning
            exp_annotations:
              summary: 'Questions legacy photo cleanup has terminal deletion failures'
