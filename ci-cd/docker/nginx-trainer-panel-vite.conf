# GAFUS Refactor trainer-panel: static SPA + original Hono API, never the legacy Next server.
# This container is independent of the production edge nginx.
server {
    listen 3001;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 100m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 'ok';
    }

    # Docker's internal DNS is resolved only at request time, so the image
    # can be smoke-tested without connecting to production API/DB.
    location ^~ /api/v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $hono_backend gafus-api:3001;
        proxy_pass http://$hono_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # Unknown API paths must never receive an HTML SPA success response.
    location ^~ /api/ { return 404; }
    location = /api { return 404; }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # React's History API needs a fallback on direct visits and refreshes.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
