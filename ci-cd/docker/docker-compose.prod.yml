services:
  # Database
  postgres:
    image: postgres:15-alpine
    container_name: gafus-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-gafus}
      - POSTGRES_USER=${POSTGRES_USER:-gafus}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Убрали открытые порты - доступ только внутри Docker сети
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gafus -d gafus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis
  redis:
    image: redis:7-alpine
    container_name: gafus-redis
    # Убрали открытые порты - доступ только внутри Docker сети
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Web Application
  web:
    image: ghcr.io/asmtv1/gafus-web:latest
    container_name: gafus-web
    # DNS over TCP: production UDP DNS queries time out.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    dns_opt:
      - use-vc
    environment:
      # Voximplant server-only video consultation credentials (GitHub Actions Secrets).
      - VOXIMPLANT_ACCOUNT_ID=${VOXIMPLANT_ACCOUNT_ID:?VOXIMPLANT_ACCOUNT_ID is required}
      - VOXIMPLANT_APPLICATION_ID=${VOXIMPLANT_APPLICATION_ID:?VOXIMPLANT_APPLICATION_ID is required}
      - VOXIMPLANT_ACCOUNT_NAME=${VOXIMPLANT_ACCOUNT_NAME:?VOXIMPLANT_ACCOUNT_NAME is required}
      - VOXIMPLANT_APPLICATION_NAME=${VOXIMPLANT_APPLICATION_NAME:?VOXIMPLANT_APPLICATION_NAME is required}
      - VOXIMPLANT_KEY_ID=${VOXIMPLANT_KEY_ID:?VOXIMPLANT_KEY_ID is required}
      - VOXIMPLANT_PRIVATE_KEY_BASE64=${VOXIMPLANT_PRIVATE_KEY_BASE64:?VOXIMPLANT_PRIVATE_KEY_BASE64 is required}
      - VOXIMPLANT_CREDENTIAL_SECRET=${VOXIMPLANT_CREDENTIAL_SECRET:?VOXIMPLANT_CREDENTIAL_SECRET is required}
      - VOXIMPLANT_ADMISSION_SECRET=${VOXIMPLANT_ADMISSION_SECRET:?VOXIMPLANT_ADMISSION_SECRET is required}
      - CLOUDRU_USER_MEDIA_ENABLED=${CLOUDRU_USER_MEDIA_ENABLED:-false}
      - CLOUDRU_S3_ENDPOINT=${CLOUDRU_S3_ENDPOINT:-https://s3.cloud.ru}
      - CLOUDRU_S3_ACCESS_KEY_ID=${CLOUDRU_S3_ACCESS_KEY_ID:-}
      - CLOUDRU_S3_SECRET_ACCESS_KEY=${CLOUDRU_S3_SECRET_ACCESS_KEY:-}
      - CLOUDRU_DOCUMENTS_BUCKET=${CLOUDRU_DOCUMENTS_BUCKET:-}
      - CLOUDRU_QUESTIONS_BUCKET=${CLOUDRU_QUESTIONS_BUCKET:-}
      - CLOUDRU_DOCUMENTS_BUCKET_VERSIONING=${CLOUDRU_DOCUMENTS_BUCKET_VERSIONING:-}
      - CLOUDRU_QUESTIONS_BUCKET_VERSIONING=${CLOUDRU_QUESTIONS_BUCKET_VERSIONING:-}
      - CYNOLOGIST_CHAT_ENABLED=${CYNOLOGIST_CHAT_ENABLED:-false}
      - COMMUNITY_CHAT_ENABLED=${COMMUNITY_CHAT_ENABLED:-false}
      - CYNOLOGIST_CHAT_TRAINER_USER_ID=${CYNOLOGIST_CHAT_TRAINER_USER_ID:-cmhq7qk2s0000nn01jr2ptnil}
      - STREAM_API_KEY=${STREAM_API_KEY:-}
      - STREAM_API_SECRET=${STREAM_API_SECRET:-}
      - NODE_ENV=production
      - PORT=3000
      - DISABLE_CONSOLE_LOGGING=${DISABLE_CONSOLE_LOGGING:-false}
      - ANALYZE=${ANALYZE:-false}
      - CSRF_STRICT=${CSRF_STRICT:-false}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN}
      - AUTH_TRUST_HOST=true
      - APPLE_TEAM_ID=${APPLE_TEAM_ID}
      - APPLE_BUNDLE_ID=${APPLE_BUNDLE_ID:-}
      - APPLE_APP_ID=${APPLE_APP_ID:-}
      - APPLE_USE_SANDBOX=${APPLE_USE_SANDBOX:-false}
      - APPLE_ISSUER_ID=${APPLE_ISSUER_ID:-}
      - APPLE_KEY_ID=${APPLE_KEY_ID:-}
      - APPLE_PRIVATE_KEY_PATH=${APPLE_PRIVATE_KEY_PATH:-/run/secrets/apple_app_store_connect_api_key.p8}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - NEXT_PUBLIC_TRAINER_PANEL_URL=${NEXT_PUBLIC_TRAINER_PANEL_URL}
      - NEXT_PUBLIC_TRACER_APP_TOKEN=${NEXT_PUBLIC_TRACER_APP_TOKEN}
      - NEXT_PUBLIC_YM_COUNTER_ID=${NEXT_PUBLIC_YM_COUNTER_ID:-}
      - TRACER_APP_TOKEN=${TRACER_APP_TOKEN:-${NEXT_PUBLIC_TRACER_APP_TOKEN}}
      - TRACER_SERVER_ENABLED=${TRACER_SERVER_ENABLED:-}
      - NEXT_PUBLIC_APP_VERSION=${NEXT_PUBLIC_APP_VERSION:-1.7.0}
      - NEXT_PUBLIC_ENABLE_TRACER=${NEXT_PUBLIC_ENABLE_TRACER:-true}
      - REVALIDATE_SECRET_TOKEN=${REVALIDATE_SECRET_TOKEN}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@gafus.ru}
      # Yandex Cloud CDN credentials
      - YC_ACCESS_KEY_ID=${YC_ACCESS_KEY_ID}
      - YC_SECRET_ACCESS_KEY=${YC_SECRET_ACCESS_KEY}
      # Gallery DEV enabled by user request; deploy only after DB migration/cloud readiness.
      - GALLERY_ENABLED=true
      - GALLERY_BUCKET_PUBLIC=false
      - GALLERY_BUCKET=${GALLERY_BUCKET:-gafus-gallery-dev-photos-b1gjbsvfnd1fl68k43g6}
      - GALLERY_S3_ENDPOINT=${GALLERY_S3_ENDPOINT:-https://storage.yandexcloud.net}
      - GALLERY_S3_ACCESS_KEY_ID=${GALLERY_DEV_WEB_S3_ACCESS_KEY_ID:-}
      - GALLERY_S3_SECRET_ACCESS_KEY=${GALLERY_DEV_WEB_S3_SECRET_ACCESS_KEY:-}
      - GALLERY_CDN_BASE_URL=${GALLERY_CDN_BASE_URL:-https://gallery-dev.gafus.ru}
      - GALLERY_CDN_EDGE_TOKEN_VERIFIED=${GALLERY_CDN_EDGE_TOKEN_VERIFIED:-false}
      - GALLERY_MEDIA_FALLBACK_ENABLED=${GALLERY_MEDIA_FALLBACK_ENABLED:-false}
      - GALLERY_CDN_SECRET=${GALLERY_DEV_CDN_SECRET:-}
      - GALLERY_INTERNAL_BASE_URL=https://api.gafus.ru
      - GALLERY_INTERNAL_HMAC_SECRET=${GALLERY_DEV_INTERNAL_HMAC_SECRET:-}
      - GALLERY_PROCESSOR_READY=true
      - FEED_ENABLED=${FEED_ENABLED:-false}
      - FEED_PROCESSOR_READY=${FEED_PROCESSOR_READY:-false}
      # Smart feed is enabled for production by default after migration deploy.
      # Existing FEED_ENABLED / FEED_PROCESSOR_READY remain independent safeguards.
      - FEED_SMART_ENABLED=${FEED_SMART_ENABLED:-true}
      - FEED_SMART_STATS_ENABLED=${FEED_SMART_STATS_ENABLED:-true}
      - FEED_SMART_DIAGNOSTICS=${FEED_SMART_DIAGNOSTICS:-true}
      - FEED_SMART_MULTI_SOURCE_ENABLED=${FEED_SMART_MULTI_SOURCE_ENABLED:-true}
      - FEED_SMART_AFFINITY_ENABLED=${FEED_SMART_AFFINITY_ENABLED:-true}
      - FEED_SMART_EVENTS_ENABLED=${FEED_SMART_EVENTS_ENABLED:-true}
      - FEED_SMART_EXPOSURE_TOKENS_REQUIRED=${FEED_SMART_EXPOSURE_TOKENS_REQUIRED:-true}
      - FEED_SMART_MONITOR_ENABLED=${FEED_SMART_MONITOR_ENABLED:-true}
      - FEED_SMART_ML_TRAIN_ENABLED=${FEED_SMART_ML_TRAIN_ENABLED:-true}
      - FEED_SMART_ML_ENABLED=${FEED_SMART_ML_ENABLED:-true}
      # 100% treatment so everyone receives the new feed; not a valid A/B comparison.
      - FEED_SMART_AB_ENABLED=${FEED_SMART_AB_ENABLED:-true}
      - FEED_SMART_AB_PERCENT=${FEED_SMART_AB_PERCENT:-100}
      - FEED_SMART_AB_TREATMENT_PERCENT=${FEED_SMART_AB_TREATMENT_PERCENT:-100}
      - FEED_SMART_SHADOW_ENABLED=${FEED_SMART_SHADOW_ENABLED:-true}
      - FEED_SMART_SHADOW_PERCENT=${FEED_SMART_SHADOW_PERCENT:-1}
      - FEED_BUCKET_PUBLIC=false
      - FEED_BUCKET=${FEED_BUCKET:-gafus-feed-prod-b1gjbsvfnd1fl68k43g6}
      - FEED_S3_ENDPOINT=${FEED_S3_ENDPOINT:-https://storage.yandexcloud.net}
      - FEED_S3_ACCESS_KEY_ID=${FEED_S3_ACCESS_KEY_ID:-}
      - FEED_S3_SECRET_ACCESS_KEY=${FEED_S3_SECRET_ACCESS_KEY:-}
      - FEED_CDN_BASE_URL=${FEED_CDN_BASE_URL:-https://gallery-dev.gafus.ru}
      - FEED_CDN_EDGE_TOKEN_VERIFIED=${FEED_CDN_EDGE_TOKEN_VERIFIED:-false}
      - FEED_MEDIA_FALLBACK_ENABLED=${FEED_MEDIA_FALLBACK_ENABLED:-false}
      - FEED_CDN_SECRET=${FEED_CDN_SECRET:-}
      - FEED_INTERNAL_HMAC_SECRET=${FEED_INTERNAL_HMAC_SECRET:-}
      # HLS Video Protection
      - VIDEO_ACCESS_SECRET=${VIDEO_ACCESS_SECRET}
      - NEXT_PUBLIC_ENABLE_HLS_PROTECTION=${NEXT_PUBLIC_ENABLE_HLS_PROTECTION:-true}
      # ЮKassa (платные курсы, API route в web)
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
      # OpenRouter AI API (публичный генератор отмазок)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # Реквизиты для страницы контактов
      - NEXT_PUBLIC_CONTACT_EMAIL=${NEXT_PUBLIC_CONTACT_EMAIL}
      - NEXT_PUBLIC_CONTACT_PHONE=${NEXT_PUBLIC_CONTACT_PHONE}
      - NEXT_PUBLIC_CONTACT_FIO=${NEXT_PUBLIC_CONTACT_FIO}
      - NEXT_PUBLIC_CONTACT_INN=${NEXT_PUBLIC_CONTACT_INN}
      # VK ID
      - VK_CLIENT_ID=${VK_CLIENT_ID}
      - VK_WEB_REDIRECT_URI=${VK_WEB_REDIRECT_URI}
      - WEB_APP_URL=${WEB_APP_URL:-https://gafus.ru}
      # SMTP / Yandex 360 (транзакционная почта)
      - MAIL_PROVIDER=${MAIL_PROVIDER:-resend}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET:-}
      - MAIL_REPLY_TO=${MAIL_REPLY_TO:-api@gafus.ru}
      - RESEND_FROM=${RESEND_FROM:-notifications@notify.gafus.ru}
      - SMTP_HOST=${SMTP_HOST:-smtp.yandex.ru}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM:-api@gafus.ru}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Гафус}
    volumes:
      - ${APPLE_PRIVATE_KEY_HOST_PATH:-/opt/gafus/secrets/AuthKey_FZ3FFU78RN.p8}:${APPLE_PRIVATE_KEY_PATH:-/run/secrets/apple_app_store_connect_api_key.p8}:ro
    # Uploads handled by CDN - no local volume needed
    # Убрали открытые порты - доступ только через Nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://web:3000/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    depends_on:
      - postgres
      - redis

  # Trainer Panel
  trainer-panel:
    image: ghcr.io/asmtv1/gafus-trainer-panel:latest
    container_name: gafus-trainer-panel
    environment:
      # Voximplant server-only video consultation credentials (GitHub Actions Secrets).
      - VOXIMPLANT_ACCOUNT_ID=${VOXIMPLANT_ACCOUNT_ID:?VOXIMPLANT_ACCOUNT_ID is required}
      - VOXIMPLANT_APPLICATION_ID=${VOXIMPLANT_APPLICATION_ID:?VOXIMPLANT_APPLICATION_ID is required}
      - VOXIMPLANT_ACCOUNT_NAME=${VOXIMPLANT_ACCOUNT_NAME:?VOXIMPLANT_ACCOUNT_NAME is required}
      - VOXIMPLANT_APPLICATION_NAME=${VOXIMPLANT_APPLICATION_NAME:?VOXIMPLANT_APPLICATION_NAME is required}
      - VOXIMPLANT_KEY_ID=${VOXIMPLANT_KEY_ID:?VOXIMPLANT_KEY_ID is required}
      - VOXIMPLANT_PRIVATE_KEY_BASE64=${VOXIMPLANT_PRIVATE_KEY_BASE64:?VOXIMPLANT_PRIVATE_KEY_BASE64 is required}
      - VOXIMPLANT_CREDENTIAL_SECRET=${VOXIMPLANT_CREDENTIAL_SECRET:?VOXIMPLANT_CREDENTIAL_SECRET is required}
      - VOXIMPLANT_ADMISSION_SECRET=${VOXIMPLANT_ADMISSION_SECRET:?VOXIMPLANT_ADMISSION_SECRET is required}
      - NODE_ENV=production
      - PORT=3001
      - DISABLE_CONSOLE_LOGGING=${DISABLE_CONSOLE_LOGGING:-false}
      - CSRF_STRICT=${CSRF_STRICT:-false}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${TRAINER_PANEL_URL:-https://trainer-panel.gafus.ru}
      - ADMIN_PANEL_URL=${ADMIN_PANEL_URL:-https://adminka.gafus.ru}
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-.gafus.ru}
      # Yandex Cloud CDN credentials
      - YC_ACCESS_KEY_ID=${YC_ACCESS_KEY_ID}
      - YC_SECRET_ACCESS_KEY=${YC_SECRET_ACCESS_KEY}
      # HLS Video Protection
      - VIDEO_ACCESS_SECRET=${VIDEO_ACCESS_SECRET}
      - NEXT_PUBLIC_ENABLE_HLS_PROTECTION=${NEXT_PUBLIC_ENABLE_HLS_PROTECTION:-true}
      # OpenRouter AI API
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # Next.js публичные переменные и инвалидация кэша web
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_TRAINER_PANEL_URL:-https://trainer.gafus.ru}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - WEB_APP_URL=${WEB_APP_URL:-https://gafus.ru}
      - REVALIDATE_SECRET_TOKEN=${REVALIDATE_SECRET_TOKEN}
      - NEXT_PUBLIC_TRACER_APP_TOKEN=${NEXT_PUBLIC_TRACER_APP_TOKEN}
      - TRACER_APP_TOKEN=${TRACER_APP_TOKEN:-${NEXT_PUBLIC_TRACER_APP_TOKEN}}
      - TRACER_SERVER_ENABLED=${TRACER_SERVER_ENABLED:-}
      - NEXT_PUBLIC_APP_VERSION=${NEXT_PUBLIC_APP_VERSION:-1.7.0}
      - NEXT_PUBLIC_ENABLE_TRACER=${NEXT_PUBLIC_ENABLE_TRACER:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://trainer-panel:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    depends_on:
      - postgres
      - redis

  # Admin Panel
  admin-panel:
    image: ghcr.io/asmtv1/gafus-admin-panel:latest
    container_name: gafus-admin-panel
    environment:
      - NODE_ENV=production
      - PORT=3006
      - DISABLE_CONSOLE_LOGGING=${DISABLE_CONSOLE_LOGGING:-false}
      - CSRF_STRICT=${CSRF_STRICT:-false}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${ADMIN_PANEL_URL:-https://adminka.gafus.ru}
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-.gafus.ru}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@gafus.ru}
      - EXPO_ACCESS_TOKEN=${EXPO_ACCESS_TOKEN}
      - RUSTORE_PUSH_SERVICE_TOKEN=${RUSTORE_PUSH_SERVICE_TOKEN}
      - RUSTORE_PROJECT_ID=${RUSTORE_PROJECT_ID}
      - TRACER_APP_TOKEN=${TRACER_APP_TOKEN:-${NEXT_PUBLIC_TRACER_APP_TOKEN}}
      - TRACER_SERVER_ENABLED=${TRACER_SERVER_ENABLED:-}
      - NEXT_PUBLIC_TRACER_APP_TOKEN=${NEXT_PUBLIC_TRACER_APP_TOKEN}
    # Убрали открытые порты - доступ только через Nginx
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  # Prisma Database Management
  prisma:
    image: ghcr.io/asmtv1/gafus-prisma:latest
    container_name: gafus-prisma
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
    restart: unless-stopped
    depends_on:
      - postgres

  # Worker
  worker:
    image: ghcr.io/asmtv1/gafus-worker:latest
    container_name: gafus-worker
    # DNS over TCP: production UDP DNS queries time out.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    dns_opt:
      - use-vc
    environment:
      - CLOUDRU_MEDIA_JOBS_ENABLED=${CLOUDRU_MEDIA_JOBS_ENABLED:-false}
      - CLOUDRU_PROJECT_ID=${CLOUDRU_PROJECT_ID:-}
      - CLOUDRU_KEY_ID=${CLOUDRU_KEY_ID:-}
      - CLOUDRU_KEY_SECRET=${CLOUDRU_KEY_SECRET:-}
      - CLOUDRU_USER_MEDIA_ENABLED=${CLOUDRU_USER_MEDIA_ENABLED:-false}
      - CLOUDRU_S3_ENDPOINT=${CLOUDRU_S3_ENDPOINT:-https://s3.cloud.ru}
      - CLOUDRU_S3_ACCESS_KEY_ID=${CLOUDRU_S3_ACCESS_KEY_ID:-}
      - CLOUDRU_S3_SECRET_ACCESS_KEY=${CLOUDRU_S3_SECRET_ACCESS_KEY:-}
      - CLOUDRU_DOCUMENTS_BUCKET=${CLOUDRU_DOCUMENTS_BUCKET:-}
      - CLOUDRU_QUESTIONS_BUCKET=${CLOUDRU_QUESTIONS_BUCKET:-}
      - CLOUDRU_DOCUMENTS_BUCKET_VERSIONING=${CLOUDRU_DOCUMENTS_BUCKET_VERSIONING:-}
      - CLOUDRU_QUESTIONS_BUCKET_VERSIONING=${CLOUDRU_QUESTIONS_BUCKET_VERSIONING:-}
      - ACCOUNT_STORAGE_CLEANUP_ENABLED=${ACCOUNT_STORAGE_CLEANUP_ENABLED:-false}
      - CDN_CLEANUP_SERVICE_ACCOUNT_KEY=${CDN_CLEANUP_SERVICE_ACCOUNT_KEY:-}
      - PUBLIC_CDN_RESOURCE_IDS=${PUBLIC_CDN_RESOURCE_IDS:-}
      - GALLERY_CDN_RESOURCE_IDS=${GALLERY_CDN_RESOURCE_IDS:-}
      - FEED_CDN_RESOURCE_IDS=${FEED_CDN_RESOURCE_IDS:-}
      - GALLERY_BUCKET_PUBLIC=false
      - GALLERY_BUCKET=${GALLERY_BUCKET:-gafus-gallery-dev-photos-b1gjbsvfnd1fl68k43g6}
      - GALLERY_S3_ENDPOINT=${GALLERY_S3_ENDPOINT:-https://storage.yandexcloud.net}
      - GALLERY_S3_ACCESS_KEY_ID=${GALLERY_S3_ACCESS_KEY_ID:-}
      - GALLERY_S3_SECRET_ACCESS_KEY=${GALLERY_S3_SECRET_ACCESS_KEY:-}
      - GALLERY_CDN_BASE_URL=${GALLERY_CDN_BASE_URL:-https://gallery-dev.gafus.ru}
      - GALLERY_CDN_SECRET=${GALLERY_DEV_CDN_SECRET:-}
      - GALLERY_CDN_EDGE_TOKEN_VERIFIED=${GALLERY_CDN_EDGE_TOKEN_VERIFIED:-false}
      - GALLERY_MEDIA_FALLBACK_ENABLED=${GALLERY_MEDIA_FALLBACK_ENABLED:-false}
      - GALLERY_PROCESSOR_READY=${GALLERY_PROCESSOR_READY:-false}
      - FEED_ENABLED=${FEED_ENABLED:-false}
      - FEED_PROCESSOR_READY=${FEED_PROCESSOR_READY:-false}
      # Smart feed is enabled for production by default after migration deploy.
      # Existing FEED_ENABLED / FEED_PROCESSOR_READY remain independent safeguards.
      - FEED_SMART_ENABLED=${FEED_SMART_ENABLED:-true}
      - FEED_SMART_STATS_ENABLED=${FEED_SMART_STATS_ENABLED:-true}
      - FEED_SMART_DIAGNOSTICS=${FEED_SMART_DIAGNOSTICS:-true}
      - FEED_SMART_MULTI_SOURCE_ENABLED=${FEED_SMART_MULTI_SOURCE_ENABLED:-true}
      - FEED_SMART_AFFINITY_ENABLED=${FEED_SMART_AFFINITY_ENABLED:-true}
      - FEED_SMART_EVENTS_ENABLED=${FEED_SMART_EVENTS_ENABLED:-true}
      - FEED_SMART_EXPOSURE_TOKENS_REQUIRED=${FEED_SMART_EXPOSURE_TOKENS_REQUIRED:-true}
      - FEED_SMART_MONITOR_ENABLED=${FEED_SMART_MONITOR_ENABLED:-true}
      - FEED_SMART_ML_TRAIN_ENABLED=${FEED_SMART_ML_TRAIN_ENABLED:-true}
      - FEED_SMART_ML_ENABLED=${FEED_SMART_ML_ENABLED:-true}
      # 100% treatment so everyone receives the new feed; not a valid A/B comparison.
      - FEED_SMART_AB_ENABLED=${FEED_SMART_AB_ENABLED:-true}
      - FEED_SMART_AB_PERCENT=${FEED_SMART_AB_PERCENT:-100}
      - FEED_SMART_AB_TREATMENT_PERCENT=${FEED_SMART_AB_TREATMENT_PERCENT:-100}
      - FEED_SMART_SHADOW_ENABLED=${FEED_SMART_SHADOW_ENABLED:-true}
      - FEED_SMART_SHADOW_PERCENT=${FEED_SMART_SHADOW_PERCENT:-1}
      - FEED_BUCKET_PUBLIC=false
      - FEED_BUCKET=${FEED_BUCKET:-gafus-feed-prod-b1gjbsvfnd1fl68k43g6}
      - FEED_S3_ENDPOINT=${FEED_S3_ENDPOINT:-https://storage.yandexcloud.net}
      - FEED_S3_ACCESS_KEY_ID=${FEED_S3_ACCESS_KEY_ID:-}
      - FEED_S3_SECRET_ACCESS_KEY=${FEED_S3_SECRET_ACCESS_KEY:-}
      - FEED_CDN_BASE_URL=${FEED_CDN_BASE_URL:-https://gallery-dev.gafus.ru}
      - FEED_CDN_EDGE_TOKEN_VERIFIED=${FEED_CDN_EDGE_TOKEN_VERIFIED:-false}
      - FEED_MEDIA_FALLBACK_ENABLED=${FEED_MEDIA_FALLBACK_ENABLED:-false}
      - FEED_CDN_SECRET=${FEED_CDN_SECRET:-}
      - FEED_INTERNAL_HMAC_SECRET=${FEED_INTERNAL_HMAC_SECRET:-}
      - FEED_MAINTENANCE_ENABLED=${FEED_MAINTENANCE_ENABLED:-false}
      - FEED_PUSH_ENABLED=${FEED_PUSH_ENABLED:-false}
      - CYNOLOGIST_CHAT_ENABLED=${CYNOLOGIST_CHAT_ENABLED:-false}
      - COMMUNITY_CHAT_ENABLED=${COMMUNITY_CHAT_ENABLED:-false}
      - CYNOLOGIST_CHAT_TRAINER_USER_ID=${CYNOLOGIST_CHAT_TRAINER_USER_ID:-cmhq7qk2s0000nn01jr2ptnil}
      - STREAM_API_KEY=${STREAM_API_KEY:-}
      - STREAM_API_SECRET=${STREAM_API_SECRET:-}
      - NODE_ENV=production
      - WORKER_HEALTH_PORT=3003
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@gafus.ru}
      # ЮKassa (автопродления подписок)
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
      # Apple App Store Server API (синхронизация подписок)
      - APPLE_BUNDLE_ID=${APPLE_BUNDLE_ID:-}
      - APPLE_APP_ID=${APPLE_APP_ID:-}
      - APPLE_USE_SANDBOX=${APPLE_USE_SANDBOX:-false}
      - APPLE_ISSUER_ID=${APPLE_ISSUER_ID:-}
      - APPLE_KEY_ID=${APPLE_KEY_ID:-}
      - APPLE_PRIVATE_KEY_PATH=${APPLE_PRIVATE_KEY_PATH:-/run/secrets/apple_app_store_connect_api_key.p8}
      # Yandex Cloud CDN credentials (необходимы для транскодирования видео)
      - YC_ACCESS_KEY_ID=${YC_ACCESS_KEY_ID}
      - YC_SECRET_ACCESS_KEY=${YC_SECRET_ACCESS_KEY}
      # Включаем транспорты для гарантированной записи логов в stdout
      - PINO_USE_WORKER_TRANSPORTS=true
      - TRACER_APP_TOKEN=${TRACER_APP_TOKEN:-${NEXT_PUBLIC_TRACER_APP_TOKEN}}
      - TRACER_SERVER_ENABLED=${TRACER_SERVER_ENABLED:-}
      # SMTP / Yandex 360 (фоновые задачи с @gafus/mailer / почтой)
      - MAIL_PROVIDER=${MAIL_PROVIDER:-resend}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET:-}
      - MAIL_REPLY_TO=${MAIL_REPLY_TO:-api@gafus.ru}
      - RESEND_FROM=${RESEND_FROM:-notifications@notify.gafus.ru}
      - SMTP_HOST=${SMTP_HOST:-smtp.yandex.ru}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM:-api@gafus.ru}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Гафус}
      # НПД: только worker/bootstrap. По умолчанию внешний процессинг выключен.
      - NPD_PROCESSING_ENABLED=${NPD_PROCESSING_ENABLED:-false}
      - NPD_TOKEN_ENCRYPTION_KEY=${NPD_TOKEN_ENCRYPTION_KEY}
      - NPD_API_BASE_URL=${NPD_API_BASE_URL:-https://lknpd.nalog.ru/api/v1}
      - NPD_BATCH_SIZE=${NPD_BATCH_SIZE:-20}
      - NPD_REQUEST_TIMEOUT_MS=${NPD_REQUEST_TIMEOUT_MS:-10000}
      - NPD_RECEIPT_EMAIL_BATCH_SIZE=${NPD_RECEIPT_EMAIL_BATCH_SIZE:-20}
      - NPD_RECEIPT_EMAIL_ENABLED=${NPD_RECEIPT_EMAIL_ENABLED:-true}
    volumes:
      - ${APPLE_PRIVATE_KEY_HOST_PATH:-/opt/gafus/secrets/AuthKey_FZ3FFU78RN.p8}:${APPLE_PRIVATE_KEY_PATH:-/run/secrets/apple_app_store_connect_api_key.p8}:ro
    deploy:
      resources:
        limits:
          cpus: "0.8" # Максимум 0.8 CPU ядра (на сервере только 1 CPU)
          memory: 2G # Максимум 2GB памяти
        reservations:
          cpus: "0.2" # Минимум 0.2 CPU ядра
          memory: 512M # Минимум 512MB памяти
    restart: unless-stopped
    # localhost → ::1 на Alpine, Node слушает 0.0.0.0:3003 — wget к localhost даёт Connection refused
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - postgres
      - redis

  # Bull Board
  bull-board:
    image: ghcr.io/asmtv1/gafus-bull-board:latest
    container_name: gafus-bull-board
    environment:
      - NODE_ENV=production
      - PORT=3002
      - REDIS_URL=redis://redis:6379
      - TRACER_APP_TOKEN=${TRACER_APP_TOKEN:-${NEXT_PUBLIC_TRACER_APP_TOKEN}}
      - TRACER_SERVER_ENABLED=${TRACER_SERVER_ENABLED:-}
    # Убрали открытые порты - доступ только через Nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy

  # API Service
  api:
    image: ghcr.io/asmtv1/gafus-api:latest
    container_name: gafus-api
    # DNS over TCP: production UDP DNS queries time out.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    dns_opt:
      - use-vc
    environment:
      # Voximplant server-only video consultation credentials (GitHub Actions Secrets).
      - VOXIMPLANT_ACCOUNT_ID=${VOXIMPLANT_ACCOUNT_ID:?VOXIMPLANT_ACCOUNT_ID is required}
      - VOXIMPLANT_APPLICATION_ID=${VOXIMPLANT_APPLICATION_ID:?VOXIMPLANT_APPLICATION_ID is required}
      - VOXIMPLANT_ACCOUNT_NAME=${VOXIMPLANT_ACCOUNT_NAME:?VOXIMPLANT_ACCOUNT_NAME is required}
      - VOXIMPLANT_APPLICATION_NAME=${VOXIMPLANT_APPLICATION_NAME:?VOXIMPLANT_APPLICATION_NAME is required}
      - VOXIMPLANT_KEY_ID=${VOXIMPLANT_KEY_ID:?VOXIMPLANT_KEY_ID is required}
      - VOXIMPLANT_PRIVATE_KEY_BASE64=${VOXIMPLANT_PRIVATE_KEY_BASE64:?VOXIMPLANT_PRIVATE_KEY_BASE64 is required}
      - VOXIMPLANT_CREDENTIAL_SECRET=${VOXIMPLANT_CREDENTIAL_SECRET:?VOXIMPLANT_CREDENTIAL_SECRET is required}
      - VOXIMPLANT_ADMISSION_SECRET=${VOXIMPLANT_ADMISSION_SECRET:?VOXIMPLANT_ADMISSION_SECRET is required}
      - CLOUDRU_USER_MEDIA_ENABLED=${CLOUDRU_USER_MEDIA_ENABLED:-false}
      - CLOUDRU_S3_ENDPOINT=${CLOUDRU_S3_ENDPOINT:-https://s3.cloud.ru}
      - CLOUDRU_S3_ACCESS_KEY_ID=${CLOUDRU_S3_ACCESS_KEY_ID:-}
      - CLOUDRU_S3_SECRET_ACCESS_KEY=${CLOUDRU_S3_SECRET_ACCESS_KEY:-}
      - CLOUDRU_DOCUMENTS_BUCKET=${CLOUDRU_DOCUMENTS_BUCKET:-}
      - CLOUDRU_QUESTIONS_BUCKET=${CLOUDRU_QUESTIONS_BUCKET:-}
      - CLOUDRU_DOCUMENTS_BUCKET_VERSIONING=${CLOUDRU_DOCUMENTS_BUCKET_VERSIONING:-}
      - CLOUDRU_QUESTIONS_BUCKET_VERSIONING=${CLOUDRU_QUESTIONS_BUCKET_VERSIONING:-}
      - CYNOLOGIST_CHAT_ENABLED=${CYNOLOGIST_CHAT_ENABLED:-false}
      - COMMUNITY_CHAT_ENABLED=${COMMUNITY_CHAT_ENABLED:-false}
      - CYNOLOGIST_CHAT_TRAINER_USER_ID=${CYNOLOGIST_CHAT_TRAINER_USER_ID:-cmhq7qk2s0000nn01jr2ptnil}
      - STREAM_API_KEY=${STREAM_API_KEY:-}
      - STREAM_API_SECRET=${STREAM_API_SECRET:-}
      - NODE_ENV=production
      - API_PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      # ЮKassa (платежи через API)
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
      # Apple IAP (верификация покупки курса на iOS)
      - APPLE_BUNDLE_ID=${APPLE_BUNDLE_ID:-}
      - APPLE_APP_ID=${APPLE_APP_ID:-}
      - APPLE_USE_SANDBOX=${APPLE_USE_SANDBOX:-false}
      - APPLE_ISSUER_ID=${APPLE_ISSUER_ID:-}
      - APPLE_KEY_ID=${APPLE_KEY_ID:-}
      - APPLE_PRIVATE_KEY_PATH=${APPLE_PRIVATE_KEY_PATH:-/run/secrets/apple_app_store_connect_api_key.p8}
      # База web URL для return_url платежей
      - WEB_APP_URL=${WEB_APP_URL}
      # HLS Video Protection
      - VIDEO_ACCESS_SECRET=${VIDEO_ACCESS_SECRET}
      - TRACER_APP_TOKEN=${TRACER_APP_TOKEN:-${NEXT_PUBLIC_TRACER_APP_TOKEN}}
      - TRACER_SERVER_ENABLED=${TRACER_SERVER_ENABLED:-}
      # Yandex Cloud Object Storage (для загрузки манифестов и сегментов)
      - YC_ACCESS_KEY_ID=${YC_ACCESS_KEY_ID}
      - YC_SECRET_ACCESS_KEY=${YC_SECRET_ACCESS_KEY}
      # Gallery DEV enabled by user request; deploy only after DB migration/cloud readiness.
      - GALLERY_ENABLED=true
      - GALLERY_BUCKET_PUBLIC=false
      - GALLERY_BUCKET=${GALLERY_BUCKET:-gafus-gallery-dev-photos-b1gjbsvfnd1fl68k43g6}
      - GALLERY_S3_ENDPOINT=${GALLERY_S3_ENDPOINT:-https://storage.yandexcloud.net}
      - GALLERY_S3_ACCESS_KEY_ID=${GALLERY_DEV_WEB_S3_ACCESS_KEY_ID:-}
      - GALLERY_S3_SECRET_ACCESS_KEY=${GALLERY_DEV_WEB_S3_SECRET_ACCESS_KEY:-}
      - GALLERY_CDN_BASE_URL=${GALLERY_CDN_BASE_URL:-https://gallery-dev.gafus.ru}
      - GALLERY_CDN_EDGE_TOKEN_VERIFIED=${GALLERY_CDN_EDGE_TOKEN_VERIFIED:-false}
      - GALLERY_MEDIA_FALLBACK_ENABLED=${GALLERY_MEDIA_FALLBACK_ENABLED:-false}
      - GALLERY_CDN_SECRET=${GALLERY_DEV_CDN_SECRET:-}
      - GALLERY_INTERNAL_BASE_URL=https://api.gafus.ru
      - GALLERY_INTERNAL_HMAC_SECRET=${GALLERY_DEV_INTERNAL_HMAC_SECRET:-}
      - GALLERY_PROCESSOR_READY=true
      - FEED_ENABLED=${FEED_ENABLED:-false}
      - FEED_PROCESSOR_READY=${FEED_PROCESSOR_READY:-false}
      # Smart feed is enabled for production by default after migration deploy.
      # Existing FEED_ENABLED / FEED_PROCESSOR_READY remain independent safeguards.
      - FEED_SMART_ENABLED=${FEED_SMART_ENABLED:-true}
      - FEED_SMART_STATS_ENABLED=${FEED_SMART_STATS_ENABLED:-true}
      - FEED_SMART_DIAGNOSTICS=${FEED_SMART_DIAGNOSTICS:-true}
      - FEED_SMART_MULTI_SOURCE_ENABLED=${FEED_SMART_MULTI_SOURCE_ENABLED:-true}
      - FEED_SMART_AFFINITY_ENABLED=${FEED_SMART_AFFINITY_ENABLED:-true}
      - FEED_SMART_EVENTS_ENABLED=${FEED_SMART_EVENTS_ENABLED:-true}
      - FEED_SMART_EXPOSURE_TOKENS_REQUIRED=${FEED_SMART_EXPOSURE_TOKENS_REQUIRED:-true}
      - FEED_SMART_MONITOR_ENABLED=${FEED_SMART_MONITOR_ENABLED:-true}
      - FEED_SMART_ML_TRAIN_ENABLED=${FEED_SMART_ML_TRAIN_ENABLED:-true}
      - FEED_SMART_ML_ENABLED=${FEED_SMART_ML_ENABLED:-true}
      # 100% treatment so everyone receives the new feed; not a valid A/B comparison.
      - FEED_SMART_AB_ENABLED=${FEED_SMART_AB_ENABLED:-true}
      - FEED_SMART_AB_PERCENT=${FEED_SMART_AB_PERCENT:-100}
      - FEED_SMART_AB_TREATMENT_PERCENT=${FEED_SMART_AB_TREATMENT_PERCENT:-100}
      - FEED_SMART_SHADOW_ENABLED=${FEED_SMART_SHADOW_ENABLED:-true}
      - FEED_SMART_SHADOW_PERCENT=${FEED_SMART_SHADOW_PERCENT:-1}
      - FEED_BUCKET_PUBLIC=false
      - FEED_BUCKET=${FEED_BUCKET:-gafus-feed-prod-b1gjbsvfnd1fl68k43g6}
      - FEED_S3_ENDPOINT=${FEED_S3_ENDPOINT:-https://storage.yandexcloud.net}
      - FEED_S3_ACCESS_KEY_ID=${FEED_S3_ACCESS_KEY_ID:-}
      - FEED_S3_SECRET_ACCESS_KEY=${FEED_S3_SECRET_ACCESS_KEY:-}
      - FEED_CDN_BASE_URL=${FEED_CDN_BASE_URL:-https://gallery-dev.gafus.ru}
      - FEED_CDN_EDGE_TOKEN_VERIFIED=${FEED_CDN_EDGE_TOKEN_VERIFIED:-false}
      - FEED_MEDIA_FALLBACK_ENABLED=${FEED_MEDIA_FALLBACK_ENABLED:-false}
      - CDN_HEALTH_MONITOR_ENABLED=${CDN_HEALTH_MONITOR_ENABLED:-false}
      - FEED_CDN_SECRET=${FEED_CDN_SECRET:-}
      - FEED_INTERNAL_HMAC_SECRET=${FEED_INTERNAL_HMAC_SECRET:-}
      # VK ID (mobile auth, vk-link)
      - VK_CLIENT_ID=${VK_CLIENT_ID}
      - VK_CLIENT_ID_IOS=${VK_CLIENT_ID_IOS}
      - VK_CLIENT_ID_ANDROID=${VK_CLIENT_ID_ANDROID}
      - VK_MOBILE_REDIRECT_URI=${VK_MOBILE_REDIRECT_URI:-gafus://auth/vk}
      # Минимальная версия store-сборки. Поднять после публикации новой версии в сторах.
      - MOBILE_IOS_MIN_VERSION=${MOBILE_IOS_MIN_VERSION:-1.7.0}
      - MOBILE_ANDROID_MIN_VERSION=${MOBILE_ANDROID_MIN_VERSION:-1.7.0}
      - MOBILE_IOS_STORE_URL=${MOBILE_IOS_STORE_URL:-https://apps.apple.com/ru/app/gafus/id6760964612}
      - MOBILE_ANDROID_STORE_URL=${MOBILE_ANDROID_STORE_URL:-https://www.rustore.ru/catalog/app/ru.gafus.app}
      - MAIL_PROVIDER=${MAIL_PROVIDER:-resend}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET:-}
      - MAIL_REPLY_TO=${MAIL_REPLY_TO:-api@gafus.ru}
      - RESEND_FROM=${RESEND_FROM:-notifications@notify.gafus.ru}
      - SMTP_HOST=${SMTP_HOST:-smtp.yandex.ru}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM:-api@gafus.ru}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Гафус}
    volumes:
      - ${APPLE_PRIVATE_KEY_HOST_PATH:-/opt/gafus/secrets/AuthKey_FZ3FFU78RN.p8}:${APPLE_PRIVATE_KEY_PATH:-/run/secrets/apple_app_store_connect_api_key.p8}:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: gafus-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    command: >
      sh -c "
        echo 'Starting nginx with CDN configuration...' &&
        rm -rf /var/cache/nginx/cdn &&
        nginx -g 'daemon off;'
      "
    restart: unless-stopped
    depends_on:
      - web
      - trainer-panel
      - admin-panel
      - api
      - bull-board

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot
    container_name: gafus-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email admin@gafus.ru --agree-tos --no-eff-email -d gafus.ru -d www.gafus.ru -d api.gafus.ru -d trainer-panel.gafus.ru -d adminka.gafus.ru -d queues.gafus.ru
    depends_on:
      - nginx

  # Node Exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: gafus-node-exporter
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /run/udev:/run/udev:ro
    network_mode: host
    restart: unless-stopped
    pid: host

  # PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: gafus-postgres-exporter
    command:
      - "--config.file=/etc/postgres_exporter/postgres_exporter.yml"
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-gafus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gafus}?sslmode=disable
    volumes:
      - ./postgres-exporter/postgres_exporter.yml:/etc/postgres_exporter/postgres_exporter.yml:ro
    restart: unless-stopped
    depends_on:
      - postgres

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: gafus-redis-exporter
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    restart: unless-stopped
    depends_on:
      - redis

  # Blackbox Exporter для проверки HTTP endpoints (health checks)
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: gafus-blackbox-exporter
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    volumes:
      - ./blackbox:/etc/blackbox_exporter
    restart: unless-stopped

  # Grafana Alloy — сбор метрик и remote_write в Yandex Monitoring
  grafana-alloy:
    image: grafana/alloy:v1.8.2
    container_name: gafus-alloy
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./prometheus:/etc/alloy:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - YC_MONITORING_API_KEY=${YC_MONITORING_API_KEY}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "grep -q ':3039 .* 0A ' /proc/net/tcp /proc/net/tcp6",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - node-exporter
      - postgres-exporter
      - blackbox-exporter

  # Синхронизирует метрики из Prometheus workspace в нативный Yandex Monitoring.
  # Это нужно для ChartWidget в мобильном приложении Yandex Cloud
  # (MultiSourceChartWidget с PrometheusTarget не поддерживается мобильным клиентом).
  yandex-metrics-sync:
    image: python:3.12-alpine
    container_name: gafus-yandex-metrics-sync
    command: >
      sh -c "while true; do python /scripts/sync-metrics-to-yandex-native.py; sleep 60; done"
    volumes:
      - ../../scripts/sync-metrics-to-yandex-native.py:/scripts/sync-metrics-to-yandex-native.py:ro
    environment:
      - YC_MONITORING_API_KEY=${YC_MONITORING_API_KEY}
      - YC_FOLDER_ID=b1g0vbm2pvav4oqc4ds9
      - YC_PROMETHEUS_WORKSPACE_ID=monj8dpjri8u0bbqvq71
    restart: unless-stopped
    depends_on:
      - grafana-alloy

volumes:
  postgres_data:
