      - CYNOLOGIST_CHAT_TRAINER_USER_ID=${CYNOLOGIST_CHAT_TRAINER_USER_ID:-cmhq7qk2s0000nn01jr2ptnil}
      - STREAM_API_KEY=${STREAM_API_KEY:-}
      - STREAM_API_SECRET=${STREAM_API_SECRET:-}
      - NODE_ENV=production
