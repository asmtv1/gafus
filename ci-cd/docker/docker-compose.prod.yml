      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      # ЮKassa (платежи через API)
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
      # Apple IAP (верификация покупки курса на iOS)
      - APPLE_BUNDLE_ID=${APPLE_BUNDLE_ID:-}
      - APPLE_APP_ID=${APPLE_APP_ID:-}
      - APPLE_USE_SANDBOX=${APPLE_USE_SANDBOX:-false}
      - APPLE_ISSUER_ID=${APPLE_ISSUER_ID:-}
      - APPLE_KEY_ID=${APPLE_KEY_ID:-}
      - APPLE_PRIVATE_KEY_PATH=${APPLE_PRIVATE_KEY_PATH:-/run/secrets/apple_app_store_connect_api_key.p8}
      # База web URL для return_url платежей
      - WEB_APP_URL=${WEB_APP_URL}
      # HLS Video Protection
      - VIDEO_ACCESS_SECRET=${VIDEO_ACCESS_SECRET}
      - TRACER_APP_TOKEN=${TRACER_APP_TOKEN:-${NEXT_PUBLIC_TRACER_APP_TOKEN}}
      - TRACER_SERVER_ENABLED=${TRACER_SERVER_ENABLED:-}
      # Yandex Cloud Object Storage (для загрузки манифестов и сегментов)
      - YC_ACCESS_KEY_ID=${YC_ACCESS_KEY_ID}
      - YC_SECRET_ACCESS_KEY=${YC_SECRET_ACCESS_KEY}
      # Gallery DEV enabled by user request; deploy only after DB migration/cloud readiness.
      - GALLERY_ENABLED=true
      - GALLERY_BUCKET_PUBLIC=false
      - GALLERY_BUCKET=${GALLERY_BUCKET:-gafus-gallery-private}
      - GALLERY_S3_ENDPOINT=${GALLERY_S3_ENDPOINT:-https://s3.cloud.ru}
      - GALLERY_S3_ACCESS_KEY_ID=${GALLERY_DEV_WEB_S3_ACCESS_KEY_ID:-}
      - GALLERY_S3_SECRET_ACCESS_KEY=${GALLERY_DEV_WEB_S3_SECRET_ACCESS_KEY:-}
      - GALLERY_CDN_BASE_URL=${GALLERY_CDN_BASE_URL:-https://fupiquafifeswu.begetcdn.cloud}
      - GALLERY_CDN_PROVIDER=${GALLERY_CDN_PROVIDER:-beget}
      - GALLERY_CDN_EDGE_TOKEN_VERIFIED=${GALLERY_CDN_EDGE_TOKEN_VERIFIED:-false}
      - GALLERY_MEDIA_FALLBACK_ENABLED=${GALLERY_MEDIA_FALLBACK_ENABLED:-false}
      # Gallery CDN -> API 307 -> private S3. Disabled by default.
      - GALLERY_CDN_ORIGIN_ROUTE_ENABLED=${GALLERY_CDN_ORIGIN_ROUTE_ENABLED:-false}
      - GALLERY_CDN_REDIRECT_ENABLED=${GALLERY_CDN_REDIRECT_ENABLED:-false}
      - GALLERY_CDN_REDIRECT_SIGNING_SECRET=${GALLERY_CDN_REDIRECT_SIGNING_SECRET:-}
      - GALLERY_CDN_REDIRECT_ORIGIN_SECRET=${GALLERY_CDN_REDIRECT_ORIGIN_SECRET:-}
      - GALLERY_CDN_CACHEABLE_FINAL_ENABLED=${GALLERY_CDN_CACHEABLE_FINAL_ENABLED:-false}
      - GALLERY_INTERNAL_BASE_URL=https://api.gafus.ru
      - GALLERY_INTERNAL_HMAC_SECRET=${GALLERY_DEV_INTERNAL_HMAC_SECRET:-}
      - FEED_ENABLED=${FEED_ENABLED:-false}
      - FEED_PROCESSOR_READY=${FEED_PROCESSOR_READY:-false}
      # Upload confirmations must enqueue immediate Cloud.ru processing.
      - CLOUDRU_MEDIA_JOBS_ENABLED=${CLOUDRU_MEDIA_JOBS_ENABLED:-false}
      # Both Gallery slots and all Feed V2 workers are activated together.
      - FEED_CLOUDRU_REFRACTOR_VERIFIED=${FEED_CLOUDRU_REFRACTOR_VERIFIED:-false}
      # Chat2 V2 uses its independent scoped Cloud.ru project and HMAC.
      - CHAT2_V2_CORE_ENABLED=${CHAT2_V2_CORE_ENABLED:-false}
      - CHAT2_V2_MEDIA_ENABLED=${CHAT2_V2_MEDIA_ENABLED:-false}
      - CHAT2_PROCESSOR_READY=${CHAT2_PROCESSOR_READY:-false}
      - CHAT2_CLOUDRU_PROJECT_VERIFIED=${CHAT2_CLOUDRU_PROJECT_VERIFIED:-false}
      - CHAT2_CLOUDRU_PROJECT_ID=${CHAT2_CLOUDRU_PROJECT_ID:-}
      - CHAT2_CLOUDRU_KEY_ID=${CHAT2_CLOUDRU_KEY_ID:-}
      - CHAT2_CLOUDRU_KEY_SECRET=${CHAT2_CLOUDRU_KEY_SECRET:-}
      - CHAT2_INTERNAL_HMAC_SECRET=${CHAT2_INTERNAL_HMAC_SECRET:-}
      - CHAT2_S3_ENDPOINT=${CHAT2_S3_ENDPOINT:-https://s3.cloud.ru}
      - CHAT2_S3_BUCKET=${CHAT2_S3_BUCKET:-gafus-chat2-media-2026}
      - CHAT2_S3_ACCESS_KEY_ID=${CHAT2_S3_ACCESS_KEY_ID:-}
      - CHAT2_S3_SECRET_ACCESS_KEY=${CHAT2_S3_SECRET_ACCESS_KEY:-}
      # Questions Photo V2 remains OFF until a compatible production Hono API,
      # a matching HMAC secret and Cloud.ru public S3 have independent acceptance.
      - QUESTIONS_V2_MEDIA_ENABLED=${QUESTIONS_V2_MEDIA_ENABLED:-false}
      - QUESTIONS_V2_PUBLIC_BUCKET_VERIFIED=${QUESTIONS_V2_PUBLIC_BUCKET_VERIFIED:-false}
      - QUESTIONS_V2_INTERNAL_REFRACTOR_VERIFIED=${QUESTIONS_V2_INTERNAL_REFRACTOR_VERIFIED:-false}
      - QUESTIONS_V2_INTERNAL_BASE_URL=${QUESTIONS_V2_INTERNAL_BASE_URL:-https://api.gafus.ru/}
      - QUESTIONS_V2_INTERNAL_ALLOWED_HOSTNAME=${QUESTIONS_V2_INTERNAL_ALLOWED_HOSTNAME:-api.gafus.ru}
      - QUESTIONS_V2_INTERNAL_HMAC_SECRET=${QUESTIONS_V2_INTERNAL_HMAC_SECRET:-}
      - QUESTIONS_V2_S3_ENDPOINT=${QUESTIONS_V2_S3_ENDPOINT:-https://s3.cloud.ru}
      - QUESTIONS_V2_S3_BUCKET=${QUESTIONS_V2_S3_BUCKET:-gafus-questions-public}
      - QUESTIONS_V2_S3_REGION=${QUESTIONS_V2_S3_REGION:-ru-central-1}
      - QUESTIONS_V2_S3_ACCESS_KEY_ID=${QUESTIONS_V2_S3_ACCESS_KEY_ID:-}
      - QUESTIONS_V2_S3_SECRET_ACCESS_KEY=${QUESTIONS_V2_S3_SECRET_ACCESS_KEY:-}
      # Smart feed is enabled for production by default after migration deploy.
      # Existing FEED_ENABLED / FEED_PROCESSOR_READY remain independent safeguards.
      - FEED_SMART_ENABLED=${FEED_SMART_ENABLED:-true}
      - FEED_SMART_STATS_ENABLED=${FEED_SMART_STATS_ENABLED:-true}
      - FEED_SMART_DIAGNOSTICS=${FEED_SMART_DIAGNOSTICS:-true}
      - FEED_SMART_MULTI_SOURCE_ENABLED=${FEED_SMART_MULTI_SOURCE_ENABLED:-true}
      - FEED_SMART_AFFINITY_ENABLED=${FEED_SMART_AFFINITY_ENABLED:-true}
      - FEED_SMART_EVENTS_ENABLED=${FEED_SMART_EVENTS_ENABLED:-true}
      - FEED_SMART_EXPOSURE_TOKENS_REQUIRED=${FEED_SMART_EXPOSURE_TOKENS_REQUIRED:-true}
      - FEED_SMART_MONITOR_ENABLED=${FEED_SMART_MONITOR_ENABLED:-true}
      - FEED_SMART_ML_TRAIN_ENABLED=${FEED_SMART_ML_TRAIN_ENABLED:-true}
      - FEED_SMART_ML_ENABLED=${FEED_SMART_ML_ENABLED:-true}
      # 100% treatment so everyone receives the new feed; not a valid A/B comparison.
      - FEED_SMART_AB_ENABLED=${FEED_SMART_AB_ENABLED:-true}
      - FEED_SMART_AB_PERCENT=${FEED_SMART_AB_PERCENT:-100}
      - FEED_SMART_AB_TREATMENT_PERCENT=${FEED_SMART_AB_TREATMENT_PERCENT:-100}
      - FEED_SMART_SHADOW_ENABLED=${FEED_SMART_SHADOW_ENABLED:-true}
      - FEED_SMART_SHADOW_PERCENT=${FEED_SMART_SHADOW_PERCENT:-1}
      - FEED_BUCKET_PUBLIC=false
      - FEED_BUCKET=${FEED_BUCKET:-gafus-feed-private}
      - FEED_S3_ENDPOINT=${FEED_S3_ENDPOINT:-https://s3.cloud.ru}
      - FEED_S3_ACCESS_KEY_ID=${FEED_S3_ACCESS_KEY_ID:-}
      - FEED_S3_SECRET_ACCESS_KEY=${FEED_S3_SECRET_ACCESS_KEY:-}
      - FEED_CDN_BASE_URL=${FEED_CDN_BASE_URL:-https://quepraquiecebquomiel.begetcdn.cloud}
      - FEED_CDN_PROVIDER=${FEED_CDN_PROVIDER:-beget}
      - FEED_CDN_EDGE_TOKEN_VERIFIED=${FEED_CDN_EDGE_TOKEN_VERIFIED:-false}
      - FEED_MEDIA_FALLBACK_ENABLED=${FEED_MEDIA_FALLBACK_ENABLED:-false}
      - FEED_PUBLIC_BROWSER_CACHE_24H_VERIFIED=${FEED_PUBLIC_BROWSER_CACHE_24H_VERIFIED:-false}
      - FEED_CDN_BROWSER_CACHE_24H_VERIFIED=${FEED_CDN_BROWSER_CACHE_24H_VERIFIED:-false}
      - MEDIA_CDN_PURGE_WORKER_ENABLED=${MEDIA_CDN_PURGE_WORKER_ENABLED:-false}
      - BEGET_CDN_PURGE_API_VERIFIED=${BEGET_CDN_PURGE_API_VERIFIED:-false}
      - BEGET_CDN_CACHE_KEY_VERIFIED=${BEGET_CDN_CACHE_KEY_VERIFIED:-false}
      - BEGET_CDN_PURGE_PROPAGATION_VERIFIED=${BEGET_CDN_PURGE_PROPAGATION_VERIFIED:-false}
      - CDN_HEALTH_MONITOR_ENABLED=${CDN_HEALTH_MONITOR_ENABLED:-false}
      - FEED_CDN_SECRET=${FEED_CDN_SECRET:-}
      - FEED_INTERNAL_HMAC_SECRET=${FEED_INTERNAL_HMAC_SECRET:-}
      # VK ID (mobile auth, vk-link)
      - VK_CLIENT_ID=${VK_CLIENT_ID}
      - VK_CLIENT_ID_IOS=${VK_CLIENT_ID_IOS}
      - VK_CLIENT_ID_ANDROID=${VK_CLIENT_ID_ANDROID}
      - VK_MOBILE_REDIRECT_URI=${VK_MOBILE_REDIRECT_URI:-gafus://auth/vk}
      # Минимальная версия store-сборки. Поднять после публикации новой версии в сторах.
      - MOBILE_IOS_MIN_VERSION=${MOBILE_IOS_MIN_VERSION:-1.7.2}
      - MOBILE_ANDROID_MIN_VERSION=${MOBILE_ANDROID_MIN_VERSION:-1.7.2}
      - MOBILE_IOS_STORE_URL=${MOBILE_IOS_STORE_URL:-https://apps.apple.com/ru/app/gafus/id6760964612}
      - MOBILE_ANDROID_STORE_URL=${MOBILE_ANDROID_STORE_URL:-https://www.rustore.ru/catalog/app/ru.gafus.app}
      - MAIL_PROVIDER=${MAIL_PROVIDER:-resend}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET:-}
      - MAIL_OUTBOX_ENABLED=${MAIL_OUTBOX_ENABLED:-false}
      - MAIL_OUTBOX_ENCRYPTION_KEY=${MAIL_OUTBOX_ENCRYPTION_KEY:-}
      - MAIL_REPLY_TO=${MAIL_REPLY_TO:-api@gafus.ru}
      - RESEND_FROM=${RESEND_FROM:-notifications@notify.gafus.ru}
      - SMTP_HOST=${SMTP_HOST:-smtp.yandex.ru}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM:-api@gafus.ru}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Гафус}
    volumes:
      - ${APPLE_PRIVATE_KEY_HOST_PATH:-/opt/gafus/secrets/AuthKey_FZ3FFU78RN.p8}:${APPLE_PRIVATE_KEY_PATH:-/run/secrets/apple_app_store_connect_api_key.p8}:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: gafus-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    command: >
      sh -c "
        echo 'Starting nginx with CDN configuration...' &&
        rm -rf /var/cache/nginx/cdn &&
        nginx -g 'daemon off;'
      "
    restart: unless-stopped
    depends_on:
      - web
      - trainer-panel
      - admin-panel
      - api
      - bull-board

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot
    container_name: gafus-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email admin@gafus.ru --agree-tos --no-eff-email -d gafus.ru -d www.gafus.ru -d api.gafus.ru -d trainer-panel.gafus.ru -d adminka.gafus.ru -d queues.gafus.ru
    depends_on:
      - nginx

  # Node Exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: gafus-node-exporter
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /run/udev:/run/udev:ro
    network_mode: host
    restart: unless-stopped
    pid: host

  # PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: gafus-postgres-exporter
    command:
      - "--config.file=/etc/postgres_exporter/postgres_exporter.yml"
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-gafus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gafus}?sslmode=disable
    volumes:
      - ./postgres-exporter/postgres_exporter.yml:/etc/postgres_exporter/postgres_exporter.yml:ro
    restart: unless-stopped
    depends_on:
      - postgres

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: gafus-redis-exporter
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    restart: unless-stopped
    depends_on:
      - redis

  # Blackbox Exporter для проверки HTTP endpoints (health checks)
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: gafus-blackbox-exporter
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    volumes:
      - ./blackbox:/etc/blackbox_exporter
    restart: unless-stopped

  # Grafana Alloy — сбор метрик и remote_write в Yandex Monitoring
  grafana-alloy:
    image: grafana/alloy:v1.8.2
    container_name: gafus-alloy
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./prometheus:/etc/alloy:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - YC_MONITORING_API_KEY=${YC_MONITORING_API_KEY}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "grep -q ':3039 .* 0A ' /proc/net/tcp /proc/net/tcp6",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - node-exporter
      - postgres-exporter
      - blackbox-exporter

  # Синхронизирует метрики из Prometheus workspace в нативный Yandex Monitoring.
  # Это нужно для ChartWidget в мобильном приложении Yandex Cloud
  # (MultiSourceChartWidget с PrometheusTarget не поддерживается мобильным клиентом).
  yandex-metrics-sync:
    image: python:3.12-alpine
    container_name: gafus-yandex-metrics-sync
    command: >
      sh -c "while true; do python /scripts/sync-metrics-to-yandex-native.py; sleep 60; done"
    volumes:
      - ../../scripts/sync-metrics-to-yandex-native.py:/scripts/sync-metrics-to-yandex-native.py:ro
    environment:
      - YC_MONITORING_API_KEY=${YC_MONITORING_API_KEY}
      - YC_FOLDER_ID=b1g0vbm2pvav4oqc4ds9
      - YC_PROMETHEUS_WORKSPACE_ID=monj8dpjri8u0bbqvq71
    restart: unless-stopped
    depends_on:
      - grafana-alloy

volumes:
  postgres_data:
