# AG4-INFRA-032: STANDALONE NONPROD SOURCE-ONLY CONFIG -- NOT deployed.
# Never include from production nginx; no prod hostname, credentials, or mounts.
# Requires separately built (not built here) local Vite dist outputs.
# Synthetic local-only Hono upstream is 127.0.0.1:4188 (NOT running).
worker_processes 1;
error_log stderr warn;
pid /Users/asmtv1/Desktop/gafus-refactor/scripts/refactor/infra032-spa-local.pid;
events { worker_connections 64; }
http {
  access_log off;
  default_type application/octet-stream;
  server_tokens off;
  types {
    text/html html;
    text/css css;
    application/javascript js mjs;
    application/json json;
    image/svg+xml svg;
    image/png png;
    image/jpeg jpg jpeg;
    image/webp webp;
    image/x-icon ico;
    font/woff2 woff2;
    application/wasm wasm;
    text/plain txt;
  }

  # Web Vite: loopback only, never exposed to production network.
  server {
    listen 127.0.0.1:5180;
    server_name localhost;
    root /Users/asmtv1/Desktop/gafus-refactor/apps/web-vite/dist;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options "nosniff" always;
    # All API statuses remain upstream; proxy_pass has no URI suffix.
    location ^~ /api/v1/ {
      proxy_pass http://127.0.0.1:4188;
      proxy_http_version 1.1;
      proxy_intercept_errors off;
      proxy_redirect off;
      proxy_cache off;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
      proxy_hide_header Cache-Control;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Authorization $http_authorization;
      add_header Cache-Control "private, no-store, max-age=0" always;
      add_header X-Content-Type-Options "nosniff" always;
    }
    # Unknown API URLs never receive SPA HTML.
    location = /api/v1 {
      add_header Cache-Control "private, no-store, max-age=0" always;
      return 404;
    }
    location ^~ /api/ {
      add_header Cache-Control "private, no-store, max-age=0" always;
      return 404;
    }
    # Retired PWA endpoints: not index.html or stale scripts.
    location ~* ^/(?:sw\.js|service-worker\.js|workbox-[^/]*\.[cm]?js|manifest\.(?:json|webmanifest)|site\.webmanifest)$ {
      add_header Cache-Control "no-store, max-age=0" always;
      return 404;
    }
    # Existing Vite hashed assets; missing files stay 404.
    location ^~ /assets/ {
      add_header Cache-Control "no-store, max-age=0" always;
      try_files $uri =404;
    }
    location ~* \.(?:html|js|mjs|css|map|json|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|eot|pdf|txt|webmanifest|wasm|mp4|webm)$ {
      add_header Cache-Control "no-store, max-age=0" always;
      try_files $uri =404;
    }
    # HTML entrypoint and direct SPA routes not cached.
    location = /index.html {
      add_header Cache-Control "no-store, max-age=0" always;
      try_files /index.html =404;
    }
    location / {
      add_header Cache-Control "no-store, max-age=0" always;
      try_files $uri /index.html;
    }
  }

