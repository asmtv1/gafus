# NONPROD artifact-only SPA; nginxinc/nginx-unprivileged conf.d server context.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  autoindex off;
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;

  # This image is deliberately NOT an API gateway. Never return index.html for API.
  location = /api { add_header Cache-Control "no-store" always; return 404; }
  location ^~ /api/ { add_header Cache-Control "no-store" always; return 404; }

  # Retire registrations for new clients; previously installed SW needs a separate plan.
  location ~* ^/(?:sw\.js|service-worker\.js|workbox-[^/]*\.[cm]?js|manifest\.(?:json|webmanifest)|site\.webmanifest)$ {
    add_header Cache-Control "no-store, max-age=0" always;
    return 404;
  }

  # Only curated hashed assets may be included in this image. Never cache a missing asset.
  # The named miss handler prevents the 404 inheriting success-only immutable headers.
  location ^~ /assets/ {
    try_files $uri @asset_missing;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }
  location @asset_missing {
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 404;
  }
  # Other missing static files never rewrite to HTML.
  location ~* \.(?:js|mjs|css|map|json|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|wasm|mp4|webm|txt|webmanifest)$ {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-store, max-age=0" always;
    try_files /index.html =404;
  }
  location / {
    add_header Cache-Control "no-store, max-age=0" always;
    try_files $uri /index.html;
  }
}
