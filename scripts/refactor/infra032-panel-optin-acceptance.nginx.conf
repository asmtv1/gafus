# AG4-INFRA032 -- ISOLATED LOCAL NONPROD ACCEPTANCE, NEVER included in production.
# No API upstream, no external host, no secrets, no legacy/Next dependency.
# All file paths are confined to /Users/asmtv1/Desktop/gafus-refactor.
worker_processes 1;
error_log /Users/asmtv1/Desktop/gafus-refactor/scripts/refactor/infra032-panel-loopback-run.log notice;
pid /Users/asmtv1/Desktop/gafus-refactor/scripts/refactor/infra032-panel-loopback.pid;
events { worker_connections 32; }
http {
  access_log off;
  server_tokens off;
  default_type application/octet-stream;
  types { text/html html; application/javascript js mjs; }
  server {
    listen 127.0.0.1:5188;
    server_name localhost 127.0.0.1;
    root /Users/asmtv1/Desktop/gafus-refactor;
    autoindex off;
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Exact hashed artifacts from the accepted current Vite builds only.
    location = /assets/index-Cs6AsiU8.js {
      alias /Users/asmtv1/Desktop/gafus-refactor/scripts/refactor/infra032-vite-acceptance-trainer-20261022/assets/index-Cs6AsiU8.js;
      default_type application/javascript;
    }
    location = /assets/index-C5VI_C_m.js {
      alias /Users/asmtv1/Desktop/gafus-refactor/scripts/refactor/infra032-vite-acceptance-admin-20261022/assets/index-C5VI_C_m.js;
      default_type application/javascript;
    }
    location ^~ /assets/ { return 404; }
    # Never route the API to SPA; there is intentionally NO proxy_pass.
    location = /api { return 404; }
    location ^~ /api/ { return 404; }
    location ~* ^/(?:trainer|admin)/(?:api(?:/|$)|.*(?:\.env|/\.git|/\.well-known)) { return 404; }
    # Retired offline/PWA assets are blocked even with a SPA prefix.
    location ~* ^/(?:trainer/|admin/)?(?:sw\.js|service-worker\.js|workbox-[^/]*\.[cm]?js|manifest\.(?:json|webmanifest)|site\.webmanifest)$ { return 404; }
    # Missing static files must NOT receive a 200 HTML app shell.
    location ~* ^/(?:trainer|admin)/.*\.(?:html|js|mjs|css|map|json|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|pdf|webmanifest|wasm|mp4|webm)$ { return 404; }
    location ~* ^/.*\.(?:html|js|mjs|css|map|json|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|pdf|webmanifest|wasm|mp4|webm)$ { return 404; }
    # SPA direct URLs and refreshes use exact CURRENT build index (HTML only).
    location = /trainer {
      types {}
      default_type text/html;
      try_files /scripts/refactor/infra032-vite-acceptance-trainer-20261022/index.html =404;
    }
    location /trainer/ {
      types {}
      default_type text/html;
      try_files /scripts/refactor/infra032-vite-acceptance-trainer-20261022/index.html =404;
    }
    location = /admin {
      types {}
      default_type text/html;
      try_files /scripts/refactor/infra032-vite-acceptance-admin-20261022/index.html =404;
    }
    location /admin/ {
      types {}
      default_type text/html;
      try_files /scripts/refactor/infra032-vite-acceptance-admin-20261022/index.html =404;
    }
    location / { return 404; }
  }
}
